/* ═══════════════════════════════════════════════════════════════════
   COPIA DE SEGURIDAD

   Antes solo se podía DESCARGAR. Una copia que no se puede devolver no es una
   copia: si se borraban los datos del navegador, ese archivo no servía de
   nada. Ahora se puede restaurar.

   Cómo funciona la restauración, y por qué así:

   La app guarda aparte los datos base (dentro del propio HTML, las 860 tal
   como salieron del ERP) y TUS cambios (en el navegador). El archivo de copia,
   en cambio, lleva el resultado ya mezclado.

   Así que restaurar no es "pegar el archivo": es COMPARAR el archivo con los
   datos base y deducir qué cambió. Tiene tres ventajas que importan:

     · funciona con las copias antiguas, hechas antes de que esto existiera;
     · funciona aunque el archivo venga de una versión anterior de la app;
     · no toca lo que no cambió, así que una mejora futura de los datos base
       no se pierde al restaurar.
   ═══════════════════════════════════════════════════════════════════ */

/** Los datos tal como salieron del ERP, sin tus cambios encima.
    Se leen del propio HTML y solo cuando hacen falta: parsear 600 KB para
    tenerlos siempre en memoria sería tirar el móvil por la ventana. */
function datosBase(){
  return JSON.parse(TEXTO_BASE);
}

const igual = (a, b) => JSON.stringify(a) === JSON.stringify(b);

/** Qué se ha cambiado en `archivo` respecto a los datos base. */
function reconciliar(archivo){
  const base = datosBase();
  const baseF = new Map(base.formulas.map(f=>[f.id, f]));
  const baseM = new Map(base.materias_primas.map(m=>[m.id, m]));
  const nuevo = {formulas:{}, nuevas:[], borradas:[], materias:[]};
  const vistas = new Set();

  // Los campos que la app deja tocar. Comparar el objeto entero marcaría como
  // "cambiada" cualquier fórmula si un día añado un campo nuevo a los datos.
  const CAMPOS = ['nombre','ingredientes','notas','actualizada_pigmentos',
                  'fecha_actualizacion','historial','preparaciones',
                  'ultima_preparacion','total','equivalencia'];

  for(const f of (archivo.formulas || [])){
    if(!f || !f.id) continue;
    vistas.add(f.id);
    const orig = baseF.get(f.id);
    if(!orig){ nuevo.nuevas.push(f); continue; }
    const parche = {};
    for(const k of CAMPOS)
      if(k in f && !igual(f[k], orig[k])) parche[k] = f[k];
    if(Object.keys(parche).length) nuevo.formulas[f.id] = parche;
  }
  for(const f of base.formulas)
    if(!vistas.has(f.id)) nuevo.borradas.push(f.id);

  // Materias: las nuevas, y también las de siempre a las que se les haya
  // cambiado algo (la fecha del pigmento). Antes solo se miraban las nuevas y
  // al restaurar se perdía qué pigmentos habías marcado como cambiados.
  const CAMPOS_M = ['nombre','hex_referencia','cambiado_el','abierto','tipo',
                    'familia','fuerza','opacidad','revisar','nota','solo_referencia'];
  for(const m of (archivo.materias_primas || [])){
    if(!m || !m.id) continue;
    const orig = baseM.get(m.id);
    if(!orig){ nuevo.materias.push(m); continue; }
    if(CAMPOS_M.some(k => (k in m) && !igual(m[k], orig[k]))) nuevo.materias.push(m);
  }

  return nuevo;
}

function contarCambios(c){
  return Object.keys(c.formulas||{}).length + (c.nuevas||[]).length +
         (c.borradas||[]).length + (c.materias||[]).length;
}

/* ── La copia de seguridad, recordada ────────────────────────────────────

   Desde que la nube es la verdad, es también el único sitio donde están las
   860. El plan gratuito no da copias de verdad, así que la única red de
   seguridad es este archivo... y "descárgatelo de vez en cuando" es una
   instrucción que no cumple nadie.

   Así que lo dice la app. A los 30 días, y se puede aplazar una semana. Solo
   al editor: el taller no puede descargarlo, avisarle sería mandarle a hacer
   algo que la app no le deja. */
const CLAVE_COPIA = 'ultima-copia';
const CLAVE_COPIA_LUEGO = 'copia-aplazada';
const DIAS_COPIA = 30;
const DIA = 86400000;

const leerFecha = k => { try{ return +localStorage.getItem(k) || 0; }catch(_){ return 0; } };
const ponerFecha = (k, v) => { try{ localStorage.setItem(k, String(v)); }catch(_){} };

function avisarCopia(){
  if(!puedeEditar || document.querySelector('.avisa-copia')) return;
  const ultima = leerFecha(CLAVE_COPIA);
  const luego  = leerFecha(CLAVE_COPIA_LUEGO);
  if(Date.now() - luego < 7 * DIA) return;              // aplazado hace poco
  const dias = ultima ? Math.floor((Date.now() - ultima) / DIA) : null;
  if(ultima && dias < DIAS_COPIA) return;
  const el = document.createElement('div');
  el.className = 'actualiza avisa-copia';
  el.innerHTML = `<span>${ultima
      ? `Hace <b>${dias >= 60 ? Math.floor(dias/30) + ' meses' : dias + ' días'}</b> que no descargas copia del recetario`
      : '<b>No has descargado nunca una copia</b> del recetario'}</span>
    <button type="button" data-ya>Descargar</button>
    <button type="button" data-tirar>Luego</button>`;
  el.querySelector('[data-ya]').onclick = ()=>{ el.remove(); exportar(); };
  el.querySelector('[data-tirar]').onclick = ()=>{
    el.remove(); ponerFecha(CLAVE_COPIA_LUEGO, Date.now());
  };
  document.body.appendChild(el);
}

function exportar(){
  ponerFecha(CLAVE_COPIA, Date.now());
  ponerFecha(CLAVE_COPIA_LUEGO, 0);
  document.querySelector('.avisa-copia')?.remove();
  // Se guarda el resultado ya mezclado —que es legible y sirve de archivo por
  // sí solo— y además, por comodidad, el resumen de qué cambió.
  const copia = {
    app: 'colores-seriadornos', version: 1,
    fecha: new Date().toISOString(),
    resumen: {formulas: DATOS.formulas.length,
              materias_primas: DATOS.materias_primas.length,
              preparaciones: HISTORIAL.length,
              cambios: contarCambios(cambios)},
    ...DATOS,
    // El cuaderno va dentro de la copia: es trabajo apuntado y perderlo al
    // restaurar sería tan malo como perder una fórmula.
    historial_preparaciones: HISTORIAL,
  };
  const blob = new Blob([JSON.stringify(copia,null,1)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `colores_seriadornos_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/** Lee el archivo, enseña QUÉ va a pasar y espera confirmación.
    Restaurar pisa lo que hay ahora, así que nunca se hace de golpe. */
function importar(archivoFile){
  if(!puedeEditar) return brindis(SIN_PERMISO);
  const lector = new FileReader();
  lector.onerror = ()=>brindis('No se ha podido leer el archivo');
  lector.onload = ()=>{
    let j;
    try{ j = JSON.parse(lector.result); }
    catch(_){ return brindis('Ese archivo no es una copia válida'); }
    if(!j || !Array.isArray(j.formulas) || !j.formulas.length)
      return brindis('Ese archivo no tiene fórmulas dentro');
    // El cuaderno se FUNDE, no se sustituye: si la copia es de hace un mes,
    // lo apuntado desde entonces no tiene por qué desaparecer.
    fundirHistorial(j.historial_preparaciones || []);

    const nuevo = reconciliar(j);
    const n = contarCambios(nuevo);
    const ahora = contarCambios(cambios);
    const fecha = j.fecha ? new Date(j.fecha).toLocaleString('es-ES',
      {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : null;

    $dt.textContent = 'Restaurar una copia';
    $dc.innerHTML = `
      <p style="margin-top:0">La copia tiene <b class="num">${j.formulas.length}</b> fórmulas${
        fecha ? ` y es del <b>${esc(fecha)}</b>` : ''}.</p>
      <div class="aviso info">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.2v.1"/></svg>
        <span>Trae <b>${n} cambio${n===1?'':'s'}</b> respecto a los datos originales:
        ${[[Object.keys(nuevo.formulas).length,'fórmula','fórmulas','editada','editadas'],
           [nuevo.nuevas.length,'fórmula','fórmulas','nueva','nuevas'],
           [nuevo.borradas.length,'fórmula','fórmulas','eliminada','eliminadas'],
           [nuevo.materias.length,'materia prima','materias primas','añadida','añadidas']]
          .filter(x=>x[0]).map(([q,s1,s2,a1,a2])=>`${q} ${q===1?s1:s2} ${q===1?a1:a2}`)
          .join(' · ') || 'ninguno'}.</span></div>
      ${ahora ? `<div class="aviso">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.2v.1"/></svg>
        <span>Ojo: en este dispositivo tienes <b>${ahora} cambio${ahora===1?'':'s'}</b> ahora mismo,
        y restaurar <b>los sustituye</b> por los de la copia. Si no estás seguro,
        descarga primero una copia de lo que tienes.</span></div>` : ''}`;
    $dp.innerHTML = `<button class="btn" data-cerrar>Cancelar</button>
      ${ahora ? `<button class="btn" id="imp-antes">Descargar lo de ahora</button>` : ''}
      <button class="btn btn-1" id="imp-si">Restaurar</button>`;
    $dp.querySelector('[data-cerrar]').onclick = ()=>$dlg.close();
    document.getElementById('imp-antes')?.addEventListener('click', exportar);
    document.getElementById('imp-si').onclick = async ()=>{
      if(MODO === 'nube'){
        // En la nube no basta con dejarlo en este aparato: hay que mandarlo,
        // o el móvil del taller seguiría con lo de antes y nadie sabría por
        // qué. Se sube fórmula a fórmula para poder enseñar el avance y para
        // que un corte por la mitad deje subido lo que ya iba.
        const b = document.getElementById('imp-si');
        b.disabled = true;
        const lista = [...Object.keys(nuevo.formulas).map(id=>({id, parche:nuevo.formulas[id]})),
                       ...nuevo.nuevas.map(f=>({id:f.id, nueva:f}))];
        let hechas = 0, fallos = 0;
        for(const it of lista){
          let f = porId.get(it.id);
          if(it.nueva && !f){
            f = it.nueva;
            DATOS.formulas.push(f); porId.set(f.id, f);
            busq.push({f, n:norm(f.nombre), ing:norm((f.ingredientes||[]).map(i=>i.nombre).join(' '))});
          }else if(f && it.parche){ Object.assign(f, it.parche); cacheColor.delete(f.id);
            const e2 = busq.find(x=>x.f.id===f.id);
            if(e2){ e2.n = norm(f.nombre); e2.ing = norm(f.ingredientes.map(i=>i.nombre).join(' ')); } }
          if(!f) continue;
          try{ await nube.guardarFormula(f); }catch(_){ fallos++; }
          hechas++;
          b.textContent = `Subiendo… ${hechas}/${lista.length}`;
        }
        for(const m of (nuevo.materias||[])){
          if(!materias.has(m.id)){ DATOS.materias_primas.push(m); materias.set(m.id, m); }
          try{ await nube.guardarMateria(m); }catch(_){ fallos++; }
        }
        for(const id of (nuevo.borradas||[])){
          const f = porId.get(id); if(!f) continue;
          DATOS.formulas = DATOS.formulas.filter(x=>x.id!==id);
          porId.delete(id);
          const k = busq.findIndex(x=>x.f.id===id); if(k>=0) busq.splice(k,1);
          try{ await nube.guardarFormula({...f, borrada:true}); }catch(_){ fallos++; }
        }
        DATOS.formulas.sort((a,b2)=>a.nombre.localeCompare(b2.nombre,'es'));
        guardar();
        $dlg.close();
        reconstruir(); actualizar();
        brindis(fallos ? `Restaurado, pero ${fallos} no han subido` : 'Restaurado y subido a la nube');
        return;
      }
      cambios = nuevo;
      if(!guardar()) return;
      location.reload();
    };
    if(!$dlg.open) $dlg.showModal();
  };
  lector.readAsText(archivoFile);
}

/* ═══════════════════════════════════════════════════════════════════
   IDEA 18 · ETIQUETA PARA EL BOTE

   Se imprime a tamaño de etiqueta de verdad (95 x 62 mm) arriba a la
   izquierda del folio, con una guía de corte. Una hoja A4 entera para una
   etiqueta de un bote no la quiere nadie, y estirar el diseño a A4 hace que
   el nombre salga a cuerpo 60 y la fórmula perdida en medio del folio.

   Lleva lo que hace falta para no tener que abrir la app con el bote en la
   mano: el color, el nombre, el cliente, la fórmula EN GRAMOS DE ESE LOTE,
   el total y la fecha.
   ═══════════════════════════════════════════════════════════════════ */
/* Las ventanas de impresión son documentos nuevos y vacíos: no heredan nada
   de esta página. Se les pasan las mismas @font-face —con la tipografía ya en
   base64 dentro— para que el papel salga con las cifras de ancho fijo y el
   cero rayado, que en una hoja de fórmulas es justo lo que hay que leer sin
   equivocarse. Si por lo que sea no se pueden leer, se imprime con la del
   sistema y no pasa nada. */
function tipografiaIncrustada(){
  try{
    return [...document.styleSheets]
      .flatMap(h=>{ try{ return [...h.cssRules]; }catch(_){ return []; } })
      .filter(r=>r instanceof CSSFontFaceRule)
      .map(r=>r.cssText).join('\n');
  }catch(_){ return ''; }
}

/* ═══════════════════════════════════════════════════════════════════
   ETIQUETAS PARA LOS BOTES

   Dos caminos al mismo sitio:
     · una suelta, desde la ficha o desde el pesaje;
     · una hoja entera, eligiendo colores en el buscador y la cantidad de
       cada uno, para aprovechar el folio.

   La etiqueta lleva lo que él pidió y nada más: nombre del color, la fórmula
   y SeriAdornos abajo.
   ═══════════════════════════════════════════════════════════════════ */

/* Las cantidades del taller. El bote de 1 kg NO se llena hasta arriba: hay
   que batirlo, así que "el bote entero" son 900 g y nunca se pasa de 950.
   Lo mismo con el de 5 kg. */
const CANTIDADES_ETIQUETA = [
  {g: 450,  eti: '½ bote',  tit: 'Medio bote de 1 kg'},
  {g: 900,  eti: '1 kg',    tit: 'Bote de 1 kg lleno, dejando sitio para batir'},
  {g: 4500, eti: '5 kg',    tit: 'Bote de 5 kg'},
];

/* El lote que se imprime en la etiqueta.

   Manda la PROPORCIÓN EXACTA: se prefiere un múltiplo justo de la receta
   —donde no hay que redondear nada y el color sale clavado— aunque se aleje
   algo de la cifra pedida (897 en vez de 900). Solo si el múltiplo justo se
   va demasiado lejos, o se pasa de lo que cabe en el bote, se cae al reparto
   práctico, que se acerca más a cambio de un desvío pequeño. */
function loteParaEtiqueta(cant, objetivo){
  const tope = TOPE_BOTE[objetivo] || Infinity;
  const fiable = loteFiable(cant, objetivo, PRECISION);
  if(fiable && fiable.total <= tope && Math.abs(fiable.total - objetivo) <= objetivo * 0.12)
    return fiable;
  return lotePractico(cant, objetivo, {paso: PRECISION, tope}) || fiable || null;
}

/** Una etiqueta suelta, con las cantidades que ya tienes delante. */
function etiqueta(f, cantidades, total, nombres){
  imprimirEtiquetas([{
    nombre: f.nombre,
    nombres: nombres || f.ingredientes.map(i=>i.nombre),
    cantidades, total,
  }]);
}

/* Ocho por folio: 2 columnas de 95 mm y 4 filas de 62 mm caben justas en un
   A4 con 10 mm de margen. Van pegadas a propósito, compartiendo la línea de
   corte: se recorta la hoja de un tijeretazo por cada raya en vez de ir
   bordeando etiqueta por etiqueta. */
const ET_POR_HOJA = 8;

function imprimirEtiquetas(items){
  if(!items.length) return brindis('No hay ninguna etiqueta que imprimir');
  const w = window.open('','_blank');
  if(!w) return brindis('El navegador ha bloqueado la ventana de las etiquetas');

  const una = e => `<div class="et">
      <h1>${esc(e.nombre)}</h1>
      <table>${e.nombres.map((n,k)=>
        `<tr><td class="n">${esc(n)}</td><td class="g">${fmt(e.cantidades[k])}</td></tr>`).join('')}</table>
      <div class="pie">
        <div class="tot"><span>Total</span>${fmt(e.total)} g</div>
        <div class="marca"><b>S</b>ERI<b>A</b>DORNOS</div>
      </div>
    </div>`;

  const cols = items.length === 1 ? 1 : 2;
  const hojas = [];
  for(let i = 0; i < items.length; i += ET_POR_HOJA)
    hojas.push(`<section class="hoja">${items.slice(i, i+ET_POR_HOJA).map(una).join('')}</section>`);

  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
  <title>${items.length === 1 ? 'Etiqueta — ' + esc(items[0].nombre)
                              : 'Etiquetas (' + items.length + ')'}</title>
  <style>
    ${tipografiaIncrustada()}
    @page{size:A4; margin:10mm}
    *{box-sizing:border-box}
    body{margin:0;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact;
         font-family:"Plex",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
         font-variant-numeric:tabular-nums slashed-zero}
    /* La línea de corte va en dos lados de cada etiqueta y el resto lo cierra
       la hoja: así entre dos etiquetas hay UNA raya, no dos pegadas. */
    .hoja{display:grid; grid-template-columns:repeat(${cols},95mm); width:${cols*95}mm;
          border-top:.3mm dashed #bbb; border-left:.3mm dashed #bbb}
    .hoja + .hoja{page-break-before:always}
    .et{width:95mm; height:62mm; padding:5mm 6mm 4mm; overflow:hidden;
        display:flex; flex-direction:column;
        border-right:.3mm dashed #bbb; border-bottom:.3mm dashed #bbb;
        page-break-inside:avoid}
    h1{margin:0;font-size:15pt;line-height:1.05;letter-spacing:-.02em;font-weight:700;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}
    /* --esc lo ajusta el propio documento antes de imprimir: ver más abajo. */
    table{width:100%;border-collapse:collapse;flex:0 0 auto;
          margin-top:calc(3.5mm * var(--esc,1));
          border-top:.4mm solid #222;padding-top:2mm}
    td{padding:calc(1mm * var(--esc,1)) 0;font-size:calc(9.5pt * var(--esc,1));vertical-align:baseline}
    td.n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62mm}
    td.g{text-align:right;font-weight:700;white-space:nowrap}
    td.g::after{content:" g";font-weight:400;color:#666;font-size:.8em}
    .pie{display:flex;justify-content:space-between;align-items:flex-end;
         border-top:.4mm solid #222;padding-top:2mm;margin-top:auto;flex:0 0 auto}
    .pie .tot{font-size:12pt;font-weight:700}
    .pie .tot span{font-size:8pt;font-weight:600;color:#555;letter-spacing:.06em;
                   text-transform:uppercase;margin-right:2mm}
    /* Sin degradados sobre texto: en papel el motor de impresión no los
       recorta a la letra y salen los rectángulos detrás de cada carácter. */
    .marca{font-style:italic;font-weight:800;font-size:9pt;color:#9b9da1;letter-spacing:.01em}
    .marca b{color:#b61517;font-size:1.25em;line-height:0}
  </style></head><body>
  ${hojas.join('')}
  <script>
    /* Una fórmula larga no cabe. En vez de adivinar cuántas filas entran, se
       mide etiqueta por etiqueta y se encoge la letra de su lista hasta que
       cabe. Con las de hoy (seis ingredientes como mucho) casi no toca nada.

       OJO al orden: hay que medir DESPUÉS de que la tipografía esté cargada.
       Midiendo antes, el navegador aún usa la de reserva, que ocupa distinto,
       y la cuenta sale mal: una fórmula de seis se salía por abajo. */
    function encajar(){
      document.querySelectorAll('.et').forEach(function(et){
        var f = 1;
        et.style.removeProperty('--esc');
        while(et.scrollHeight > et.clientHeight + 0.5 && f > 0.55){
          f -= 0.04; et.style.setProperty('--esc', f.toFixed(2));
        }
      });
    }
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve())
      .then(function(){ encajar(); setTimeout(function(){ window.print(); }, 250); });
  <\/script>
  </body></html>`);
  w.document.close();
}

/* Buscador para ir AÑADIENDO colores a la hoja. Se parece al de ingredientes
   pero no guarda selección: en cuanto eliges uno lo suelta y se vacía, que es
   lo que quieres cuando estás metiendo doce seguidos. */
function selectorFormula(alElegir){
  const items = DATOS.formulas.map(x=>({v:x.id, nombre:x.nombre, formula:x, n:norm(x.nombre)}));
  let activo = 0, abierto = false, lista = [];

  const caja = document.createElement('div');
  caja.className = 'busc';
  caja.innerHTML = `
    <div class="busc-campo">
      <span class="busc-color busc-sin-color"></span>
      <input class="busc-q" type="text" autocomplete="off" spellcheck="false"
             placeholder="Escribe un color y pulsa Intro para añadirlo…" role="combobox"
             aria-expanded="false" aria-autocomplete="list">
    </div>
    <div class="busc-lista" role="listbox" hidden></div>`;
  const $q = caja.querySelector('.busc-q');
  const $l = caja.querySelector('.busc-lista');

  function buscar(t){
    const q = norm(t);
    if(!q) return items.slice(0,60);
    const pal = q.split(' ');
    const res = [];
    for(const i of items){
      if(!pal.every(p=>i.n.includes(p))) continue;
      res.push({i, p: i.n === q ? 0 : i.n.startsWith(q) ? 1 : 2});
    }
    res.sort((a,b)=> a.p-b.p || a.i.nombre.length-b.i.nombre.length ||
                     a.i.nombre.localeCompare(b.i.nombre,'es'));
    return res.slice(0,60).map(r=>r.i);
  }
  function pintarLista(){
    if(!lista.length){
      $l.innerHTML = `<div class="busc-nada">Ninguna fórmula con ese nombre</div>`; return;
    }
    $l.innerHTML = lista.map((i,k)=>
      `<button type="button" class="busc-op${k===activo?' on':''}" data-k="${k}" role="option"
        aria-selected="${k===activo}"><i style="background:${color(i.formula).hex}"></i>${esc(i.nombre)}</button>`
    ).join('');
    $l.querySelector('.on')?.scrollIntoView({block:'nearest'});
  }
  function abrirL(){
    abierto = true; $l.hidden = false; $q.setAttribute('aria-expanded','true');
    lista = buscar($q.value); activo = 0; pintarLista();
  }
  function cerrar(){ abierto = false; $l.hidden = true; $q.setAttribute('aria-expanded','false'); }
  function elegir(k){
    if(!lista[k]) return;
    alElegir(lista[k].v);
    $q.value = ''; lista = buscar(''); activo = 0; pintarLista();
  }

  $q.addEventListener('focus', abrirL);
  $q.addEventListener('input', ()=>{ lista = buscar($q.value); activo = 0;
    if(!abierto) abrirL(); else pintarLista(); });
  $q.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      if(!abierto) return abrirL();
      activo = Math.max(0, Math.min(lista.length-1, activo + (e.key==='ArrowDown'?1:-1)));
      pintarLista();
    }else if(e.key==='Enter'){
      if(abierto){ e.preventDefault(); elegir(activo); }
    }else if(e.key==='Escape'){
      // Escape cierra SOLO la búsqueda; el diálogo se queda como está.
      if(abierto){ e.preventDefault(); e.stopPropagation(); cerrar(); }
    }
  });
  $l.addEventListener('mousedown', e=>{
    const b = e.target.closest('.busc-op');
    if(b){ e.preventDefault(); elegir(+b.dataset.k); $q.focus(); }
  });
  $q.addEventListener('blur', ()=>{ setTimeout(()=>{ if(abierto) cerrar(); }, 120); });

  return { el: caja, foco: ()=>$q.focus() };
}

/* ═══════════════════════════════════════════════════════════════════
   PDF — imprime exactamente lo que estás viendo
   ═══════════════════════════════════════════════════════════════════ */
/* La misma puerta para las dos cosas que se imprimen: el PDF de fórmulas y
   las hojas de etiquetas. Se abre siempre en "Fórmulas", que es lo de antes,
   así que quien venía a hacer el PDF no nota ningún paso de más. */
let modoImprimir = 'formulas';
let etiquetasHoja = [];          // [{id, objetivo, manual}] mientras dure el diálogo

document.getElementById('btn-pdf').onclick = ()=>{
  if(!puedeEditar) return brindis(MODO==='nube'?'Tu cuenta no puede imprimir':'Con esta contraseña no se puede imprimir');
  // Se empieza de cero cada vez. Antes las etiquetas de la última hoja se
  // quedaban puestas, y al volver a imprimir el PDF te encontrabas el diálogo
  // en la otra pestaña con ocho etiquetas de hace media hora. Comprobado.
  modoImprimir = 'formulas';
  etiquetasHoja = [];
  $dt.textContent = 'Imprimir';
  pintarImprimir();
  $dlg.showModal();
};

function pintarImprimir(){
  const seg = `<div class="seg" role="tablist">
    <button data-modo="formulas" aria-pressed="${modoImprimir==='formulas'}">PDF de fórmulas</button>
    <button data-modo="etiquetas" aria-pressed="${modoImprimir==='etiquetas'}">Etiquetas para botes</button>
  </div>`;
  if(modoImprimir === 'formulas') panelPdf(seg); else panelEtiquetas(seg);
  for(const b of $dc.querySelectorAll('[data-modo]'))
    b.onclick = ()=>{ modoImprimir = b.dataset.modo; pintarImprimir(); };
}

function panelPdf(seg){
  const q = $q.value.trim();
  $dc.innerHTML = seg + `
    <p style="margin-top:0">Se imprimirán <b class="num">${filtradas.length}</b> fórmulas${q?`, las que coinciden con <b>"${esc(q)}"</b>`:' (todas)'}.</p>
    <label class="campo"><span>Título de la portada</span>
      <input id="pdf-tit" value="COLORES SERIADORNOS" autocomplete="off"></label>
    <label class="campo"><span>Subtítulo (opcional)</span>
      <input id="pdf-sub" value="${q?esc(q.toUpperCase()):''}" placeholder="Ej. LEZNA" autocomplete="off"></label>
    <label class="interruptor"><input type="checkbox" id="pdf-solo-act"><span class="pista"></span>
      <span class="interruptor-txt">Solo las actualizadas a pigmentos nuevos
        <small>Deja fuera las que aún tienen cantidades antiguas</small></span></label>`;
  $dp.innerHTML = `<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-1" id="pdf-ir">Generar</button>`;
  $dp.querySelector('[data-cerrar]').onclick = ()=>$dlg.close();
  document.getElementById('pdf-ir').onclick = ()=>{
    const solo = document.getElementById('pdf-solo-act').checked;
    const lista = solo ? filtradas.filter(f=>estadoAct(f).aldia) : filtradas;
    if(!lista.length) return brindis('No hay ninguna fórmula que cumpla eso');
    generarPDF(lista, document.getElementById('pdf-tit').value, document.getElementById('pdf-sub').value);
    $dlg.close();
  };
}

/* Cada color de la hoja lleva SU cantidad: en el taller nunca se hace la misma
   de todo. Lo que se enseña debajo del nombre son los gramos de verdad que va
   a llevar la etiqueta, no la cifra que has pedido. */
function panelEtiquetas(seg){
  const hojas = Math.max(1, Math.ceil(etiquetasHoja.length / ET_POR_HOJA));
  const huecos = hojas * ET_POR_HOJA - etiquetasHoja.length;

  $dc.innerHTML = seg + `
    <div class="campo" style="margin-bottom:10px"><span>Añadir colores a la hoja</span>
      <div id="et-buscador"></div></div>
    <div class="et-pie" id="et-pie"></div>
    <div class="et-lista" id="et-lista"></div>`;

  const busc = selectorFormula(id=>{
    etiquetasHoja.push({id, objetivo: 900, manual: false});
    pintarEtiquetas();
  });
  document.getElementById('et-buscador').appendChild(busc.el);

  pintarEtiquetas();
  $dp.innerHTML = `<button class="btn" data-cerrar>Cerrar</button>
                   <button class="btn btn-1" id="et-ir">Imprimir</button>`;
  $dp.querySelector('[data-cerrar]').onclick = ()=>$dlg.close();
  document.getElementById('et-ir').onclick = ()=>{
    const items = etiquetasHoja.map(e=>{
      const f = porId.get(e.id); if(!f) return null;
      const ing = f.ingredientes.filter(i=>i.cantidad>0);
      const l = loteParaEtiqueta(ing.map(i=>i.cantidad), e.objetivo);
      if(!l) return null;
      return {nombre: f.nombre, nombres: ing.map(i=>i.nombre),
              cantidades: l.cantidades, total: l.total};
    }).filter(Boolean);
    if(!items.length) return brindis('Añade algún color a la hoja');
    imprimirEtiquetas(items);
    $dlg.close();
  };
  setTimeout(()=>busc.foco(), 60);
}

function pintarEtiquetas(){
  const $l = document.getElementById('et-lista');
  const $p = document.getElementById('et-pie');
  if(!$l) return;

  if(!etiquetasHoja.length){
    $l.innerHTML = `<div class="busc-nada" style="padding:22px 10px">
      Busca arriba y ve añadiendo colores. Caben <b>${ET_POR_HOJA}</b> por folio.</div>`;
  }else{
    $l.innerHTML = etiquetasHoja.map((e,k)=>{
      const f = porId.get(e.id);
      if(!f) return '';
      const ing = f.ingredientes.filter(i=>i.cantidad>0);
      const l = loteParaEtiqueta(ing.map(i=>i.cantidad), e.objetivo);
      const nota = !l
        ? `<small class="avisa">Esa cantidad no se puede repartir en gramos enteros</small>`
        : l.exacto
          ? `<small class="exacta">${fmt(l.total)} g · proporción exacta</small>`
          : `<small${l.error > 0.02 ? ' class="avisa"' : ''}>${fmt(l.total)} g · se desvía un ${(l.error*100).toFixed(l.error>0.02?0:1)}%</small>`;
      return `<div class="et-fila">
        <div class="et-color" style="background:${color(f).hex}"></div>
        <div class="et-nom"><b>${esc(f.nombre)}</b>${nota}</div>
        <div class="et-cant">
          ${CANTIDADES_ETIQUETA.map(c=>`<button data-set="${k}" data-g="${c.g}" title="${c.tit}"
              aria-pressed="${!e.manual && e.objetivo===c.g}">${c.eti}</button>`).join('')}
          ${e.manual
            ? `<input class="num" type="number" inputmode="numeric" min="1" step="1"
                      value="${e.objetivo}" data-manual="${k}" aria-label="Gramos">`
            : `<button data-abrir-manual="${k}" title="Escribir otra cantidad">Otra</button>`}
        </div>
        <button class="et-quitar" data-quitar="${k}" aria-label="Quitar de la hoja">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>`;
    }).join('');
  }

  const n = etiquetasHoja.length;
  const hojas = Math.max(1, Math.ceil(n / ET_POR_HOJA));
  const huecos = n ? hojas * ET_POR_HOJA - n : 0;
  $p.innerHTML = n
    ? `<span><b>${n}</b> etiqueta${n===1?'':'s'} · ${hojas} folio${hojas===1?'':'s'}${
        huecos ? ` · <b>${huecos}</b> hueco${huecos===1?'':'s'} libre${huecos===1?'':'s'}` : ' · folio completo'}</span>
       <button class="btn btn-fino" id="et-vaciar">Vaciar</button>`
    : `<span>Ninguna etiqueta todavía</span>`;

  for(const b of $l.querySelectorAll('[data-set]'))
    b.onclick = ()=>{ const e = etiquetasHoja[+b.dataset.set];
      e.objetivo = +b.dataset.g; e.manual = false; pintarEtiquetas(); };
  for(const b of $l.querySelectorAll('[data-abrir-manual]'))
    b.onclick = ()=>{ etiquetasHoja[+b.dataset.abrirManual].manual = true; pintarEtiquetas();
      const c = $l.querySelector(`[data-manual="${b.dataset.abrirManual}"]`); c?.focus(); c?.select(); };
  for(const c of $l.querySelectorAll('[data-manual]')){
    let t;
    c.oninput = ()=>{ const v = Math.round(parseFloat(c.value));
      if(!(v > 0)) return;
      etiquetasHoja[+c.dataset.manual].objetivo = v;
      clearTimeout(t);
      t = setTimeout(()=>{ pintarEtiquetas();
        // Ojo: un <input type=number> no admite setSelectionRange. Basta con
        // devolverle el foco, que el cursor se queda al final solo.
        document.querySelector(`[data-manual="${c.dataset.manual}"]`)?.focus(); }, 400); };
  }
  for(const b of $l.querySelectorAll('[data-quitar]'))
    b.onclick = ()=>{ etiquetasHoja.splice(+b.dataset.quitar, 1); pintarEtiquetas(); };
  document.getElementById('et-vaciar')?.addEventListener('click', ()=>{
    etiquetasHoja = []; pintarEtiquetas(); });
}

function generarPDF(lista, titulo, sub){
  if(!puedeEditar) return brindis(SIN_PERMISO);
  const hoy = new Date().toLocaleDateString('es-ES',{day:'2-digit',month:'long',year:'numeric'});
  const cols = lista.map(f=>{
    const c = color(f);
    return `<article>
      <header><i style="background:${c.hex}"></i><h4>${esc(f.nombre)}</h4>
        ${estadoAct(f).aldia?'<b>✓</b>':''}</header>
      <table>${f.ingredientes.map(i=>`<tr><td>${esc(i.nombre)}</td><td>${fmt(i.cantidad)}</td></tr>`).join('')}
        <tr class="tot"><td>Total</td><td>${fmt(f.ingredientes.reduce((s,i)=>s+i.cantidad,0))}</td></tr></table>
    </article>`;
  }).join('');
  const w = window.open('','_blank');
  if(!w) return brindis('El navegador ha bloqueado la ventana del PDF');
  w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>${esc(titulo)}</title>
  <style>
    ${tipografiaIncrustada()}
    @page{size:A4; margin:14mm 12mm}
    *{box-sizing:border-box}
    body{font-family:"Plex",ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;color:#111;margin:0;font-size:9pt;font-variant-numeric:tabular-nums slashed-zero;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .portada{height:calc(100vh - 28mm);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;page-break-after:always}
    .portada .arco{width:88mm;height:14mm;border-radius:7mm;margin-bottom:14mm;
      background:linear-gradient(90deg,#e0473a,#e8a13c,#e8dc45,#4aab60,#3d7fd6,#8a54c8)}
    .portada h1{font-size:30pt;letter-spacing:-.02em;margin:0 0 6mm;font-weight:700}
    /* En papel NO se usa degradado sobre texto: el motor de impresión no
       recorta el fondo a la letra y salen los rectángulos del degradado
       detrás de cada carácter. Colores planos, que además imprimen limpio. */
    .marca-pdf span{font-style:italic; font-weight:800; color:#9b9da1}
    .marca-pdf span b{font-size:1.3em; line-height:0; color:#b61517}
    .portada h2{font-size:15pt;font-weight:500;color:#555;margin:0 0 12mm;letter-spacing:.06em}
    .portada p{font-size:10pt;color:#666;margin:0}
    .portada .n{font-size:11pt;color:#111;font-weight:600;margin-top:3mm}
    main{column-count:3;column-gap:6mm}
    article{break-inside:avoid;border:.4pt solid #d5d5d5;border-radius:2mm;padding:2mm 2.4mm;margin-bottom:3mm}
    header{display:flex;align-items:center;gap:2mm;margin-bottom:1.4mm}
    header i{width:6mm;height:6mm;border-radius:1.2mm;flex:0 0 auto;border:.4pt solid rgba(0,0,0,.18)}
    header h4{font-size:8.6pt;margin:0;font-weight:700;line-height:1.15;flex:1 1 auto}
    header b{color:#136c46;font-size:9pt}
    table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
    td{padding:.5mm 0;font-size:8pt;border-bottom:.3pt solid #eee}
    td:last-child{text-align:right;font-weight:600;white-space:nowrap}
    tr.tot td{border-top:.6pt solid #bbb;border-bottom:0;font-weight:700;padding-top:.9mm}
    @media print{ .noimp{display:none} }
  </style></head><body>
  <div class="portada">
    <div class="arco"></div>
    ${/^\s*colores\s+seriadornos\s*$/i.test(titulo)
      ? `<h1 class="marca-pdf">COLORES <span><b>S</b>ERI<b>A</b>DORNOS</span></h1>`
      : `<h1>${esc(titulo)}</h1>`}
    ${sub?`<h2>${esc(sub)}</h2>`:''}
    <p>Listado de fórmulas</p>
    <p class="n">${lista.length} colores</p>
    <p style="margin-top:10mm">Generado el ${hoy}</p>
  </div>
  <main>${cols}</main>
  <script>window.onload=()=>setTimeout(()=>window.print(),350)<\/script>
  </body></html>`);
  w.document.close();
}

/* ═══════════════════════════════════════════════════════════════════
   VARIOS
   ═══════════════════════════════════════════════════════════════════ */
let tBrindis;
function brindis(txt){
  const el = document.getElementById('brindis');
  el.textContent = txt; el.classList.add('on');
  clearTimeout(tBrindis);
  tBrindis = setTimeout(()=>el.classList.remove('on'), 2400);
}
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && !$dlg.open && document.body.dataset.ficha==='on' && innerWidth<=860){ cerrarFicha(); }
  if((e.key==='/' || (e.key==='k'&&(e.metaKey||e.ctrlKey))) && !$dlg.open){
    const a = document.activeElement;
    if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')) return;
    e.preventDefault(); $q.focus(); $q.select();
  }
});
/* Cuando el trabajador de segundo plano se trae una versión nueva, se avisa.
   Sin esto, la app se actualiza igual, pero solo la SEGUNDA vez que la abres,
   y por el camino piensas que la subida ha fallado. */
function avisarVersionNueva(){
  if(document.querySelector('.actualiza')) return;
  const el = document.createElement('div');
  el.className = 'actualiza';
  el.innerHTML = `<span>Hay una versión nueva de la app</span>
                  <button type="button">Actualizar</button>`;
  el.querySelector('button').onclick = ()=>location.reload();
  document.body.appendChild(el);
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.ready.then(reg=>{
    // Al entrar, se pregunta al servidor si hay algo nuevo.
    reg.update?.().catch(()=>{});
    reg.addEventListener('updatefound', ()=>{
      const nuevo = reg.installing;
      if(!nuevo) return;
      nuevo.addEventListener('statechange', ()=>{
        // 'installed' con uno ya controlando la página = versión nueva lista.
        if(nuevo.state === 'installed' && navigator.serviceWorker.controller)
          avisarVersionNueva();
      });
    });
  }).catch(()=>{});
}

/* ═══════════════════════════════════════════════════════════════════
   INSTALABLE
   Todo lo que hace falta para que se instale como una aplicación va aquí
   dentro; no hay ningún fichero suelto que se pueda perder al copiar esto de
   un sitio a otro. El manifiesto se monta al vuelo como blob.

   AVISO IMPORTANTE: instalar una aplicación web solo funciona si la página se
   sirve por https. Abriendo el archivo con doble clic (file://) el navegador
   NO ofrece instalar, por diseño y por seguridad; el icono y la pantalla
   completa quedan preparados y se activan solos el día que esto esté colgado
   en una dirección. Sin cobertura funciona igual: el archivo está entero en el
   disco, no pide nada a internet.
   ═══════════════════════════════════════════════════════════════════ */
(function instalable(){
  try{
    // En la carpeta web el manifiesto es un fichero de verdad y ya viene
    // puesto en el HTML. Solo se monta al vuelo en el archivo suelto.
    if(document.querySelector('link[rel="manifest"]')) return;
    const icono = document.querySelector('link[rel="apple-touch-icon"]').href;
    const manifiesto = {
      name: 'Colores SeriAdornos', short_name: 'Colores',
      description: 'Fórmulas de color de goma de SeriAdornos.',
      start_url: './', scope: './', display: 'standalone',
      orientation: 'any', lang: 'es',
      background_color: '#0d0f10', theme_color: '#0d0f10',
      icons: [{src: icono, sizes: '192x192', type: 'image/png', purpose: 'any maskable'}],
    };
    const url = URL.createObjectURL(
      new Blob([JSON.stringify(manifiesto)], {type:'application/manifest+json'}));
    const l = document.createElement('link');
    l.rel = 'manifest'; l.href = url; l.crossOrigin = 'use-credentials';
    document.head.appendChild(l);
  }catch(_){ /* si el navegador no deja, se sigue usando como página normal */ }
})();

const temaGuardado = (()=>{ try{ return localStorage.getItem('tema'); }catch(_){ return null; } })();
if(temaGuardado && temaGuardado!=='auto') document.documentElement.dataset.tema = temaGuardado;

actualizar();

/* Si quedó un pesaje a medias, se ofrece seguirlo. No se abre solo: puede que
   vengas a otra cosa, y plantarte un diálogo encima al abrir la app es de mala
   educación. Pero tampoco se calla, que era el fallo de antes. */
function avisarPesajeAMedias(){
  const v = leerPesajeGuardado();
  if(!v || document.querySelector('.pesaje-medias')) return;
  const hechas = v.g.hechos.length;
  const el = document.createElement('div');
  el.className = 'actualiza pesaje-medias';
  el.innerHTML = `<span>Pesaje a medias de <b>${esc(v.f.nombre)}</b>
      · ${hechas} ingrediente${hechas===1?'':'s'} echado${hechas===1?'':'s'}</span>
    <button type="button" data-seguir>Seguir</button>
    <button type="button" data-tirar aria-label="Descartar el pesaje">Descartar</button>`;
  el.querySelector('[data-seguir]').onclick = ()=>{ el.remove(); retomarPesaje(); };
  el.querySelector('[data-tirar]').onclick = ()=>{
    el.remove();
    try{ localStorage.removeItem(CLAVE_PESAJE); }catch(_){}
  };
  document.body.appendChild(el);
}
avisarPesajeAMedias();
// Y si hace un mes que no descarga copia, se lo dice. Solo al editor: el
// taller no puede descargarla, avisarle sería mandarle a un botón que no tiene.
setTimeout(avisarCopia, 1500);

/* Una puerta para las pruebas automáticas. Sin esto, la sincronización solo
   se podría probar a ojo en dos aparatos, que es como se cuelan los fallos
   que se descubren tres semanas después con fórmulas perdidas por el camino.

   Y no abre nada: los permisos ya no están aquí, están en el servidor. Quien
   llame a `anotar` desde la consola del navegador con la cuenta del taller se
   come el mismo 403 que si lo intentara por cualquier otro sitio; como mucho
   se estropea su propia copia local, y se arregla recargando. */
window.__app = {
  get DATOS(){ return DATOS; }, porId, materias, busq, norm, nube, MODO,
  anotar, anotarMateria, empujar, guardar, reconstruir, actualizar, sincronizar,
  verPigmento, pantallaChoques, avisarCopia, mantenerPantalla,
  get filtroPigmento(){ return filtroPigmento; },
  get capas(){ return capas.slice(); }, abrir, cerrarFicha, cerrarTodo,
  get filtradas(){ return filtradas.slice(); },
  get HISTORIAL(){ return HISTORIAL.slice(); },
  apuntarPreparacion, pantallaHistorial, fundirHistorial,
  estadoAct, porRevisar, materiasDe: ()=>materiasDe, cuantasLlevan,
  pantallaPigmentos, empezarRepaso,
  preparar, retomarPesaje, guardarPesaje, leerPesajeGuardado,
  get pes(){ return pes; },
  get ultimaSync(){ return ultimaSync; },
  get estadoSync(){ return estadoSync; },
};

/* ═══════════════════════════════════════════════════════════════════
   RESCATE DE LA VERSIÓN ANTERIOR

   La app de antes guardaba los cambios EN ESTE NAVEGADOR y había que publicar
   un archivo para que los vieran los demás. Al pasar a la nube, esos cambios
   dejan de mirarse: la verdad pasa a estar en el servidor.

   Si alguien había editado algo y no lo publicó, se perdería sin decir una
   palabra. Eso no se puede consentir, así que al arrancar se mira si quedaba
   algo en el rincón viejo y se ofrece subirlo. Los parches se aplican encima
   de lo que hay en la nube, no lo sustituyen, y volver a hacerlo no rompe
   nada: se escribe el mismo valor.
   ═══════════════════════════════════════════════════════════════════ */
const RESCATE_HECHO = 'nube-rescate-hecho';
if(MODO === 'nube' && puedeEditar && !sesion.vacia){
  const viejo = (()=>{ try{ return JSON.parse(localStorage.getItem(CLAVE) || 'null'); }
                       catch(_){ return null; } })();
  const cuantos = viejo ? (Object.keys(viejo.formulas||{}).length +
                           (viejo.nuevas||[]).length + (viejo.borradas||[]).length) : 0;
  const yaHecho = (()=>{ try{ return localStorage.getItem(RESCATE_HECHO) === '1'; }
                         catch(_){ return false; } })();
  if(cuantos && !yaHecho){
    $dt.textContent = 'Quedaban cambios sin subir';
    $dc.innerHTML = `
      <p style="margin-top:0">En este ordenador hay <b>${cuantos} cambio${cuantos===1?'':'s'}</b>
        de la versión anterior de la app que <b>nunca se llegaron a publicar</b>.</p>
      <p style="font-size:14px;color:var(--texto-2)">Puedo subirlos a la nube ahora.
        Si ya estaban dentro del archivo de copia con el que sembraste, no pasa nada:
        se vuelve a escribir lo mismo.</p>
      <div id="res-estado"></div>`;
    $dp.innerHTML = `<button class="btn" id="res-no">Ahora no</button>
      <button class="btn btn-1" id="res-si">Subirlos</button>`;
    document.getElementById('res-no').onclick = ()=>$dlg.close();
    document.getElementById('res-si').onclick = async ()=>{
      const b = document.getElementById('res-si');
      b.disabled = true;
      let subidos = 0, fallos = 0;
      for(const [id, parche] of Object.entries(viejo.formulas||{})){
        const f = porId.get(id);
        if(!f) continue;
        Object.assign(f, parche); cacheColor.delete(id);
        const e = busq.find(x=>x.f.id===id);
        if(e){ e.n = norm(f.nombre); e.ing = norm(f.ingredientes.map(i=>i.nombre).join(' ')); }
        try{ await nube.guardarFormula(f); subidos++; }catch(_){ fallos++; }
        b.textContent = `Subiendo… ${subidos}`;
      }
      for(const f of (viejo.nuevas||[])){
        if(!porId.get(f.id)){
          DATOS.formulas.push(f); porId.set(f.id, f);
          busq.push({f, n:norm(f.nombre), ing:norm((f.ingredientes||[]).map(i=>i.nombre).join(' '))});
        }
        try{ await nube.guardarFormula(f); subidos++; }catch(_){ fallos++; }
      }
      for(const id of (viejo.borradas||[])){
        const f = porId.get(id); if(!f) continue;
        DATOS.formulas = DATOS.formulas.filter(x=>x.id!==id);
        porId.delete(id);
        const k = busq.findIndex(x=>x.f.id===id); if(k>=0) busq.splice(k,1);
        try{ await nube.guardarFormula({...f, borrada:true}); subidos++; }catch(_){ fallos++; }
      }
      DATOS.formulas.sort((a,b2)=>a.nombre.localeCompare(b2.nombre,'es'));
      guardar(); reconstruir(); actualizar();
      // Solo se da por hecho si NO ha fallado nada: si falló algo, mejor que
      // vuelva a preguntar mañana que dar por subido lo que no subió.
      if(!fallos){ try{ localStorage.setItem(RESCATE_HECHO, '1'); }catch(_){} }
      $dlg.close();
      brindis(fallos ? `Subidos ${subidos}, ${fallos} han fallado` : `${subidos} cambios subidos a la nube`);
    };
    $dlg.showModal();
  }
}

/* ═══════════════════════════════════════════════════════════════════
   EL PRIMER DÍA: SEMBRAR LA NUBE

   La base de datos nace vacía. Alguien tiene que meter las 860 fórmulas una
   primera vez, y ese alguien es el editor, desde aquí, con el archivo de
   copia que ya tiene descargado.

   Se hace así, y no con un script que las meta por detrás, por una razón: el
   archivo de copia es lo que él tiene DELANTE, con sus cambios dentro. Si lo
   sembrara yo desde los datos originales, se perdería todo lo que hubiera
   editado desde la app hasta hoy y no se enteraría nadie.
   ═══════════════════════════════════════════════════════════════════ */
if(MODO === 'nube' && sesion.vacia){
  $dt.textContent = 'La nube todavía está vacía';
  if(!puedeEditar){
    $dc.innerHTML = `<p style="margin-top:0">Aún no hay fórmulas en el servidor.
      Avisa a Juanjo: tiene que subirlas una primera vez desde su ordenador.</p>`;
    $dp.innerHTML = `<button class="btn btn-1" data-cerrar>Entendido</button>`;
  }else{
    $dc.innerHTML = `
      <p style="margin-top:0">Es el primer arranque. Sube el recetario una vez y a
        partir de ahí todo va solo: lo que guardes aquí aparece en los móviles.</p>
      <p style="font-size:14px;color:var(--texto-2)">Elige el archivo de copia
        (<b>colores_seriadornos_….json</b>), el último que descargaste.</p>
      <div id="sem-estado"></div>
      <input type="file" id="sem-archivo" accept="application/json,.json" hidden>`;
    $dp.innerHTML = `<button class="btn btn-1" id="sem-ir">Elegir el archivo</button>`;
  }
  $dp.querySelector('[data-cerrar]')?.addEventListener('click', ()=>$dlg.close());
  document.getElementById('sem-ir')?.addEventListener('click',
    ()=>document.getElementById('sem-archivo').click());
  const $sa = document.getElementById('sem-archivo');
  if($sa) $sa.onchange = ev=>{
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = '';
    if(!file) return;
    const lector = new FileReader();
    lector.onerror = ()=>brindis('No se ha podido leer el archivo');
    lector.onload = async ()=>{
      let j;
      try{ j = JSON.parse(lector.result); }
      catch(_){ return brindis('Ese archivo no es una copia válida'); }
      if(!j || !Array.isArray(j.formulas) || !j.formulas.length)
        return brindis('Ese archivo no tiene fórmulas dentro');
      const $b = document.getElementById('sem-ir');
      $b.disabled = true;
      const $e = document.getElementById('sem-estado');
      try{
        await nube.sembrar({
          formulas: j.formulas,
          materias_primas: j.materias_primas || [],
          grupos_equivalencia: j.grupos_equivalencia || [],
          modelo: j.modelo || {},
        }, pct=>{ $b.textContent = `Subiendo… ${pct}%`; });
        $e.innerHTML = `<div class="aviso info" style="margin-top:12px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.2v.1"/></svg>
          <span>Subidas <b>${j.formulas.length}</b> fórmulas. Recargando…</span></div>`;
        nube.borrarEspejo();
        setTimeout(()=>location.reload(), 1200);
      }catch(err){
        $b.disabled = false; $b.textContent = 'Elegir el archivo';
        $e.innerHTML = `<div class="aviso" style="margin-top:12px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.2v.1"/></svg>
          <span>${esc(err && err.message || 'No se ha podido subir')}</span></div>`;
      }
    };
    lector.readAsText(file);
  };
  $dlg.showModal();
}
</script>
<script>
if('serviceWorker' in navigator) addEventListener('load', ()=>
  navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
