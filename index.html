:root{
  --fondo:#f4f3f0;   --panel:#ffffff;  --panel-2:#faf9f7;
  --linea:#e6e4df;   --linea-fuerte:#d3d0c9;
  --texto:#15171a;   --texto-2:#5c6167; --texto-3:#8a8f95;
  /* La "tinta" es el gris de la casa, no un azul de plantilla: en una
     aplicación cuyo contenido ES el color, el cromo no puede tener color
     propio o compite con las muestras. */
  --tinta:#22262b;   --tinta-suave:#ecebe7;  --tinta-txt:#ffffff;
  /* El rojo de la marca, medido sobre el logo. Se usa con cuentagotas: la
     acción principal, el color que llevas seleccionado y poco más. */
  --marca:#b61517;   --marca-2:#a3120f;  --marca-suave:#fbeceb;
  --marca-hl:#ffe58a;
  --ambar:#96620f;   --ambar-suave:#fbf2e1;
  --verde:#136c46;   --rojo:#b4231c;
  --contorno:oklch(0 0 0 / .10);
  --sombra-1:0 1px 2px rgba(16,18,20,.05), 0 1px 1px rgba(16,18,20,.04);
  --sombra-2:0 2px 4px rgba(16,18,20,.05), 0 6px 16px -6px rgba(16,18,20,.14);
  --sombra-3:0 8px 24px -8px rgba(16,18,20,.24), 0 24px 56px -24px rgba(16,18,20,.28);
  --r-xl:18px; --r-l:14px; --r-m:10px; --r-s:7px;
  /* UNA sola curva en toda la app. Es la que usan los sistemas operativos
     para lo que entra en pantalla: arranca rápido y frena al final, como algo
     que tiene peso. Nada de rebotes: aquí no hay nada que rebote. */
  --salida:cubic-bezier(.2,0,0,1);
  --ritmo:1;
  --alto-fila:52px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]){
    --fondo:#0d0f10;  --panel:#16191b;  --panel-2:#1c2022;
    --linea:#282d30;  --linea-fuerte:#3a4145;
    --texto:#eef0f1;  --texto-2:#a3abb0; --texto-3:#767f85;
    --tinta:#eef0f1;  --tinta-suave:#25292c;  --tinta-txt:#0d0f10;
    --marca:#c3312e;  --marca-2:#f0857f;  --marca-suave:#2a1615;
    --marca-hl:#5a4a12;
    --ambar:#e0a44e;  --ambar-suave:#2c2313;
    --verde:#4cc38a;  --rojo:#ef6b63;
    --contorno:oklch(1 0 0 / .10);
    --sombra-1:0 1px 2px rgba(0,0,0,.4);
    --sombra-2:0 2px 4px rgba(0,0,0,.3), 0 6px 16px -6px rgba(0,0,0,.5);
    --sombra-3:0 8px 24px -8px rgba(0,0,0,.6), 0 24px 56px -24px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-tema="oscuro"]{
    --fondo:#0d0f10;  --panel:#16191b;  --panel-2:#1c2022;
  --linea:#282d30;  --linea-fuerte:#3a4145;
  --texto:#eef0f1;  --texto-2:#a3abb0; --texto-3:#767f85;
  --tinta:#eef0f1;  --tinta-suave:#25292c;  --tinta-txt:#0d0f10;
  --marca:#c3312e;  --marca-2:#f0857f;  --marca-suave:#2a1615;
  --marca-hl:#5a4a12;
  --ambar:#e0a44e;  --ambar-suave:#2c2313;
  --verde:#4cc38a;  --rojo:#ef6b63;
  --contorno:oklch(1 0 0 / .10);
  --sombra-1:0 1px 2px rgba(0,0,0,.4);
  --sombra-2:0 2px 4px rgba(0,0,0,.3), 0 6px 16px -6px rgba(0,0,0,.5);
  --sombra-3:0 8px 24px -8px rgba(0,0,0,.6), 0 24px 56px -24px rgba(0,0,0,.7);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--fondo); color:var(--texto);
  font-family:"Plex",ui-sans-serif,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  text-wrap:pretty; overscroll-behavior:none;
}
h1,h2,h3{margin:0; text-wrap:balance; letter-spacing:-.017em; font-weight:640}
button,input,select,textarea{font:inherit; color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
/* Los gramos se leen en columna y de un vistazo: cifras de ancho fijo y con el
   cero rayado, que en una báscula es la diferencia entre 105 y 1O5. */
.num{font-variant-numeric:tabular-nums slashed-zero}
:focus-visible{outline:2px solid var(--marca); outline-offset:2px; border-radius:4px}
::selection{background:var(--marca-hl); color:#15171a}

/* ── Estructura ──────────────────────────────────────────────────── */
.app{display:flex; flex-direction:column; height:100dvh}

.cabecera{
  flex:0 0 auto; background:var(--panel);
  border-bottom:1px solid var(--linea);
  padding:10px 14px calc(10px) 14px;
  padding-top:max(10px,env(safe-area-inset-top));
  display:flex; flex-direction:column; gap:10px; z-index:30;
}
.cab-fila{display:flex; align-items:center; gap:10px}
.marca{display:flex; align-items:center; gap:9px; min-width:0}
.marca h1{font-size:16.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.marca-colores{font-weight:560; letter-spacing:-.01em; color:var(--texto-2)}

/* La marca, como en el logo: la S y la A grandes en rojo y el resto en plata.
   Colores medidos sobre el logo de verdad, no inventados.
   El blanco puro no vale sobre la barra clara —desaparecería—, así que se usa
   el mismo degradado metálico del logo y un filo fino, que es justo lo que hace
   que se lea sobre papel blanco. */
.logo-marca{
  --rojo-marca:#b61517;
  font-weight:800; font-style:italic; letter-spacing:.005em;
  background:linear-gradient(180deg,#8f9195 0%,#e9eaec 34%,#ffffff 47%,#c3c4c7 62%,#86888c 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  -webkit-text-stroke:.55px rgba(40,44,48,.55); paint-order:stroke fill;
}
.logo-marca b{
  font-size:1.34em; font-weight:800; line-height:0;
  background:linear-gradient(180deg,#c05244 0%,#b61517 45%,#99070b 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  -webkit-text-stroke:.55px rgba(72,10,12,.6);
}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]) .logo-marca{-webkit-text-stroke-color:rgba(0,0,0,.55)}
}
:root[data-tema="oscuro"] .logo-marca{-webkit-text-stroke-color:rgba(0,0,0,.55)}

/* Buscador: es la función principal, así que es el elemento más grande */
.buscador{position:relative; flex:1 1 auto; min-width:0}
.buscador svg{
  position:absolute; left:13px; top:50%; transform:translateY(-50%);
  width:18px;height:18px; color:var(--texto-3); pointer-events:none;
}
#q{
  width:100%; height:48px; padding:0 44px 0 40px;
  background:var(--panel-2); border:1px solid var(--linea-fuerte);
  border-radius:var(--r-l); font-size:16px; /* 16px evita el zoom de iOS */
  transition:border-color .15s var(--salida), background-color .15s var(--salida), box-shadow .15s var(--salida);
}
#q::placeholder{color:var(--texto-3)}
#q:focus{outline:none; border-color:var(--marca); background:var(--panel); box-shadow:0 0 0 3px color-mix(in srgb,var(--marca) 14%,transparent)}
.limpiar{
  position:absolute; right:4px; top:50%; transform:translateY(-50%);
  width:40px;height:40px; display:none; place-items:center; color:var(--texto-3);
  border-radius:var(--r-m);
}
.limpiar.on{display:grid}
.limpiar:hover{color:var(--texto); background:var(--panel-2)}
.limpiar:active{scale:.96}

.btn-icono{
  width:48px;height:48px;flex:0 0 auto;
  display:grid;place-items:center;border-radius:var(--r-l);
  color:var(--texto-2); background:var(--panel-2);
  border:1px solid var(--linea);
  transition:color .15s var(--salida), background-color .15s var(--salida), scale .12s var(--salida);
}
.btn-icono:hover{color:var(--texto); background:var(--linea)}
.btn-icono:active{scale:.96}
.btn-icono svg{width:20px;height:20px}

.btn{
  height:44px; padding:0 16px; border-radius:var(--r-m);
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  font-weight:560; font-size:14px; white-space:nowrap;
  background:var(--panel-2); border:1px solid var(--linea-fuerte); color:var(--texto);
  transition:background-color .15s var(--salida), border-color .15s var(--salida), scale .12s var(--salida);
}
.btn:hover{background:var(--linea)}
.btn:active{scale:.96}
.btn svg{width:17px;height:17px;flex:0 0 auto}
.btn-1{background:var(--tinta); border-color:transparent; color:var(--tinta-txt); box-shadow:var(--sombra-1)}
/* La acción del día a día lleva el rojo de la casa. Es el único botón que lo
   lleva, y por eso se ve desde el otro lado del taller. */
.btn-marca{background:var(--marca); border-color:transparent; color:#fff; box-shadow:var(--sombra-1)}
.btn-marca:hover{background:var(--marca); filter:brightness(1.12)}
.btn-1:hover{background:var(--tinta); filter:brightness(1.08)}
/* "Eliminar" estaba en rojo, justo al lado de "Preparar", que también es
   rojo. Dos rojos pegados con significados opuestos es pedir un resbalón.
   Ahora nace neutro y solo se enciende cuando ya lo tienes debajo del dedo:
   el aviso llega en el momento en que puede servir de algo. */
.btn-peligro{color:var(--texto-2)}
.btn-peligro:hover, .btn-peligro:focus-visible{
  color:var(--rojo); border-color:color-mix(in srgb,var(--rojo) 45%,var(--linea-fuerte));
  background:var(--panel-2);
}
/* Y se va al otro extremo de la fila, separado de los demás. */
.acciones-ficha #btn-borrar{margin-left:auto}
@media (max-width:860px){ .acciones-ficha #btn-borrar{margin-left:0} }
/* Un botón discreto para meter dentro de la cabecera de un apartado, donde
   uno de tamaño normal se comería la línea. */
.btn-fino{height:30px; padding:0 10px; font-size:12.5px; border-radius:var(--r-s)}
.btn-fino svg{width:14px;height:14px}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn:disabled:active{scale:1}

/* ── Cuerpo: lista + ficha ───────────────────────────────────────── */
.cuerpo{flex:1 1 auto; display:flex; min-height:0}
/* Dos planos: el índice va un punto más apagado y la ficha va en blanco puro.
   Es lo que hace que, sin una sola línea de más, se vea dónde estás. */
.columna-lista{
  flex:0 0 384px; display:flex; flex-direction:column;
  border-right:1px solid var(--linea); background:var(--fondo); min-height:0;
}
.contador{
  flex:0 0 auto; padding:10px 16px; font-size:12px; color:var(--texto-3);
  border-bottom:1px solid var(--linea); display:flex; justify-content:space-between;
  align-items:center; gap:10px; letter-spacing:.01em;
}
.contador b{color:var(--texto-2); font-weight:640}
.lista{flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch}

/* Con 860 fórmulas en orden alfabético, saber por qué letra vas ahorra
   media docena de rebotes de scroll. Se queda pegada arriba mientras pasa
   su bloque, como la agenda del teléfono. */
.letra{
  position:sticky; top:0; z-index:1; padding:7px 16px 6px;
  font-size:10.5px; font-weight:700; letter-spacing:.14em; color:var(--texto-3);
  background:color-mix(in srgb,var(--fondo) 86%,transparent);
  backdrop-filter:saturate(1.6) blur(10px);
  border-bottom:1px solid var(--linea);
}

.fila{
  display:flex; align-items:center; gap:13px; width:100%;
  padding:0 14px; min-height:var(--alto-fila); text-align:left;
  border-bottom:1px solid var(--linea);
  transition:background-color .12s var(--salida), box-shadow .12s var(--salida);
}
.fila:hover{background:var(--panel-2)}
/* Seleccionado: fondo del mismo blanco que la ficha —la fila se "conecta" con
   lo que hay a la derecha— y el filo rojo de la marca. Sin tintar de azul. */
.fila[aria-current="true"]{background:var(--panel); box-shadow:inset 3px 0 0 var(--marca)}
.fila[aria-current="true"] .fila-nombre{font-weight:640}
.muestra{
  width:34px;height:34px;flex:0 0 auto;border-radius:var(--r-m);
  outline:1px solid var(--contorno); outline-offset:-1px;
  position:relative; overflow:hidden;
}
.muestra.metal::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(118deg,rgba(255,255,255,.55) 8%,transparent 34%,transparent 62%,rgba(255,255,255,.34) 88%);
}
.fila-txt{min-width:0; flex:1 1 auto}
.fila-nombre{
  font-size:15px; font-weight:520; letter-spacing:-.008em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.fila-nombre mark{background:color-mix(in srgb,var(--marca-hl) 62%,transparent); color:inherit; border-radius:3px; padding:0 1px}
.pin{
  flex:0 0 auto; width:7px;height:7px;border-radius:50%; background:var(--ambar);
}

/* ── Muro de colores: lo que se ve cuando no hay nada abierto ─────── */
/* El muro necesita ancho: la ficha se lee mejor estrecha, pero una rejilla de
   muestras a 780px desperdicia media pantalla. */
.ficha.es-muro{max-width:1240px}
.muro{padding-bottom:40px}
.muro-cab{
  display:flex; align-items:baseline; gap:10px; margin-bottom:18px;
  padding-bottom:12px; border-bottom:1px solid var(--linea);
}
.muro-cab h2{font-size:19px}
.muro-cab span{font-size:12.5px; color:var(--texto-3)}
.muro-rejilla{display:grid; grid-template-columns:repeat(auto-fill,minmax(108px,1fr)); gap:14px}
.muro-t{
  display:block; width:100%; text-align:left; border-radius:var(--r-m);
  /* Entran escalonadas, no las 240 de golpe. El retraso está topado en la
     hoja de estilo (--t) para que la última no se haga esperar: toda la
     cascada cabe en menos de un tercio de segundo. */
  animation:sube calc(.34s * var(--ritmo)) var(--salida) both;
  animation-delay:calc(var(--t,0ms) * var(--ritmo));
}
@keyframes sube{from{opacity:0; transform:translateY(7px)} to{opacity:1; transform:none}}
.muro-t i{
  display:block; width:100%; aspect-ratio:1; border-radius:var(--r-m);
  outline:1px solid var(--contorno); outline-offset:-1px; box-shadow:var(--sombra-1);
  position:relative; overflow:hidden;
  transition:scale .16s var(--salida), box-shadow .16s var(--salida);
}
.muro-t i.metal::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(118deg,rgba(255,255,255,.55) 8%,transparent 34%,transparent 62%,rgba(255,255,255,.34) 88%);
}
.muro-t:hover i{scale:1.045; box-shadow:var(--sombra-2)}
.muro-t:active i{scale:.99}
/* A DOS LÍNEAS, no a una con puntos suspensivos. Cortando, dos colores del
   mismo cliente que solo se diferencian en la última palabra salían con el
   mismo texto y los mismos puntos suspensivos: indistinguibles. Un muro que
   sirve para reconocer de un vistazo no puede hacer eso. Se reserva la altura
   de las dos líneas siempre, para que la rejilla no baile.
   (Y sin ejemplos reales aquí: este archivo se cuelga en internet y el
   comprobador de construir.py caza cualquier nombre de fórmula en claro.) */
.muro-t span{
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  margin-top:7px; font-size:11.5px; font-weight:530; line-height:1.3;
  color:var(--texto-2); overflow:hidden; min-height:calc(2 * 1.3em);
}
.muro-mas{margin:22px 0 0; font-size:12.5px; color:var(--texto-3)}

/* ── Ficha ───────────────────────────────────────────────────────── */
.columna-ficha{flex:1 1 auto; overflow-y:auto; min-width:0; overscroll-behavior:contain; background:var(--panel)}
.ficha{max-width:780px; margin:0 auto; padding:26px 26px 96px}
/* En un monitor de verdad sobraba medio ancho: la ficha eran 780 px centrados
   en 1440 y todo caía en una sola columna kilométrica. A partir de 1180 px se
   parte en dos: la receta a la izquierda —que es lo que se mira— y el estado,
   las parecidas y el historial a la derecha. Por debajo se apila como siempre,
   y en ese orden, que es el bueno para el móvil. */
.ficha-col{min-width:0}
@media (min-width:1180px){
  .ficha:not(.es-muro){max-width:1180px}
  .ficha-cuerpo{display:grid; grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);
    gap:0 40px; align-items:start}
  /* La primera tarjeta de cada columna arranca a la misma altura. */
  .ficha-col > .tarjeta:first-child > .tarjeta-cab{padding-top:8px}
  .ficha-col > .tarjeta-fm{margin-top:8px}
  /* Los botones se quedan bajo la receta. Sueltos a lo ancho del monitor,
     "Eliminar" acababa a 600 px de los demás y parecía de otra pantalla. */
  .acciones-ficha{grid-column:1; grid-row:2}
}

.hero{display:flex; gap:22px; align-items:flex-start; margin-bottom:6px}
/* La muestra que tocas en la lista o en el muro CRECE hasta convertirse en
   esta. No es adorno: mientras la vista se mueve, el ojo no pierde de vista
   cuál de los 860 colores has abierto. Se apoya en View Transitions, que ya
   traen Chrome y Edge; donde no esté, simplemente aparece sin más. */
::view-transition-old(root),::view-transition-new(root){
  animation-duration:calc(.2s * var(--ritmo));
}
::view-transition-group(muestra-activa){
  animation-duration:calc(.34s * var(--ritmo));
  animation-timing-function:var(--salida);
}
.hero-muestra{
  width:148px;height:148px;flex:0 0 auto;border-radius:var(--r-xl);
  outline:1px solid var(--contorno); outline-offset:-1px;
  box-shadow:var(--sombra-2); position:relative; overflow:hidden;
}
.hero-muestra.metal::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(118deg,rgba(255,255,255,.55) 8%,transparent 34%,transparent 62%,rgba(255,255,255,.34) 88%);
}
.hero-txt{min-width:0; padding-top:6px}
.hero-txt h2{font-size:29px; line-height:1.12; margin-bottom:11px; letter-spacing:-.024em; font-weight:660}
.hero-meta{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
/* El hueco de la derecha del nombre estaba en blanco. Aquí va lo que se
   pregunta uno delante de un bote: de quién es, cuándo la hice la última vez,
   cuántas veces y a quién arrastra si la toco. */
.hero-datos{
  display:flex; flex-wrap:wrap; gap:0 26px; margin-top:18px;
  padding-top:14px; border-top:1px solid var(--linea);
}
.hero-dato{min-width:0}
.hero-dato dt{
  font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--texto-3); margin:0 0 3px;
}
.hero-dato dd{margin:0; font-size:14px; font-weight:560; letter-spacing:-.008em}
.hero-dato dd small{display:block; font-size:11.5px; font-weight:450; color:var(--texto-3); letter-spacing:0}
.hero-dato dd.flojo{color:var(--texto-3); font-weight:450}
.enlace-cliente{
  display:inline-flex; align-items:center; gap:3px; margin:-2px -6px;
  padding:2px 6px; border-radius:var(--r-s);
  font:inherit; color:var(--marca); font-weight:600; text-align:left;
  transition:background-color .15s var(--salida);
}
.enlace-cliente:hover{background:var(--marca-suave)}
.enlace-cliente svg{width:13px;height:13px;opacity:.75}

.etiqueta{
  display:inline-flex; align-items:center; gap:5px;
  height:26px; padding:0 9px; border-radius:var(--r-s);
  font-size:12px; font-weight:560; letter-spacing:.005em;
  background:var(--panel-2); border:1px solid var(--linea); color:var(--texto-2);
}
.etiqueta svg{width:13px;height:13px}
.etiqueta.ok{background:color-mix(in srgb,var(--verde) 12%,transparent); border-color:color-mix(in srgb,var(--verde) 30%,transparent); color:var(--verde)}
.etiqueta.avisa{background:var(--ambar-suave); border-color:color-mix(in srgb,var(--ambar) 34%,transparent); color:var(--ambar)}
.etiqueta.info{background:var(--tinta-suave); border-color:var(--linea-fuerte); color:var(--texto-2)}
/* Cuando el sello ES el botón, tiene que parecerlo: se levanta al pasar por
   encima y se hunde al pulsarlo. Un sello que no se mueve no se pulsa nunca. */
.sello-btn{
  cursor:pointer; max-width:100%; text-align:left;
  transition:box-shadow .15s var(--salida), border-color .15s var(--salida), scale .12s var(--salida);
}
.sello-btn:hover{box-shadow:var(--sombra-1); border-color:currentColor}
.sello-btn:active{scale:.97}
/* El texto puede ser largo ("Por revisar: cambió tal y cual"): se deja
   crecer a dos líneas antes que cortarlo. */
.sello-btn{height:auto; min-height:26px; padding:3px 9px; line-height:1.35; white-space:normal}

.estado-act{margin:2px 0 0; font-size:14px; line-height:1.55; color:var(--texto-2)}
.estado-act.ok{color:var(--verde)}
.estado-act.avisa{color:var(--ambar)}
.estado-act b{color:inherit; font-weight:640}

/* Lista de pigmentos */
.pig-lista{display:flex; flex-direction:column}
.pig{
  display:flex; align-items:center; gap:12px; padding:11px 0;
  border-bottom:1px solid var(--linea);
}
.pig:last-child{border-bottom:0}
.pig-color{
  width:30px; height:30px; border-radius:9px; flex:0 0 auto;
  outline:1px solid var(--contorno); outline-offset:-1px;
}
.pig-nom{flex:1 1 auto; min-width:0; font-size:14.5px; font-weight:560}
.pig-nom small{
  display:block; font-size:12.5px; font-weight:450; color:var(--texto-2);
  margin-top:1px;
}
.pig-nom small b{color:var(--ambar); font-weight:640}
.choque{padding:12px 0; border-bottom:1px solid var(--linea);
  display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.choque:last-child{border-bottom:0}
.choque-nom{flex:1 1 200px; min-width:0; font-size:14.5px; font-weight:560}
.choque-nom small{display:block; font-size:12.5px; font-weight:450;
  color:var(--texto-2); margin-top:2px}
/* El cuaderno */
.hist-lista{display:flex; flex-direction:column}
.hist-dia{
  display:flex; align-items:baseline; gap:10px; justify-content:space-between;
  padding:16px 0 7px; margin-top:6px;
  border-bottom:1px solid var(--linea-fuerte);
  font-size:13px; font-weight:700; letter-spacing:.01em;
}
.hist-dia:first-child{margin-top:0; padding-top:2px}
.hist-dia small{
  font-weight:520; font-size:12px; color:var(--texto-2);
  text-transform:none; letter-spacing:0; white-space:nowrap;
}
.hist{
  display:flex; align-items:center; gap:11px; padding:10px 0;
  border-bottom:1px solid var(--linea); width:100%; text-align:left;
}
.hist-ir{
  cursor:pointer; border-radius:var(--r-m); padding:10px 8px; margin:0 -8px;
  width:calc(100% + 16px);
  transition:background-color .14s var(--salida);
}
.hist-ir:hover{background:var(--panel-2)}
.hist-ir:active{background:var(--panel-2); scale:.995}
.hist-mas-icono{width:14px;height:14px;flex:0 0 auto;color:var(--texto-3);opacity:.8}
.hist-color{
  width:26px; height:26px; border-radius:8px; flex:0 0 auto;
  outline:1px solid var(--contorno); outline-offset:-1px;
}
.hist-nom{flex:1 1 auto; min-width:0; font-size:14.5px; font-weight:560}
.hist-nom small{
  display:block; font-size:12.5px; font-weight:450; color:var(--texto-2);
  margin-top:1px; text-decoration:none;
}
.hist-g{font-size:15px; font-weight:680; flex:0 0 auto}
.hist-g em{font-style:normal; font-size:11px; font-weight:500; color:var(--texto-3); margin-left:2px}

.pig-btns{display:flex; gap:6px; flex:0 0 auto}
.pig .btn{flex:0 0 auto}
@media (max-width:520px){
  .pig{flex-wrap:wrap}
  .pig-nom{flex:1 1 100%; order:-1}
  .pig-btns{margin-left:auto}
}

/* Antes cada bloque era una tarjeta blanca flotando sobre gris: cinco cajas
   apiladas y ninguna más importante que otra. Ahora la ficha se lee como una
   hoja, con los apartados separados por una línea fina, y la ÚNICA pieza que
   sigue siendo una caja es la fórmula, que es lo que se mira con el bote
   delante. La jerarquía la marca el espacio, no el borde. */
.tarjeta{
  background:none; border:0; border-top:1px solid var(--linea);
  border-radius:0; margin-top:0; box-shadow:none; overflow:visible;
}
.tarjeta-cab{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:22px 0 9px; border-bottom:0; background:none;
}
.tarjeta-cab h3{font-size:11.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--texto-3); font-weight:700}
.tarjeta-cuerpo{padding:0 0 22px}

.tarjeta.tarjeta-fm{
  background:var(--panel-2); border:1px solid var(--linea); border-radius:var(--r-xl);
  box-shadow:var(--sombra-1); overflow:hidden; margin-top:22px;
}
.tarjeta.tarjeta-fm{border-color:var(--linea-fuerte)}
.tarjeta-fm .tarjeta-cab{padding:12px 16px; border-bottom:1px solid var(--linea); background:var(--panel-2)}
.tarjeta-fm .tarjeta-cuerpo{padding:6px 16px 15px; background:var(--panel)}

.ing{
  display:flex; align-items:center; gap:11px; padding:9px 0;
  border-bottom:1px solid var(--linea);
}
.ing:last-child{border-bottom:0}
.ing-color{
  width:26px;height:26px;flex:0 0 auto;border-radius:var(--r-s);
  outline:1px solid var(--contorno); outline-offset:-1px;
}
.ing-nom{flex:1 1 auto; min-width:0; font-size:14.5px; font-weight:500}
.ing-nom small{display:block; font-size:11.5px; color:var(--texto-3); font-weight:450}
.ing-nom button{color:var(--marca-2); font-size:11.5px; font-weight:600; text-align:left}
.ing-nom button:hover{text-decoration:underline}
/* Los porcentajes iban en --texto-3 (#8a8f95 sobre blanco): 2,9 de contraste,
   cuando lo mínimo decente son 4,5. Con la luz de una nave y el móvil a un
   palmo, eso no se lee. Suben a --texto-2 y a 12,5 px. */
.ing-pct{font-size:12.5px; color:var(--texto-2); width:44px; text-align:right;
  flex:0 0 auto; font-variant-numeric:tabular-nums}
.ing-g{font-size:16px; font-weight:640; width:84px; text-align:right; flex:0 0 auto; letter-spacing:-.015em}
.ing-g em{font-style:normal; font-size:11.5px; color:var(--texto-3); font-weight:450; margin-left:2px}
/* Al cambiar la cantidad, los gramos que se han movido se marcan un momento.
   Antes cambiaban en silencio y no sabías si te había hecho caso. */
@keyframes destella{
  0%  {background:color-mix(in srgb,var(--marca) 15%,transparent)}
  100%{background:transparent}
}
.ing-g.cambia,.total.cambia span:last-child{
  animation:destella calc(.75s * var(--ritmo)) var(--salida) both;
  border-radius:5px; padding:1px 4px; margin-right:-4px;
}
.total{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 0 2px; margin-top:6px; border-top:1px solid var(--linea-fuerte);
  font-weight:640;
}
.total span:last-child{font-size:17px; letter-spacing:-.015em}

/* Calculadora */
.calc{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:12px 16px; background:var(--panel-2); border-bottom:1px solid var(--linea)}
.calc label{font-size:13px; color:var(--texto-2); font-weight:520}
.calc input{
  width:110px; height:40px; padding:0 11px; text-align:right;
  background:var(--panel); border:1px solid var(--linea-fuerte); border-radius:var(--r-s);
  font-size:15px; font-weight:600;
  transition:border-color .15s var(--salida), box-shadow .15s var(--salida);
}
.calc input:focus{outline:none; border-color:var(--marca); box-shadow:0 0 0 3px color-mix(in srgb,var(--marca) 14%,transparent)}
.multi{display:flex; gap:5px; flex-wrap:wrap; margin-left:auto}
.multi button{
  min-width:42px; height:34px; padding:0 9px; border-radius:var(--r-s);
  font-size:13px; font-weight:600; color:var(--texto-2);
  background:var(--panel); border:1px solid var(--linea);
  transition:color .15s var(--salida), border-color .15s var(--salida), background-color .15s var(--salida), scale .12s var(--salida);
}
.multi button:hover{color:var(--texto); border-color:var(--linea-fuerte)}
.multi button:active{scale:.96}
.multi button[aria-pressed="true"]{background:var(--tinta); border-color:transparent; color:var(--tinta-txt)}

/* Idea 5: la fórmula, a escala y en sus colores. Un 75% de amarillo se ve
   de un vistazo; leer "75%" hay que pararse a hacerlo. Va debajo de la nota
   del lote y encima de los ingredientes, que es donde el ojo pasa. */
.proporcion{
  display:flex; height:12px; gap:2px; margin:14px 0 4px;
  border-radius:999px; overflow:hidden;
}
.proporcion i{
  display:block; min-width:3px; outline-offset:-1px;
  /* El filo tiene que ser más fuerte que el de las muestras: un tramo de
     BLANCO sobre fondo blanco, sin filo, sencillamente no se ve, y el blanco
     es justo el que más manda en media docena de fórmulas. */
  outline:1px solid color-mix(in srgb,var(--texto) 20%,transparent);
  transition:flex-grow .3s var(--salida);
}
.proporcion i:first-child{border-radius:999px 0 0 999px}
.proporcion i:last-child{border-radius:0 999px 999px 0}
.proporcion i:only-child{border-radius:999px}

.calc-nota{
  padding:9px 16px 11px; font-size:13px; color:var(--texto-2);
  border-bottom:1px solid var(--linea); background:var(--panel-2);
}
.calc-nota b{color:var(--texto); font-weight:640}
.calc-nota.exacta b{color:var(--verde)}
.calc-nota.avisa{color:var(--ambar); background:var(--ambar-suave)}

/* `hidden` es un atributo del HTML y significa "esto no está". El navegador
   le pone display:none por defecto, pero CUALQUIER regla nuestra con display
   lo pisa —.aviso lleva display:flex—, y entonces sale una caja de aviso
   vacía debajo del campo de la contraseña. Estaba pasando en el candado.
   Se arregla de una vez para todo el archivo. */
[hidden]{display:none !important}

.aviso{
  display:flex; gap:10px; align-items:flex-start; padding:11px 13px;
  border-radius:var(--r-m); font-size:13.5px; line-height:1.4; margin-top:8px;
  background:var(--ambar-suave); color:var(--ambar);
  border:1px solid color-mix(in srgb,var(--ambar) 26%,transparent);
}
.aviso svg{width:16px;height:16px;flex:0 0 auto;margin-top:1px}
.aviso.info{background:var(--tinta-suave); color:var(--texto-2); border-color:var(--linea-fuerte)}
.aviso.info b{color:var(--texto)}
.aviso b{font-weight:640}

.enlaces{display:flex; flex-wrap:wrap; gap:6px}
.enlace{
  display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 11px 0 7px;
  border-radius:var(--r-m); background:var(--panel-2); border:1px solid var(--linea);
  font-size:13px; font-weight:520; color:var(--texto);
  transition:border-color .15s var(--salida), background-color .15s var(--salida), scale .12s var(--salida);
}
.enlace:hover{border-color:var(--linea-fuerte); background:var(--linea)}
.enlace:active{scale:.96}
.enlace i{width:18px;height:18px;border-radius:5px;outline:1px solid var(--contorno);outline-offset:-1px;flex:0 0 auto}

/* ── Modo pesaje: números grandes, para leerlos de un vistazo con el
   móvil en la mesa y las manos ocupadas ───────────────────────────── */
.pes-chips{display:flex; flex-wrap:wrap; gap:7px; margin:-4px 0 14px}
.pes-chips .btn{height:38px; font-size:13.5px}
.pes-chips em{font-style:normal; color:var(--texto-3); font-weight:450; margin-left:4px}
.pes-sube{
  display:inline-block; margin-left:6px; font-weight:680; color:inherit;
  text-decoration:underline; text-underline-offset:2px;
}
.pes-cab{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:10px}
.pes-cab b{display:block; font-size:26px; letter-spacing:-.02em; line-height:1.1}
.pes-cab small{color:var(--texto-3); font-size:12px}
.pes-modo{display:flex; gap:4px; background:var(--panel-2); padding:3px; border-radius:var(--r-m); border:1px solid var(--linea)}
.pes-modo button{
  height:32px; padding:0 11px; border-radius:var(--r-s); font-size:12.5px; font-weight:560;
  color:var(--texto-2); transition:background-color .15s var(--salida), color .15s var(--salida);
}
.pes-modo button[aria-pressed="true"]{background:var(--panel); color:var(--texto); box-shadow:var(--sombra-1)}
.pes-barra{height:4px; background:var(--linea); border-radius:99px; overflow:hidden; margin-bottom:12px}
.pes-barra i{display:block; height:100%; background:var(--verde); transition:width .25s var(--salida)}

.pes-lista{display:flex; flex-direction:column; gap:8px; margin-top:12px}
.pes-fila{
  display:flex; align-items:center; gap:11px; padding:11px 12px;
  background:var(--panel-2); border:1px solid var(--linea); border-radius:var(--r-l);
  transition:background-color .2s var(--salida), border-color .2s var(--salida), opacity .2s var(--salida);
}
.pes-fila.listo{opacity:.62; background:color-mix(in srgb,var(--verde) 8%,transparent); border-color:color-mix(in srgb,var(--verde) 26%,transparent)}
/* Confirmar un ingrediente es EL gesto del taller, y hasta ahora la fila
   simplemente se apagaba. Ahora el verde la recorre de izquierda a derecha:
   con el móvil en la mesa y las manos ocupadas, se ve desde lejos que ha
   cogido el toque. Solo la recién marcada; las demás no reviven en cada
   repintado. */
.pes-fila.recien{position:relative; overflow:hidden}
.pes-fila.recien::before{
  content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:color-mix(in srgb,var(--verde) 26%,transparent);
  transform-origin:left center;
  animation:barrido calc(.5s * var(--ritmo)) var(--salida) both;
}
@keyframes barrido{from{transform:scaleX(0)} 55%{transform:scaleX(1)} to{transform:scaleX(1); opacity:0}}
.pes-fila.recien > *{position:relative; z-index:1}
.pes-fila.recien .pes-ok{animation:sello calc(.42s * var(--ritmo)) var(--salida) both}
@keyframes sello{from{opacity:0; scale:.55} 70%{opacity:1; scale:1.14} to{opacity:1; scale:1}}
.pes-color{width:34px;height:34px;flex:0 0 auto;border-radius:var(--r-s);outline:1px solid var(--contorno);outline-offset:-1px}
.pes-nom{flex:1 1 auto; min-width:0; font-size:15px; font-weight:560; letter-spacing:-.005em}
.pes-nom small{display:block; font-size:12px; color:var(--texto-3); font-weight:450}
.pes-nom small.ojo{color:var(--ambar); font-weight:560}
.pes-nom small.bascula{color:var(--texto-2)}
.pes-nom small.bascula b{font-weight:700; font-variant-numeric:tabular-nums}
.pes-mas{color:var(--texto-3); font-weight:600; margin-right:1px}
.pes-g{
  flex:0 0 auto; text-align:right; font-size:24px; font-weight:700; letter-spacing:-.02em;
  line-height:1.05; min-width:76px;
}
.pes-g em{display:block; font-style:normal; font-size:10.5px; font-weight:500; color:var(--texto-3); letter-spacing:0}
.pes-ok{color:var(--verde)}
.pes-btn{flex:0 0 auto; display:flex; flex-direction:column; gap:5px}
.pes-btn .btn{height:36px; padding:0 12px; font-size:13px}

@media (max-width:520px){
  .pes-fila{flex-wrap:wrap}
  .pes-nom{flex:1 1 100px}
  .pes-btn{flex-direction:row; width:100%; margin-top:2px}
  .pes-btn .btn{flex:1 1 0; height:40px}
  .pes-cab b{font-size:22px}
}

.chip{
  height:24px; padding:0 10px; border-radius:999px; font-size:11.5px; font-weight:620;
  background:var(--ambar-suave); color:var(--ambar); letter-spacing:.01em;
  border:1px solid color-mix(in srgb,var(--ambar) 30%,transparent);
  transition:background-color .15s var(--salida), scale .12s var(--salida);
}
.chip:hover{background:color-mix(in srgb,var(--ambar) 20%,transparent)}
.chip:active{scale:.96}
.chip[aria-pressed="true"]{background:var(--ambar); color:var(--panel); border-color:transparent}
/* El filtro por pigmento no es un aviso, es un estado: va en el color de la
   marca para que se distinga de "tienes cosas pendientes". */
.chip-filtro{
  background:var(--marca-suave); color:var(--marca);
  border-color:color-mix(in srgb,var(--marca) 30%,transparent);
  display:inline-flex; align-items:center; gap:6px;
}
.chip-filtro:hover{background:color-mix(in srgb,var(--marca) 16%,transparent)}
.chip-filtro svg{width:11px;height:11px}

.rectificar{
  display:inline-block; margin-left:8px; font-size:11px; font-weight:560;
  color:var(--texto-3); text-decoration:underline; text-underline-offset:2px;
  transition:color .15s var(--salida);
}
.rectificar:hover{color:var(--marca-2)}

.pendiente-caja{margin-top:5px}
.pendiente-caja small{display:block; color:var(--ambar); font-size:11.5px; font-weight:560; margin-bottom:5px}
.cands{display:flex; flex-wrap:wrap; gap:5px}
.cand{
  display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:6px 11px 6px 8px;
  border-radius:var(--r-m); font-size:12.5px; font-weight:530; text-align:left;
  background:var(--panel-2); border:1px solid color-mix(in srgb,var(--ambar) 36%,transparent);
  color:var(--texto); max-width:100%;
  transition:background-color .15s var(--salida), border-color .15s var(--salida), scale .12s var(--salida);
}
.cand span{min-width:0}
.cand b{display:block; font-weight:640; font-size:13px; letter-spacing:-.005em}
.cand em{
  display:block; font-style:normal; font-size:11px; color:var(--texto-3);
  font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis;
  white-space:nowrap; max-width:46ch;
}
.cand:hover{background:var(--ambar-suave); border-color:var(--ambar)}
.cand:active{scale:.96}
.cand i{width:15px;height:15px;border-radius:4px;outline:1px solid var(--contorno);outline-offset:-1px;flex:0 0 auto}
.cand.no{border-style:dashed; color:var(--texto-2); padding-left:12px; font-weight:560}

.vacio{
  display:grid; place-content:center; justify-items:center; gap:12px;
  height:100%; padding:40px; text-align:center; color:var(--texto-3);
}
.vacio svg{width:38px;height:38px; opacity:.5}
.vacio p{margin:0; max-width:34ch; font-size:14px}
.vacio b{color:var(--texto-2); font-weight:600; display:block; font-size:15.5px; margin-bottom:2px}

/* ── Barra inferior (solo móvil) ─────────────────────────────────── */
.volver{display:none}

/* ── Móvil ───────────────────────────────────────────────────────── */
@media (max-width:860px){
  /* min-width:0 es obligatorio: sin él la columna no puede encogerse por debajo
     del nombre más largo (van sin partir palabra) y la pantalla se arrastra
     de lado. No se nota mirando, porque los nombres se cortan con puntos. */
  .cuerpo{min-width:0}
  .columna-lista{flex:1 1 auto; border-right:0; min-width:0; max-width:100%}
  .lista{overflow-x:hidden}
  .contador{min-width:0}
  .columna-ficha{
    position:fixed; inset:0; z-index:40; background:var(--panel);
    transform:translateX(100%); visibility:hidden;
    transition:transform .26s var(--salida), visibility .26s var(--salida);
  }
  body[data-ficha="on"] .columna-ficha{transform:none; visibility:visible}
  .ficha{padding:0 16px 110px}
  .volver{
    display:flex; align-items:center; gap:8px; height:52px;
    position:sticky; top:0; z-index:2; margin:0 -16px 8px; padding:0 12px;
    width:calc(100% + 32px);
    background:color-mix(in srgb,var(--panel) 88%,transparent);
    backdrop-filter:saturate(1.6) blur(14px);
    border-bottom:1px solid var(--linea); font-weight:560; color:var(--texto-2);
    padding-top:env(safe-area-inset-top);
    height:calc(52px + env(safe-area-inset-top));
  }
  .volver svg{width:19px;height:19px}
  .volver:active{scale:.98}
  .hero{gap:14px; padding-top:8px}
  .hero-muestra{width:96px;height:96px;border-radius:var(--r-l)}
  .hero-txt h2{font-size:21px}
  /* La marca se queda: el buscador pasa a su propia fila y así gana ancho,
     que en 390px se quedaba en 163px y era incómodo de leer. */
  .cab-fila{flex-wrap:wrap; gap:8px}
  /* min-width:0 también en el h1: si no, su texto sin partir impide encoger
     y el tercer botón se cae a otra fila dejando un hueco. */
  /* base 0: con flex-wrap la fila se PARTE antes de encoger, así que si la
     marca declara su ancho natural empuja un botón a la fila siguiente. */
  .marca{flex:1 1 0; min-width:0}
  .marca h1{min-width:0; flex:0 1 auto}
  .buscador{flex:1 1 100%; order:3}
  .cabecera{gap:8px}
  .cab-fila .btn-icono{width:44px; height:44px}
}
@media (max-width:420px){
  /* Antes que cortar la marca, se cae la palabra "Colores". */
  .marca-colores{display:none}
}
@media (max-width:359px){
  /* En pantallas muy estrechas la marca baja un punto, pero se lee entera. */
  .logo-marca{font-size:14px}
  .cab-fila .btn-icono{width:40px; height:40px}
  .ing-pct{display:none}
  .acciones-ficha{
    position:fixed; left:0; right:0; bottom:0; z-index:3;
    /* Cuatro botones no caben en una fila de móvil: "Preparar" ocupa la suya,
       que es la acción del día a día, y las otras tres se reparten debajo. */
    display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px;
    padding-bottom:max(10px,env(safe-area-inset-bottom));
    background:color-mix(in srgb,var(--panel) 92%,transparent);
    backdrop-filter:saturate(1.6) blur(14px);
    border-top:1px solid var(--linea);
  }
  .acciones-ficha .btn{flex:1 1 0; min-width:0}
  .acciones-ficha #btn-preparar{flex:1 1 100%; height:48px; font-size:15px}
}
@media (min-width:861px){
  .acciones-ficha{display:flex; gap:8px; margin-top:18px; flex-wrap:wrap}
}

/* ── Diálogos ────────────────────────────────────────────────────── */
dialog{
  border:0; padding:0; background:transparent; max-width:100%; max-height:100%;
  color:var(--texto);
}
dialog::backdrop{background:rgba(10,12,14,.5); backdrop-filter:blur(3px)}
.hoja{
  width:min(620px,calc(100vw - 24px)); max-height:min(86dvh,860px);
  background:var(--panel); border:1px solid var(--linea);
  border-radius:var(--r-xl); box-shadow:var(--sombra-3);
  display:flex; flex-direction:column; overflow:hidden;
}
.hoja-cab{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:15px 18px; border-bottom:1px solid var(--linea); flex:0 0 auto;
}
.hoja-cab h3{font-size:16.5px}
.hoja-cuerpo{padding:16px 18px; overflow-y:auto; flex:1 1 auto}
.hoja-pie{
  display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;
  padding:13px 18px; border-top:1px solid var(--linea); background:var(--panel-2); flex:0 0 auto;
}
dialog[open] .hoja{animation:entra .2s var(--salida)}
@keyframes entra{from{opacity:0; transform:translateY(8px) scale(.99)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;
    animation-delay:0ms !important}
  :root{--ritmo:0}
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none !important}
}

.campo{display:block; margin-bottom:14px}
.campo > span{display:block; font-size:12.5px; font-weight:600; color:var(--texto-2); margin-bottom:5px; letter-spacing:.01em}
.campo input,.campo textarea,.campo select{
  width:100%; height:44px; padding:0 12px;
  background:var(--panel-2); border:1px solid var(--linea-fuerte); border-radius:var(--r-m);
  font-size:15px;
  transition:border-color .15s var(--salida), box-shadow .15s var(--salida);
}
.campo textarea{height:auto; min-height:76px; padding:10px 12px; resize:vertical; line-height:1.45}
.campo input:focus,.campo textarea:focus,.campo select:focus{
  outline:none; border-color:var(--marca); box-shadow:0 0 0 3px color-mix(in srgb,var(--marca) 14%,transparent)
}
.rejilla-ing{display:flex; flex-direction:column; gap:7px}
.fila-ing{display:flex; gap:7px; align-items:flex-start}
.fila-ing .btn-icono{margin-top:0}

/* Buscador de ingredientes: la lista se despliega EN LÍNEA, no flotando,
   porque dentro de un diálogo con scroll una capa flotante se recorta. */
.busc{flex:1 1 auto; min-width:0}
.busc-campo{position:relative; display:flex; align-items:center}
.busc-color{
  position:absolute; left:9px; width:22px;height:22px;border-radius:6px;
  outline:1px solid var(--contorno); outline-offset:-1px; pointer-events:none;
}
/* Ojo con el nombre: hubo un ".vacio" suelto para el panel de "elige un color"
   que le ganaba a este por orden y le metía 40px de relleno. Los modificadores
   llevan apellido para que no vuelva a pasar. */
.busc-color.busc-sin-color{
  /* Sin elegir: solo un contorno tenue. El rayado que había antes metía más
     ruido del que aportaba para lo único que tiene que decir. */
  outline-color:var(--linea-fuerte); background:transparent; opacity:.55;
}
.busc .busc-q{
  width:100%; height:44px; padding:0 12px 0 39px;
  background:var(--panel-2); border:1px solid var(--linea-fuerte); border-radius:var(--r-m);
  font-size:15px; min-width:0;
  transition:border-color .15s var(--salida), box-shadow .15s var(--salida), background-color .15s var(--salida);
}
.busc .busc-q::placeholder{color:var(--texto-3); font-size:14px}
.busc .busc-q:focus{outline:none; border-color:var(--marca); background:var(--panel); box-shadow:0 0 0 3px color-mix(in srgb,var(--marca) 14%,transparent)}
.busc-lista{
  margin-top:5px; max-height:238px; overflow-y:auto; overscroll-behavior:contain;
  background:var(--panel); border:1px solid var(--linea-fuerte);
  border-radius:var(--r-m); box-shadow:var(--sombra-2); padding:4px;
}
.busc-grupo{
  padding:7px 8px 4px; font-size:10.5px; font-weight:680; letter-spacing:.06em;
  text-transform:uppercase; color:var(--texto-3);
}
.busc-op{
  display:flex; align-items:center; gap:9px; width:100%; min-height:40px;
  padding:0 9px; border-radius:var(--r-s); text-align:left; font-size:14.5px;
  color:var(--texto); transition:background-color .1s var(--salida);
}
.busc-op i{width:20px;height:20px;border-radius:5px;flex:0 0 auto;outline:1px solid var(--contorno);outline-offset:-1px}
.busc-op:hover{background:var(--panel-2)}
.busc-op.on{background:var(--tinta-suave); color:var(--texto); font-weight:620; box-shadow:inset 2px 0 0 var(--marca)}
.busc-nada{padding:14px 10px; font-size:13.5px; color:var(--texto-3); text-align:center}
.fila-ing > input{width:96px; height:44px; flex:0 0 auto; padding:0 10px; text-align:right; background:var(--panel-2); border:1px solid var(--linea-fuerte); border-radius:var(--r-m); font-weight:600}
.fila-ing .btn-icono{width:44px;height:44px;border-radius:var(--r-m)}

.interruptor{display:flex; align-items:center; gap:11px; padding:12px 0; cursor:pointer}
.interruptor input{position:absolute; opacity:0; width:0; height:0}
.pista{
  width:46px;height:28px;flex:0 0 auto;border-radius:999px; background:var(--linea-fuerte);
  position:relative; transition:background-color .18s var(--salida);
}
.pista::after{
  content:""; position:absolute; top:3px; left:3px; width:22px;height:22px;
  border-radius:50%; background:#fff; box-shadow:var(--sombra-1);
  transition:translate .18s var(--salida);
}
.interruptor input:checked + .pista{background:var(--verde)}
.interruptor input:checked + .pista::after{translate:18px 0}
.interruptor input:focus-visible + .pista{outline:2px solid var(--marca); outline-offset:2px}
.interruptor-txt{font-size:14.5px; font-weight:530}
.interruptor-txt small{display:block; font-weight:450; font-size:12.5px; color:var(--texto-3)}

/* Idea 13: historial VISUAL. Guardar la fórmula de antes no sirve de nada si
   para saber qué cambió hay que restaurarla y mirar. Aquí cada cambio enseña
   el color de antes y el de después, uno al lado del otro. */
.historial{list-style:none; margin:0; padding:0}
.historial li{
  padding:12px 0; border-bottom:1px solid var(--linea); font-size:13.5px;
  display:flex; gap:13px; align-items:center;
}
.historial li:last-child{border-bottom:0}
.hist-par{display:flex; align-items:center; gap:5px; flex:0 0 auto}
.hist-par i{
  width:30px;height:30px;border-radius:var(--r-s); display:block;
  outline:1px solid color-mix(in srgb,var(--texto) 18%,transparent); outline-offset:-1px;
}
.hist-par svg{width:13px;height:13px;color:var(--texto-3);flex:0 0 auto}
.hist-txt{flex:1 1 auto; min-width:0}
.hist-txt b{display:block; font-weight:560; letter-spacing:-.005em}
.hist-txt time{display:block; color:var(--texto-3); font-size:11.5px; margin-top:1px}
.hist-txt em{font-style:normal; color:var(--texto-3); font-size:11.5px}
.historial .btn{height:32px; padding:0 11px; font-size:12.5px; flex:0 0 auto}
@media (max-width:520px){
  .historial li{flex-wrap:wrap}
  .hist-txt{flex:1 1 120px}
  .historial .btn{width:100%; order:3; height:38px}
}

/* ── Candado ─────────────────────────────────────────────────────── */
.candado{
  position:fixed; inset:0; z-index:100; display:grid; place-items:center;
  padding:24px; background:var(--fondo);
}
.candado-caja{

/* OJO: esta va en su PROPIA regla, y no metida en la lista de arriba.
   En CSS, si UN selector de una lista separada por comas no se entiende, se
   tira la regla ENTERA. Con :has() dentro de aquella lista, un navegador que
   no lo soporte (Firefox ESR 115, Chrome viejo del taller) le enseñaba al
   operario TODOS los botones, incluido Eliminar. Comprobado. */
/* Ya no hay interruptor: el control es el propio sello, y para el taller ni

.sync-piloto{
  display:flex; align-items:center; gap:7px; height:34px; padding:0 12px 0 10px;
  border-radius:999px; border:1px solid var(--linea); background:var(--panel-2);

     translate:-50% para centrarse en la pantalla: el piloto se iba media
     anchura a la izquierda y se comía el botón del PDF. */
  animation:asoma-piloto calc(.28s * var(--ritmo)) var(--salida) both;
}
@keyframes asoma-piloto{from{opacity:0; scale:.9} to{opacity:1; scale:1}}

  width:8px; height:8px; border-radius:50%; background:var(--ambar); flex:0 0 auto;
}

@keyframes late{0%,100%{opacity:1}50%{opacity:.25}}
@media (max-width:640px){ .sync-piloto span{display:none} .sync-piloto{padding:0 9px} }

/* Aviso de versión nueva. Nace de un lío real: al subir una versión, la
   primera vez que abres la app sigues viendo la guardada —así funciona el
   funcionamiento sin cobertura— y la nueva llega por detrás. Sin decirlo por
   ningún sitio, eso es imposible de adivinar: parece que la subida no ha
   funcionado. Ahora se avisa y se recarga de un toque. */

}
