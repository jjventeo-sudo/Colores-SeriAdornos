<script type="module">
/**
 * MOTOR DE COLOR — SeriAdornos
 * ============================
 *
 * Por qué no vale una media de RGB (que es lo que hacía la app anterior):
 * el RGB mezcla LUZ. Sumar luz amarilla y luz azul da luz blanca/gris.
 * La pintura hace lo contrario: cada pigmento RESTA parte de la luz que
 * le llega. Amarillo absorbe el azul, el azul absorbe el rojo, y lo único
 * que sobrevive a los dos es el verde. Por eso amarillo + azul = verde.
 *
 * Aquí se usa Kubelka-Munk de una constante, que es el modelo estándar en
 * industria para mezcla de pigmentos:
 *
 *      K/S = (1 - R)^2 / (2R)          absorción relativa de un pigmento
 *      (K/S)mezcla = Σ ( peso_i · fuerza_i · (K/S)_i )   se suman
 *      R = 1 + K/S - sqrt(K/S^2 + 2·K/S)                 y se vuelve a color
 *
 * Se aplica por separado a los tres canales. No es espectrofotometría: es
 * una aproximación honesta, muchísimo más cercana a la realidad que una
 * media, y preparada para afinarse con muestras reales (campo `fuerza` y
 * `hex_referencia` de cada materia prima).
 *
 * Lo que este motor NO puede simular, y por eso lo AVISA en vez de mentir:
 *   - el brillo de metalizados, nácares, purpurinas y escarcha
 *   - los fluorescentes, que emiten luz y se salen de lo que da una pantalla
 *   - cualquier materia prima cuyo color aún no esté confirmado por ti
 */

// ---------------------------------------------------------------- utilidades

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function hexARgb(hex) {
  const h = String(hex).replace('#', '').trim();
  const f = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
  return [
    parseInt(f.slice(0, 2), 16),
    parseInt(f.slice(2, 4), 16),
    parseInt(f.slice(4, 6), 16),
  ];
}

function rgbAHex(r, g, b) {
  const t = v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
  return `#${t(r)}${t(g)}${t(b)}`;
}

// sRGB <-> lineal. Trabajar en lineal evita que los oscuros se coman todo.
const aLineal = c => {
  const v = c / 255;
  return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
};
const aSrgb = v => {
  const c = v <= 0.0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - 0.055;
  return clamp(c, 0, 1) * 255;
};

// Los extremos absolutos rompen la fórmula (división por cero), así que
// se acotan a un blanco y un negro alcanzables por una pintura real.
const R_MIN = 0.006, R_MAX = 0.995;

const ks = R => {
  const r = clamp(R, R_MIN, R_MAX);
  return ((1 - r) * (1 - r)) / (2 * r);
};

const deKs = k => {
  if (k <= 0) return R_MAX;
  return clamp(1 + k - Math.sqrt(k * k + 2 * k), R_MIN, R_MAX);
};

// ------------------------------------------------- desarrollo de la receta

/**
 * Convierte una fórmula en la lista de materias primas que realmente la
 * componen, entrando dentro de las fórmulas anidadas tantos niveles como haga
 * falta. Devuelve también lo que no ha podido resolver, para poder avisar.
 *
 * @returns {{partes: Map<string,number>, total: number, sinResolver: Array, profundidad: number}}
 */
function desarrollar(formulaId, indice, { _visitadas = new Set(), _nivel = 0 } = {}) {
  const f = indice.formulas.get(formulaId);
  const partes = new Map();
  const sinResolver = [];
  let profundidad = _nivel;

  if (!f) return { partes, total: 0, sinResolver, profundidad };

  // Cortafuegos: una receta que se llamara a sí misma colgaría el navegador.
  if (_visitadas.has(formulaId)) {
    sinResolver.push({ nombre: f.nombre, motivo: 'referencia circular', cantidad: 0 });
    return { partes, total: 0, sinResolver, profundidad };
  }
  _visitadas.add(formulaId);

  for (const ing of f.ingredientes) {
    if (ing.tipo === 'materia') {
      partes.set(ing.ref, (partes.get(ing.ref) || 0) + ing.cantidad);

    } else if (ing.tipo === 'formula') {
      const sub = desarrollar(ing.ref, indice, { _visitadas, _nivel: _nivel + 1 });
      profundidad = Math.max(profundidad, sub.profundidad);
      if (sub.total > 0) {
        // La sub-receta entra en la proporción que le toca por su peso.
        const escala = ing.cantidad / sub.total;
        for (const [mp, c] of sub.partes) {
          partes.set(mp, (partes.get(mp) || 0) + c * escala);
        }
        sinResolver.push(...sub.sinResolver);
      } else {
        sinResolver.push({ nombre: ing.nombre, motivo: 'la fórmula enlazada está vacía',
                           cantidad: ing.cantidad });
      }

    } else {
      // 'sin_resolver': un extra que puede apuntar a dos fórmulas distintas.
      sinResolver.push({ nombre: ing.nombre, motivo: 'enlace pendiente de decidir',
                         cantidad: ing.cantidad, candidatos: ing.candidatos });
    }
  }

  _visitadas.delete(formulaId);
  let total = 0;
  for (const c of partes.values()) total += c;
  return { partes, total, sinResolver, profundidad };
}

// ------------------------------------------------------------- la mezcla

/**
 * Calcula el color de una mezcla de materias primas.
 * @param {Map<string,number>} partes  id de materia prima -> gramos
 * @param {Map<string,object>} materias
 */
function mezclar(partes, materias, alfa = 0.5) {
  let masaTotal = 0;
  for (const c of partes.values()) masaTotal += c;
  if (masaTotal <= 0) {
    return { hex: '#d8d8d8', avisos: [{ tipo: 'vacia', texto: 'Sin ingredientes' }], fiabilidad: 0 };
  }

  const avisos = [];
  let ksMezcla = [0, 0, 0];
  let logMezcla = [0, 0, 0];   // segundo modelo: media geométrica de reflectancias
  let sumaPesos = 0;
  let pesoConColor = 0;      // masa de la que sí sabemos el color
  let pesoSinColor = 0;
  let pesoNoCalibrado = 0;
  let brillo = 0;            // masa de metalizados / nácares / purpurinas
  let fluor = 0, fluorConColor = 0;
  let pesoAbierto = 0;
  const efectos = new Set();
  const abiertos = new Set();

  for (const [mpId, gramos] of partes) {
    const m = materias.get(mpId);

    // Los efectos se miran ANTES de descartar por falta de color: una
    // purpurina sigue dando brillo aunque no sepamos de qué color es.
    if (m && (m.tipo === 'metalizado' || m.tipo === 'nacarado' || m.tipo === 'purpurina')) {
      brillo += gramos; efectos.add(m.tipo);
    }
    if (m && m.tipo === 'fluor') { fluor += gramos; efectos.add('fluor'); }

    if (!m || !m.hex_referencia) {
      // Hay dos motivos muy distintos para no tener color, y confundirlos es
      // lo que hacía que la app llamara "fallo" a una decisión del taller:
      //
      //   · ABIERTO: la receta dice CUÁNTA purpurina o cuánto fluor lleva, y
      //     cuál se elige al preparar. No falta nada; falta por decidir, y se
      //     decide en el bote.
      //   · SIN COLOR: una materia prima que de verdad no sabemos de qué
      //     color es. Eso sí hay que revisarlo.
      if (m && m.abierto) { pesoAbierto += gramos; abiertos.add(m.nombre); }
      else { pesoSinColor += gramos; if (m) efectos.add(`sin color definido: ${m.nombre}`); }
      continue;
    }

    const w = gramos / masaTotal;
    const fuerza = m.fuerza ?? 1;
    const [r, g, b] = hexARgb(m.hex_referencia).map(aLineal);

    // El transparente (CRUDO y similares) casi no absorbe: diluye.
    // Su opacidad baja hace que aporte poco K/S, que es justo lo que pasa
    // en el bote: rebajar con transparente aclara y desatura.
    //
    // El exponente corrige el defecto de Kubelka-Munk de una constante, donde
    // un 1% de negro ennegrece muchísimo más de lo que hace en el bote.
    const peso = Math.pow(w * fuerza * (m.opacidad ?? 1), m.exponente ?? 1);

    ksMezcla[0] += peso * ks(r);
    ksMezcla[1] += peso * ks(g);
    ksMezcla[2] += peso * ks(b);

    logMezcla[0] += peso * Math.log(clamp(r, R_MIN, R_MAX));
    logMezcla[1] += peso * Math.log(clamp(g, R_MIN, R_MAX));
    logMezcla[2] += peso * Math.log(clamp(b, R_MIN, R_MAX));
    sumaPesos += peso;

    pesoConColor += gramos;
    // Solo cuenta como "sin calibrar" un pigmento suelto cuyo color he estimado yo.
    // Que las 12 bases estén pendientes de medir es un aviso general de la app:
    // repetirlo en las 860 fichas lo convertiría en ruido que nadie lee.
    if (!m.calibrado && m.familia !== 'base') pesoNoCalibrado += gramos;
    // El realce de saturación solo puede aplicarse cuando SABEMOS de qué color
    // es el fluorescente. Con un "COLOR FLUOR" sin concretar, avivar el resto
    // de la mezcla sería inventarse hacia qué tono tira.
    if (m.tipo === 'fluor') fluorConColor += gramos;
  }

  if (pesoConColor <= 0) {
    return { hex: '#d8d8d8', fiabilidad: 0,
             avisos: [{ tipo: 'sin-datos', texto: 'Ninguna materia prima tiene color definido' }] };
  }

  // Si parte de la mezcla no tiene color conocido, se reparte el resto
  // proporcionalmente en lugar de fingir que esa parte es transparente.
  const cobertura = pesoConColor / masaTotal;
  if (cobertura < 1) {
    ksMezcla = ksMezcla.map(k => k / cobertura);
    if (pesoSinColor > 0) {
      avisos.push({
        tipo: 'incompleta',
        texto: `El ${Math.round(pesoSinColor / masaTotal * 100)}% de la mezcla son materias primas sin color confirmado`,
      });
    }
    if (pesoAbierto > 0) {
      const q = [...abiertos];
      // Un "0%" no dice nada. Media cucharada de purpurina sobre 100 g redondea
      // a cero y quedaba como si no llevara.
      const pct = pesoAbierto / masaTotal * 100;
      const cuanto = pct < 1 ? 'menos del 1%' : `un ${Math.round(pct)}%`;
      avisos.push({
        tipo: 'abierto',
        texto: `Lleva ${cuanto} de ` +
               `${q.length === 1 ? q[0] : q.slice(0, -1).join(', ') + ' y ' + q[q.length - 1]}: ` +
               `eliges cuál al preparar, así que esa parte no entra en la muestra.`,
      });
    }
  }

  // Kubelka-Munk se pasa de fuerte con las dosis pequeñas (1 g de negro en 100
  // de amarillo no da verde oliva) y el multiplicativo se queda corto con las
  // grandes. La proporción de mezcla la fijó el ajuste sobre las 860 fórmulas.
  let rgb = [0, 1, 2].map(i => {
    const rKm = deKs(ksMezcla[i]);
    const rMl = sumaPesos > 0 ? Math.exp(logMezcla[i] / sumaPesos) : rKm;
    return aSrgb(Math.pow(rKm, alfa) * Math.pow(clamp(rMl, R_MIN, R_MAX), 1 - alfa));
  });

  // Los fluorescentes emiten luz: ninguna pantalla los reproduce. Se satura
  // el resultado para acercarse, y se avisa de que es una aproximación.
  if (fluor / masaTotal > 0.02) {
    if (fluorConColor / masaTotal > 0.02)
      rgb = saturar(rgb, 1 + Math.min(0.55, (fluorConColor / masaTotal) * 1.6));
    avisos.push({ tipo: 'fluor', texto: 'Lleva fluorescente: el tono real es más vivo de lo que puede mostrar una pantalla' });
  }

  if (brillo / masaTotal > 0.02) {
    avisos.push({ tipo: 'brillo', texto: 'Lleva metalizado, nácar o purpurina: el brillo no se puede simular, solo el tono de fondo' });
  }

  if (pesoNoCalibrado / masaTotal > 0.15) {
    avisos.push({ tipo: 'sin-calibrar', texto: 'Color estimado: faltan muestras reales de alguna materia prima' });
  }

  // Fiabilidad de 0 a 100: cuánto se puede fiar uno de esta muestra.
  let fiabilidad = 100;
  fiabilidad -= (1 - cobertura) * 70;
  fiabilidad -= (pesoNoCalibrado / masaTotal) * 25;
  fiabilidad -= (brillo / masaTotal) * 40;
  fiabilidad -= (fluor / masaTotal) * 30;

  return {
    hex: rgbAHex(...rgb),
    avisos,
    efectos: [...efectos],
    fiabilidad: Math.round(clamp(fiabilidad, 0, 100)),
    metalizado: brillo / masaTotal > 0.02,
  };
}

function saturar([r, g, b], f) {
  const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  return [l + (r - l) * f, l + (g - l) * f, l + (b - l) * f].map(v => clamp(v, 0, 255));
}

// --------------------------------------------------------------- fachada

/** Color de una fórmula, desarrollando sus recetas anidadas. */
function colorDeFormula(formulaId, indice) {
  const { partes, sinResolver, profundidad } = desarrollar(formulaId, indice);
  const res = mezclar(partes, indice.materias, indice.alfa);
  if (sinResolver.length) {
    res.avisos.unshift({
      tipo: 'pendiente',
      texto: sinResolver.length === 1
        ? `"${sinResolver[0].nombre}" está pendiente de enlazar`
        : `${sinResolver.length} ingredientes pendientes de enlazar`,
    });
    res.fiabilidad = Math.round(res.fiabilidad * 0.6);
  }
  res.sinResolver = sinResolver;
  res.profundidad = profundidad;
  return res;
}

/** Prepara los índices que necesita el motor a partir del fichero de datos. */
function crearIndice(datos) {
  return {
    formulas: new Map(datos.formulas.map(f => [f.id, f])),
    materias: new Map(datos.materias_primas.map(m => [m.id, m])),
    alfa: datos.modelo?.alfa_km ?? 0.5,
  };
}

// ------------------------------------------------------- lotes que se pueden pesar

/**
 * El lote de GRAMOS ENTEROS más parecido al que se pide.
 *
 * La báscula del taller pesa de gramo en gramo, así que decirle a alguien
 * "echa 677,26 g" es decirle que se lo invente. Y multiplicar por un número
 * redondo tampoco vale: 900 / 299 = 3,01 y salen decimales en todo.
 *
 * Se prueban todos los totales enteros de una horquilla alrededor de lo pedido
 * y gana el que menos deforme la fórmula; a igualdad, el más cercano. Cuando
 * existe un múltiplo justo de la receta original (900 -> 897 = x3) sale solo,
 * porque su desvío es cero.
 *
 * @param cant  cantidades de la receta
 * @param objetivo gramos que se quieren preparar
 * @param opts.paso   lo que distingue la báscula (1 g)
 * @param opts.tope   máximo absoluto (la capacidad útil del bote)
 */
function lotePractico(cant, objetivo, {paso = 1, tope = Infinity,
                                              abajo = 0.88, arriba = 1.05} = {}) {
  const base = cant.reduce((s, c) => s + c, 0);
  if (!base || !(objetivo > 0)) return null;
  const p = cant.map(c => c / base);

  const lo = Math.max(paso * cant.length, Math.floor(objetivo * abajo));
  const hi = Math.min(Math.ceil(objetivo * arriba), Math.floor(tope));
  let mejor = null;

  for (let T = lo; T <= hi; T += paso) {
    const q = p.map(x => Math.round(x * T / paso) * paso);
    if (q.some(v => v < paso)) continue;          // algo no se podría pesar
    const total = q.reduce((s, v) => s + v, 0);
    if (total > tope) continue;
    let err = 0;
    for (let i = 0; i < q.length; i++) err = Math.max(err, Math.abs(q[i] / total - p[i]) / p[i]);
    const dist = Math.abs(total - objetivo);
    if (!mejor || err < mejor.error - 1e-12 ||
        (Math.abs(err - mejor.error) < 1e-12 && dist < mejor.distancia)) {
      mejor = { total, cantidades: q, error: err, distancia: dist, exacto: err < 1e-9 };
    }
  }
  return mejor;
}

/** Lote mínimo para que hasta el ingrediente más pequeño se pueda pesar. */
function loteMinimoPara(cant, paso = 1) {
  const base = cant.reduce((s, c) => s + c, 0);
  const menor = Math.min(...cant.filter(c => c > 0));
  return Math.ceil(base * paso / menor - 1e-9);
}

/**
 * El lote FIABLE más cercano: un múltiplo justo de la receta.
 *
 * En un múltiplo entero no hay que redondear nada, así que la proporción sale
 * clavada. Es la salida cuando lo que se pide no se puede repartir bien:
 * pedir 100 g de una fórmula que lleva 2 g de negro sobre 299 deja el negro en
 * 0,7 g, y con báscula de gramo eso es un 42% de desvío.
 */
function loteFiable(cant, objetivo, paso = 1) {
  const base = cant.reduce((s, c) => s + c, 0);
  if (!base) return null;
  let mejor = null;
  for (let k = 1; k <= Math.max(2, Math.ceil(objetivo / base) + 1); k++) {
    const q = cant.map(c => c * k);
    if (q.some(v => Math.abs(v - Math.round(v)) > 1e-9 || v < paso)) continue;
    const total = k * base;
    const dist = Math.abs(total - objetivo);
    if (!mejor || dist < mejor.distancia) {
      mejor = { total, cantidades: q.map(Math.round), veces: k,
                error: 0, distancia: dist, exacto: true };
    }
  }
  return mejor;
}

/* ═══════════════════════════════════════════════════════════════════════
   LA NUBE

   Habla con Supabase por su API de HTTP normal, sin su librería.

   Por qué sin librería, que es una decisión con consecuencias:

     · Esta app es UN archivo que tiene que abrir sin cobertura. Meterle 60 KB
       de librería con su propia conexión permanente por dentro va justo en
       contra de eso.
     · La conexión permanente (WebSocket) es lo primero que se rompe con el
       wifi de una nave: se cae, hay que reconectar, hay que volver a
       suscribirse, y mientras tanto no te enteras de nada y no lo sabes.
       Preguntar "¿hay algo nuevo?" cada pocos segundos no se rompe: si falla
       una vez, la siguiente ya trae lo que faltaba.

   Cómo sabe qué ha cambiado: cada fila lleva `tocada`, que rellena la propia
   base de datos en cada escritura. Sincronizar es preguntar por lo que tenga
   `tocada` mayor que la última vez. Nada de comparar 860 fórmulas.

   IMPORTANTE sobre los permisos: aquí NO hay ninguna comprobación de si
   puedes escribir. Se manda y la base de datos decide. Las reglas viven en el
   servidor (ver esquema.sql) y son las únicas que cuentan; lo que haga la app
   con los botones es comodidad, no seguridad.
   ═══════════════════════════════════════════════════════════════════════ */

const CLAVE_SESION_NUBE = 'seriadornos-nube-sesion';
const CLAVE_PENDIENTES  = 'seriadornos-nube-pendientes';
const CLAVE_ESPEJO      = 'seriadornos-nube-espejo';
const CLAVE_TOCADAS     = 'seriadornos-nube-tocadas';
const CLAVE_CHOQUES     = 'seriadornos-nube-choques';

const leer = (k, x=null) => { try{ return JSON.parse(localStorage.getItem(k)) ?? x; }catch(_){ return x; } };
const escribir = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(_){ return false; } };

/* Cuánto se espera antes de dar una petición por perdida.

   Esto NO sobra. "Sin cobertura" tiene dos formas y solo una avisa: el móvil
   sin red corta al instante, pero un wifi que sigue enganchado y no llega a
   ninguna parte —el de la nave cuando se cuelga el router, o el portal de un
   hotel— deja la petición COLGADA. Sin un tope, eso se veía así:

     · al arrancar, pantalla en blanco para siempre, teniendo la copia local
       entera al lado sin usar;
     · al guardar, un "Guardando…" eterno y el cambio sin meter en la cola.

   Comprobado con el servidor de pruebas colgando las peticiones a propósito.
   Con tope, las dos cosas pasan a ser "sin conexión", que es la verdad, y la
   app sigue funcionando con lo que tiene. */
const ESPERA_MS = 12000;
const ESPERA_ARRANQUE_MS = 7000;   // arrancando hay alguien mirando la pantalla

async function traer(url, opciones = {}, ms){
  ms = ms || ESPERA_MS;
  const corte = new AbortController();
  const reloj = setTimeout(()=>corte.abort(), ms);
  try{
    return await fetch(url, {...opciones, signal: corte.signal});
  }finally{ clearTimeout(reloj); }
}

function crearNube({url, clave}){
  if(!url || !clave) return null;
  const base = String(url).replace(/\/+$/, '');
  let ses = leer(CLAVE_SESION_NUBE);          // {access, refresh, caduca, email, uid}
  let rol = null;
  const oyentes = new Set();
  const avisar = (qué, dato) => { for(const f of oyentes) { try{ f(qué, dato); }catch(_){} } };

  // ── Lo básico de hablar con el servidor ──────────────────────────────
  async function pedir(ruta, opciones = {}, reintento = true){
    const {espera, ...init} = opciones;
    const cab = {
      'apikey': clave,
      'Content-Type': 'application/json',
      ...(init.headers || {}),
    };
    if(ses?.access) cab['Authorization'] = 'Bearer ' + ses.access;

    let r;
    try{
      r = await traer(base + ruta, {...init, headers: cab}, espera);
    }catch(e){
      // Sin red, o red que no lleva a ninguna parte. No es un error del
      // programa: es el taller sin cobertura.
      const err = new Error('sin conexión'); err.sinRed = true; throw err;
    }

    // 401 con sesión: casi siempre es el testigo caducado. Se renueva UNA vez
    // y se reintenta; si vuelve a fallar, es que la sesión ya no vale.
    if(r.status === 401 && ses?.refresh && reintento){
      if(await renovar()) return pedir(ruta, opciones, false);
      salir();
      const err = new Error('sesión caducada'); err.sesion = true; throw err;
    }
    if(!r.ok){
      let detalle = '';
      try{ detalle = (await r.json()).message || ''; }catch(_){}
      const err = new Error(detalle || ('error ' + r.status));
      err.status = r.status;
      // Un proyecto gratuito de Supabase se PAUSA solo tras unos días sin
      // actividad (vacaciones de agosto, sin ir más lejos). Los datos siguen
      // ahí, pero la API deja de contestar como debe. Sin distinguirlo, la app
      // decía "sin conexión" y te mandaba a mirar el wifi, que no era.
      if([500, 502, 503, 504, 520, 521, 522, 540].includes(r.status)) err.dormido = true;
      throw err;
    }
    /* OJO: NO se llama a r.json() a pelo.

       PostgREST devuelve el CUERPO VACÍO cuando se le pide
       'Prefer: return=minimal' —que es lo que se manda al guardar—, y encima
       lo hace con un 201, no con un 204. Llamando a .json() sobre eso salta
       "Unexpected end of JSON input" y la app avisaba de un fallo... cuando la
       fila ya estaba guardada. Susto y ningún dato perdido, que es de los
       errores que peor sientan.

       Y no lo cazó ninguna prueba porque mi Supabase de mentira contestaba
       '[]', que sí es JSON. Un doble más blando que el original no prueba
       nada: ya está corregido también ahí. */
    if(r.status === 204) return null;
    const txt = await r.text();
    if(!txt) return null;
    try{ return JSON.parse(txt); }catch(_){ return null; }
  }

  function guardarSesion(j){
    ses = {
      access: j.access_token,
      refresh: j.refresh_token,
      // Un minuto de margen: renovar justo en el límite es pedir un 401.
      caduca: Date.now() + Math.max(0, (j.expires_in || 3600) - 60) * 1000,
      email: j.user?.email || ses?.email || '',
      uid: j.user?.id || ses?.uid || '',
    };
    escribir(CLAVE_SESION_NUBE, ses);
  }

  async function renovar(){
    if(!ses?.refresh) return false;
    try{
      const j = await traer(base + '/auth/v1/token?grant_type=refresh_token', {
        method: 'POST',
        headers: {'apikey': clave, 'Content-Type': 'application/json'},
        body: JSON.stringify({refresh_token: ses.refresh}),
      }).then(r => r.ok ? r.json() : Promise.reject(r));
      guardarSesion(j);
      return true;
    }catch(_){ return false; }
  }

  // ── Entrar y salir ───────────────────────────────────────────────────
  async function entrar(email, password){
    let r;
    try{
      r = await traer(base + '/auth/v1/token?grant_type=password', {
        method: 'POST',
        headers: {'apikey': clave, 'Content-Type': 'application/json'},
        body: JSON.stringify({email: String(email).trim(), password}),
      });
    }catch(_){
      const e = new Error('No hay conexión con la nube'); e.sinRed = true; throw e;
    }
    const j = await r.json().catch(()=>({}));
    if(!r.ok){
      // El mensaje de Supabase viene en inglés y no ayuda a nadie en el taller.
      const err = new Error(r.status === 400
        ? 'Ese correo o esa contraseña no valen'
        : (j.msg || j.error_description || 'No se ha podido entrar'));
      err.status = r.status;
      // Volviendo de vacaciones, el primer sitio donde se topa uno con el
      // proyecto pausado es aquí, en la pantalla de entrar.
      if([500, 502, 503, 504, 520, 521, 522, 540].includes(r.status)) err.dormido = true;
      throw err;
    }
    guardarSesion(j);
    rol = await leerRol();
    if(!rol){
      salir();
      throw new Error('Esa cuenta no tiene acceso al recetario. Pídeselo a Juanjo.');
    }
    return {email: ses.email, rol};
  }

  function salir(){
    ses = null; rol = null;
    try{ localStorage.removeItem(CLAVE_SESION_NUBE); }catch(_){}
  }

  /** El papel sale del servidor, no de nada que diga la app. */
  async function leerRol(espera){
    const filas = await pedir('/rest/v1/colores_perfiles?select=rol&limit=1', {espera});
    return filas?.[0]?.rol || null;
  }

  async function arrancar(){
    if(!ses) return null;
    if(Date.now() > (ses.caduca || 0) && !await renovar()){ salir(); return null; }
    try{ rol = await leerRol(ESPERA_ARRANQUE_MS); }
    catch(e){
      // Sin red se sigue con lo que había: es justo para lo que existe el
      // espejo local. Solo se cierra sesión si el servidor DICE que no.
      if(e.sinRed) return {email: ses.email, rol: leer(CLAVE_ESPEJO)?.rol || 'taller', local: true};
      salir(); return null;
    }
    if(!rol){ salir(); return null; }
    return {email: ses.email, rol};
  }

  // ── Bajar lo que ha cambiado ─────────────────────────────────────────
  const TANDA = 500;

  async function bajarTabla(tabla, desde){
    const filas = [];
    let corte = desde || '1970-01-01T00:00:00Z';
    for(let vuelta = 0; vuelta < 40; vuelta++){
      const q = `/rest/v1/${tabla}?select=*&tocada=gt.${encodeURIComponent(corte)}` +
                `&order=tocada.asc&limit=${TANDA}`;
      const tanda = await pedir(q);
      if(!tanda?.length) break;
      filas.push(...tanda);
      if(tanda.length < TANDA) break;
      // Se sigue por la última fecha vista. Si varias filas comparten
      // milisegundo esto podría repetir alguna, y da igual: se aplica por id.
      corte = tanda[tanda.length - 1].tocada;
    }
    return filas;
  }

  /* La última marca de tiempo que este aparato ha VISTO de cada fórmula.

     Es lo que permite darse cuenta de un choque: si escribiste una fórmula sin
     cobertura y mientras tanto la tocaron en otro sitio, al volver la señal tu
     versión se subiría encima de la otra y nadie se enteraría. Guardando qué
     versión tenías delante cuando la tocaste, se puede comparar antes de pisar
     nada. */
  const leerTocadas = () => leer(CLAVE_TOCADAS, {});
  function apuntarTocadas(filas){
    if(!filas?.length) return;
    const t = leerTocadas();
    for(const f of filas) if(f.id && f.tocada) t[f.id] = f.tocada;
    escribir(CLAVE_TOCADAS, t);
  }

  /** Todo lo que ha cambiado desde `desde`. `desde` nulo = todo. */
  async function bajar(desde){
    const [formulas, materias, ajustes, preparaciones] = await Promise.all([
      bajarTabla('colores_formulas', desde),
      bajarTabla('colores_materias', desde),
      bajarTabla('colores_ajustes', desde),
      bajarTabla('colores_preparaciones', desde),
    ]);
    apuntarTocadas(formulas);
    const fechas = [...formulas, ...materias, ...ajustes, ...preparaciones]
                     .map(f => f.tocada).filter(Boolean);
    return {
      formulas, materias, ajustes, preparaciones,
      // El corte para la próxima vez sale de los DATOS, no del reloj de este
      // aparato: si el móvil va atrasado, con el reloj local se perdería todo
      // lo escrito en ese hueco y nadie se enteraría.
      hasta: fechas.length ? fechas.sort().pop() : desde,
    };
  }

  // ── Subir ────────────────────────────────────────────────────────────
  const filaFormula = f => ({
    id: f.id, nombre: f.nombre, datos: f,
    actualizada: !!f.actualizada_pigmentos, borrada: !!f.borrada,
  });
  const filaMateria = m => ({id: m.id, nombre: m.nombre, datos: m});

  async function subir(tabla, filas){
    if(!filas.length) return;
    // merge-duplicates = si ya existe, se actualiza. Es lo que hace que se
    // pueda reintentar una y otra vez sin duplicar nada.
    for(let i = 0; i < filas.length; i += 200){
      await pedir(`/rest/v1/${tabla}`, {
        method: 'POST',
        headers: {'Prefer': 'resolution=merge-duplicates,return=minimal'},
        body: JSON.stringify(filas.slice(i, i + 200)),
      });
    }
  }

  const subirFormulas = fs => subir('colores_formulas', fs.map(filaFormula));
  const subirMaterias = ms => subir('colores_materias', ms.map(filaMateria));
  const subirAjustes  = as => subir('colores_ajustes', as);
  const subirPreps    = ps => subir('colores_preparaciones', ps);

  /* Apuntar un bote preparado. Es lo ÚNICO que el taller puede escribir, y
     por eso va por su propio camino: si algún día se toca algo de permisos,
     que se vea que esto es una cosa aparte y no una escritura más. */
  async function guardarPreparacion(p){
    try{ await subirPreps([p]); return true; }
    catch(e){
      if(e.sinRed){ encolar('prep', p); return false; }
      throw e;
    }
  }

  /** La primera vez: se suben las 860 enteras. */
  async function sembrar(DATOS, alAvanzar){
    const total = DATOS.formulas.length + DATOS.materias_primas.length;
    let hechas = 0;
    const paso = () => alAvanzar?.(Math.min(100, Math.round(hechas / total * 100)));
    for(let i = 0; i < DATOS.formulas.length; i += 200){
      await subirFormulas(DATOS.formulas.slice(i, i + 200));
      hechas += Math.min(200, DATOS.formulas.length - i); paso();
    }
    await subirMaterias(DATOS.materias_primas);
    hechas += DATOS.materias_primas.length; paso();
    await subirAjustes([
      {clave: 'modelo', datos: DATOS.modelo || {}},
      {clave: 'grupos_equivalencia', datos: DATOS.grupos_equivalencia || []},
    ]);
    return total;
  }

  // ── La cola de cuando no hay cobertura ───────────────────────────────
  // Lo que no se pudo mandar se guarda y se reintenta. Por ID, no por orden:
  // si tocas la misma fórmula cinco veces sin cobertura, se manda una vez, la
  // última, que es la que vale.
  function encolar(tipo, obj){
    const cola = leer(CLAVE_PENDIENTES, {});
    const k = tipo + ':' + (obj.id || obj.clave);
    cola[k] = {
      tipo, obj, cuando: Date.now(),
      // La marca que tenía la fila la última vez que este aparato la vio. Si
      // al ir a subirla el servidor tiene otra más nueva, es que alguien la
      // tocó por el camino: eso es un choque, no una subida.
      visto: (cola[k]?.visto !== undefined)
        ? cola[k].visto                        // el primer 'visto' es el bueno
        : (leerTocadas()[obj.id] || null),
    };
    escribir(CLAVE_PENDIENTES, cola);
    avisar('pendientes', Object.keys(cola).length);
  }
  const pendientes = () => Object.keys(leer(CLAVE_PENDIENTES, {})).length;

  /* ── Choques ───────────────────────────────────────────────────────────
     Tocas una fórmula en el móvil sin cobertura. Mientras tanto la tocas
     también en el PC. Cuando el móvil recupera señal, su versión sube encima
     y se lleva por delante la del PC sin decir una palabra.

     Ahora, antes de subir algo que estaba esperando, se mira si la fila del
     servidor ha cambiado desde que la tocaste. Si ha cambiado, NO se pisa: se
     aparta y se pregunta. Perder trabajo en silencio es lo único que esta app
     no se puede permitir. */
  const leerChoques = () => leer(CLAVE_CHOQUES, {});
  const choques = () => Object.values(leerChoques());

  async function tocadaEnServidor(id){
    const filas = await pedir(
      `/rest/v1/colores_formulas?id=eq.${encodeURIComponent(id)}&select=tocada,nombre`);
    return filas?.[0] || null;
  }

  /** 'mia' sube la de este aparato; 'servidor' tira la de aquí. */
  async function resolverChoque(id, quien){
    const ch = leerChoques();
    const c = ch[id];
    if(!c) return false;
    if(quien === 'mia'){
      await subirFormulas([c.obj]);
      apuntarTocadas([await tocadaEnServidor(id)].filter(Boolean));
    }
    delete ch[id];
    escribir(CLAVE_CHOQUES, ch);
    avisar('choques', Object.keys(ch).length);
    return true;
  }

  async function vaciarCola(){
    const cola = leer(CLAVE_PENDIENTES, {});
    const claves = Object.keys(cola);
    if(!claves.length) return 0;
    let idas = 0;
    for(const k of claves){
      const {tipo, obj, visto} = cola[k];
      try{
        if(tipo === 'formula'){
          // ¿Ha cambiado en el servidor desde que la tocaste aquí?
          if(visto){
            const suya = await tocadaEnServidor(obj.id);
            if(suya && suya.tocada && suya.tocada > visto){
              const ch = leerChoques();
              ch[obj.id] = {id: obj.id, nombre: obj.nombre || suya.nombre,
                            obj, mia: cola[k].cuando, suya: suya.tocada};
              escribir(CLAVE_CHOQUES, ch);
              delete cola[k];
              avisar('choques', Object.keys(ch).length);
              continue;
            }
          }
          await subirFormulas([obj]);
          apuntarTocadas([await tocadaEnServidor(obj.id)].filter(Boolean));
        }
        else if(tipo === 'materia') await subirMaterias([obj]);
        else if(tipo === 'prep') await subirPreps([obj]);
        else await subirAjustes([obj]);
        delete cola[k]; idas++;
      }catch(e){
        // Sin red se para y se reintenta luego, con todo lo que quede.
        // Si el servidor RECHAZA (permisos, datos malos), insistir no arregla
        // nada: se tira para no dejar la cola atascada para siempre.
        if(e.sinRed){ break; }
        delete cola[k];
        avisar('rechazado', {tipo, id: obj.id || obj.clave, por: e.message});
      }
    }
    escribir(CLAVE_PENDIENTES, cola);
    avisar('pendientes', Object.keys(cola).length);
    return idas;
  }

  /** Guardar una fórmula: se intenta ya, y si no hay red se encola. */
  async function guardarFormula(f){
    try{
      const filas = await pedir('/rest/v1/colores_formulas', {
        method: 'POST',
        headers: {'Prefer': 'resolution=merge-duplicates,return=representation'},
        body: JSON.stringify([filaFormula(f)]),
      });
      apuntarTocadas(filas || []);
      return true;
    }catch(e){
      if(e.sinRed){ encolar('formula', f); return false; }
      throw e;
    }
  }
  async function guardarMateria(m){
    try{ await subirMaterias([m]); return true; }
    catch(e){
      if(e.sinRed){ encolar('materia', m); return false; }
      throw e;
    }
  }

  // ── El espejo: la última foto de la nube, en este aparato ────────────
  // Es lo que hace que la app abra INSTANTÁNEAMENTE y sin cobertura. Sin él,
  // cada arranque serían 500 KB de descarga y una pantalla de espera en la
  // nave, que es justo donde peor va el wifi.
  function leerEspejo(){
    const e = leer(CLAVE_ESPEJO);
    return (e && e.datos && Array.isArray(e.datos.formulas)) ? e : null;
  }
  function guardarEspejo(datos, hasta, papel){
    // Si no cabe (cuota llena, ventana privada), NO es el fin del mundo: la
    // app sigue funcionando con lo que tiene en memoria y la nube sigue
    // siendo la verdad. Lo que se pierde es abrir rápido y sin cobertura.
    return escribir(CLAVE_ESPEJO, {datos, hasta, rol: papel || rol, cuando: Date.now()});
  }
  function borrarEspejo(){ try{ localStorage.removeItem(CLAVE_ESPEJO); }catch(_){} }

  /** Rehace los datos completos a partir de las filas de la nube. */
  function montarDatos(res, previos){
    const d = previos || {formulas: [], materias_primas: [], grupos_equivalencia: [], modelo: {}};
    const porId = new Map(d.formulas.map(f => [f.id, f]));
    for(const fila of res.formulas){
      if(fila.borrada){ porId.delete(fila.id); continue; }
      porId.set(fila.id, fila.datos);
    }
    d.formulas = [...porId.values()];
    const porIdM = new Map(d.materias_primas.map(m => [m.id, m]));
    for(const fila of res.materias) porIdM.set(fila.id, fila.datos);
    d.materias_primas = [...porIdM.values()];
    for(const a of res.ajustes){
      if(a.clave === 'modelo') d.modelo = a.datos;
      else if(a.clave === 'grupos_equivalencia') d.grupos_equivalencia = a.datos;
    }
    d.historial = res.preparaciones || [];
    if(!Array.isArray(d.grupos_equivalencia)) d.grupos_equivalencia = [];
    return d;
  }

  return {
    get sesion(){ return ses ? {email: ses.email, rol} : null; },
    get rol(){ return rol; },
    entrar, salir, arrancar,
    bajar, sembrar, guardarFormula, guardarMateria, subirAjustes, guardarPreparacion,
    pendientes, vaciarCola,
    leerEspejo, guardarEspejo, borrarEspejo, montarDatos,
    choques, resolverChoque,
    escuchar(f){ oyentes.add(f); return ()=>oyentes.delete(f); },
  };
}

const CLAVE = 'seriadornos-colores-v1';
const CLAVE_SESION = 'seriadornos-sesion-v1';

const esc0 = t => String(t).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const deB64 = t => Uint8Array.from(atob(t), c=>c.charCodeAt(0));
const aB64  = b => btoa(String.fromCharCode(...new Uint8Array(b)));

async function derivar(passwd, sal, vueltas){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(passwd),
                                             'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt: sal, iterations: vueltas, hash:'SHA-256'},
                                 base, {name:'AES-GCM', length:256}, false, ['decrypt']);
}

/** Los datos ya descomprimidos, a partir de la clave de datos. */
async function descifrar(sobre, K){
  const clave = await crypto.subtle.importKey('raw', K, {name:'AES-GCM'}, false, ['decrypt']);
  const plano = await crypto.subtle.decrypt({name:'AES-GCM', iv: deB64(sobre.iv)},
                                            clave, deB64(sobre.datos));
  // Se comprime antes de cifrar (471 KB -> 29 KB); después no habría nada que
  // comprimir, porque lo cifrado es indistinguible del ruido.
  const flujo = new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new Response(flujo).text();
}

/** Prueba la contraseña contra los dos roles. Devuelve {rol, K} o null. */
async function abrirCon(sobre, passwd){
  for(const [rol, r] of Object.entries(sobre.roles)){
    try{
      const kr = await derivar(passwd, deB64(r.sal), sobre.vueltas);
      const K = await crypto.subtle.decrypt({name:'AES-GCM', iv: deB64(r.iv)}, kr, deB64(r.k));
      return {rol, K: new Uint8Array(K)};
    }catch(_){ /* esa no era: se prueba la siguiente */ }
  }
  return null;
}

/** Devuelve el texto de los datos, pidiendo la contraseña si hace falta. */
async function abrirDatos(){
  const crudo = document.getElementById('datos-json').textContent;
  let sobre;
  try{ sobre = JSON.parse(crudo); }
  catch(_){ throw new Error('los datos no se pueden leer'); }
  if(!sobre.cifrado) return {texto: crudo, rol: 'editor', K: null};  // construido en claro

  // ¿Ya se abrió en este dispositivo?
  try{
    const g = JSON.parse(localStorage.getItem(CLAVE_SESION) || 'null');
    if(g && g.k){ const K = deB64(g.k);
      return {texto: await descifrar(sobre, K), rol: g.rol, K}; }
  }catch(_){ try{ localStorage.removeItem(CLAVE_SESION); }catch(_){} }

  const r = await pantallaClave(sobre);
  return {texto: await descifrar(sobre, r.K), rol: r.rol, K: r.K};
}

     · MODO ARCHIVO. Las 860 fórmulas van cifradas dentro del HTML y se abren

/** Arranque en modo nube. Devuelve lo mismo que abrirDatos(). */
async function abrirNube(){
  let s = await nube.arrancar();
  while(!s) s = await pantallaEntrar();

  let espejo = nube.leerEspejo();

  // Sin espejo hay que bajarlo todo, y para eso hace falta cobertura. Es la
  // única vez que se necesita: instalar la app en un aparato nuevo.
  if(!espejo){
    const p = pantallaDescarga();
    try{
      p.paso('Trayendo el recetario…', 15);
      const res = await nube.bajar(null);
      p.paso('Montando las fórmulas…', 80);
      const datos = nube.montarDatos(res, null);
      if(!datos.formulas.length){
        // La nube está vacía: o es el primer día, o alguien entró antes de
        // sembrarla. Se dice tal cual en vez de enseñar una app en blanco.
        p.quitar();
        return {texto: JSON.stringify(datos), rol: s.rol, K: null,
                hasta: res.hasta, email: s.email, vacia: true};
      }
      nube.guardarEspejo(datos, res.hasta, s.rol);
      espejo = {datos, hasta: res.hasta};
      p.quitar();
    }catch(e){
      p.quitar();
      if(e.sinRed) throw new Error('SIN_RED_PRIMERA_VEZ');
      throw e;
    }
  }
  return {texto: JSON.stringify(espejo.datos), rol: s.rol, K: null,
          hasta: espejo.hasta, email: s.email};
}

function guardar(){

/* ── Mandar a la nube ──────────────────────────────────────────────────
   Se llama DESPUÉS de haber tocado la fórmula, con el objeto ya entero: al
   servidor va la fórmula completa, no el parche. Así el móvil que la recibe
   no tiene que saber nada del historial de cambios de este aparato.

   Aquí no se comprueba ningún permiso a propósito. Si el que escribe es del
   taller, la base de datos devuelve la orden con un 403 y se enseña. Fiarse
   de una comprobación del navegador sería fiarse de quien la puede quitar. */
function empujar(f){
  if(MODO !== 'nube') return;
  marcarSync('subiendo');
  nube.guardarFormula(f)
    .then(ido => marcarSync(ido ? 'al-dia' : 'pendiente'))
    .catch(e => falloNube(e));
}
function empujarMateria(m){
  if(MODO !== 'nube') return;
  nube.guardarMateria(m).catch(e => falloNube(e));
}
function falloNube(e){
  if(e && e.sinRed) return marcarSync('pendiente');
  if(e && e.dormido){ marcarSync('error'); return avisarDormido(); }
  if(e && e.status === 403){
    marcarSync('error');
    return brindis('El servidor no deja escribir con esta cuenta');
  }
  marcarSync('error');
  brindis('No se ha podido guardar en la nube: ' + (e && e.message || 'error'));
}

let indicesListos = false;   // ver limpiarMateriasHuerfanas
function aplicarCambios(){
  for(const mp of (cambios.materias||[])){
    // Antes solo se añadían las nuevas. Ahora también hay retoques sobre las
    // de siempre (la fecha en que cambió el pigmento), y sin esto se perdían.
    const ya = DATOS.materias_primas.find(m=>m.id===mp.id);
    if(ya) Object.assign(ya, mp); else DATOS.materias_primas.push(mp);
  }
  limpiarMateriasHuerfanas();
  for(const nueva of cambios.nuevas){
    if(!DATOS.formulas.some(f=>f.id===nueva.id)) DATOS.formulas.push(nueva);
  }
  for(const [id,parche] of Object.entries(cambios.formulas)){
    const f = DATOS.formulas.find(x=>x.id===id);
    if(f) Object.assign(f, parche);
  }
  if(cambios.borradas.length){
    const fuera = new Set(cambios.borradas);
    DATOS.formulas = DATOS.formulas.filter(f=>!fuera.has(f.id));
  }
  DATOS.formulas.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));
}
// Si se da de alta una materia prima por error y luego se rectifica, se queda
// ahí para siempre ensuciando el catálogo. Se borran las que no usa nadie,
// pero SOLO las creadas desde la app: las del fichero base no se tocan.
function limpiarMateriasHuerfanas(){
  // Era el único sitio que escribía saltándose guardar() y sin mirar el
  // permiso. Aquí no se notaba porque hoy no llega a escribir, pero una regla
  // que tiene una excepción escondida deja de ser una regla.
  if(!puedeEditar) return;
  // OJO: solo las CREADAS desde la app. Desde que se pueden retocar las de
  // siempre, mirar toda la lista habría borrado del catálogo una materia base
  // que nadie usa ahora mismo, con su fecha de cambio dentro.
  const creadas = new Set((cambios.materias||[])
    .map(m=>m.id).filter(id=>String(id).startsWith('mp-nueva-')));
  if(!creadas.size) return;
  const enUso = new Set();
  for(const f of DATOS.formulas)
    for(const i of f.ingredientes)
      if(i.tipo==='materia') enUso.add(i.ref);
  const sobran = [...creadas].filter(id=>!enUso.has(id));
  if(!sobran.length) return;
  DATOS.materias_primas = DATOS.materias_primas.filter(m=>!sobran.includes(m.id));
  // El Map `materias` se construye MÁS ABAJO en el módulo. En el arranque esta
  // función corre antes de que exista, y tocarlo daría ReferenceError; a partir
  // del arranque sí hay que limpiarlo, o quedan materias fantasma.
  if(indicesListos) for(const id of sobran) materias.delete(id);
  cambios.materias = (cambios.materias||[]).filter(m=>!sobran.includes(m.id));
  guardar();
}

/* Las materias primas solo se podían CREAR, no editar. Ahora hay que poder
   apuntarles la fecha en que se cambió el pigmento, así que pasan por aquí,

function anotarMateria(m, parche){
  if(!puedeEditar){ brindis(SIN_PERMISO); return false; }
  Object.assign(m, parche);

  cambios.materias.push(JSON.parse(JSON.stringify(m)));
  cacheColor.clear();
  const ok = guardar();
  empujarMateria(m);
  return ok;
}

function anotar(f, parche){

  cacheColor.delete(f.id);

/* ═══════════════════════════════════════════════════════════════════
   ÍNDICES DERIVADOS
   ═══════════════════════════════════════════════════════════════════ */
const porId = new Map(DATOS.formulas.map(f=>[f.id,f]));
const materias = new Map(DATOS.materias_primas.map(m=>[m.id,m]));
const grupos = new Map(DATOS.grupos_equivalencia.map(g=>[g.id,g]));
indicesListos = true;

/* ═══════════════════════════════════════════════════════════════════
   ¿ESTÁ AL DÍA CON LOS PIGMENTOS?

   Antes esto era un interruptor por fórmula y ya está: 860 gestos de uno en
   uno, escondidos al final de la ficha. Resultado, 0 marcadas.

   El planteamiento estaba mal, y no por vaguería suya. En la nave nadie
   piensa «voy a revisar la fórmula 412»; se piensa «he cambiado ESE pigmento».
   Así que lo que se marca ahora es EL PIGMENTO, y las fórmulas que lo llevan
   —también a través de otras fórmulas— pasan solas a «por revisar».

   Una fórmula está al día si la marcaste como buena DESPUÉS del último cambio
   de cualquiera de sus pigmentos. Si mañana cambias el BLANCO, todas las que
   lo lleven vuelven a la cola sin que tengas que acordarte de nada.
   ═══════════════════════════════════════════════════════════════════ */
let materiasDe = new Map();     // fórmula -> Set de materias primas, ya resueltas

function calcularMateriasDe(){
  materiasDe = new Map();
  const enCurso = new Set();
  const de = id=>{
    if(materiasDe.has(id)) return materiasDe.get(id);
    if(enCurso.has(id)) return new Set();      // cortafuegos de ciclos
    enCurso.add(id);
    const f = porId.get(id);
    const out = new Set();
    if(f) for(const i of f.ingredientes){
      if(i.tipo === 'materia') out.add(i.ref);
      else if(i.tipo === 'formula') for(const m of de(i.ref)) out.add(m);
    }
    enCurso.delete(id);
    materiasDe.set(id, out);
    return out;
  };
  for(const f of DATOS.formulas) de(f.id);
}

/** {aldia, motivo:'nunca'|'pigmento'|null, cambiados:[materias]} */
function estadoAct(f){
  const cambiados = [];
  for(const id of (materiasDe.get(f.id) || [])){
    const m = materias.get(id);
    if(m && m.cambiado_el &&
       (!f.fecha_actualizacion || m.cambiado_el > f.fecha_actualizacion))
      cambiados.push(m);
  }
  if(!f.actualizada_pigmentos) return {aldia: false, motivo: 'nunca', cambiados};
  if(cambiados.length) return {aldia: false, motivo: 'pigmento', cambiados};
  return {aldia: true, motivo: null, cambiados: []};
}
const porRevisar = f => !estadoAct(f).aldia;

calcularMateriasDe();

// Quién usa a quién: para poder avisar de "esta fórmula la llevan otras 12".
const usadaPor = new Map();
for(const f of DATOS.formulas){
  for(const i of f.ingredientes){
    if(i.tipo==='formula'){
      if(!usadaPor.has(i.ref)) usadaPor.set(i.ref, new Set());
      usadaPor.get(i.ref).add(f.id);
    }
  }
}

function color(f){
  if(!cacheColor.has(f.id)) cacheColor.set(f.id, colorDeFormula(f.id, indice));
  return cacheColor.get(f.id);

/* Idea 13: el color que daría una versión guardada en el historial.
   Se calcula metiendo esa lista de ingredientes en una copia del índice, así
   que el motor resuelve las fórmulas anidadas exactamente igual que siempre.
   OJO a un detalle honesto: las OTRAS fórmulas se toman como están HOY, no

   formas: lo que quieres saber es qué color daría hoy aquella receta. */
function colorDeVersion(f, ingredientes){
  try{
    const mapa = new Map(indice.formulas);
    mapa.set(f.id, Object.assign({}, f, {ingredientes}));

/* ═══════════════════════════════════════════════════════════════════
   BÚSQUEDA
   Sin acentos, sin guiones, sin paréntesis: escribir "desprit" tiene que
   encontrar un nombre con apóstrofo, y "lezna" todos los de ese cliente lleven
   paréntesis o no. Varias palabras = tienen que aparecer todas.
   ═══════════════════════════════════════════════════════════════════ */
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'')
                   .toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();

const busq = DATOS.formulas.map(f=>({
  f,
  n: norm(f.nombre),
  ing: norm(f.ingredientes.map(i=>i.nombre).join(' ')),
}));

const tienePendiente = f => f.ingredientes.some(i=>i.tipo==='sin_resolver');
let soloPendientes = false;
/* Filtro por pigmento: "enséñame las que llevan ESE pigmento". Es el paso que
   le faltaba a la pantalla de pigmentos, que te decía el número y ahí te
   dejaba. Cuenta también las que lo llevan dentro de otra fórmula.
   (Sin ejemplos reales en los comentarios: este archivo se cuelga en internet
   y el comprobador de construir.py caza cualquier nombre de fórmula.) */
let filtroPigmento = null;

function filtrar(txt){
  const t = norm(txt);
  if(filtroPigmento) return DATOS.formulas.filter(f=>materiasDe.get(f.id)?.has(filtroPigmento));
  if(soloPendientes) return DATOS.formulas.filter(tienePendiente);
  if(!t) return DATOS.formulas.slice();
  const palabras = t.split(' ');
  const res = [];
  for(const e of busq){
    let bien = true, enNombre = true;
    for(const p of palabras){
      if(e.n.includes(p)) continue;
      enNombre = false;
      if(!e.ing.includes(p)){ bien=false; break; }
    }
    if(bien) res.push({e, enNombre, pos: e.n.indexOf(palabras[0])});
  }
  // Primero lo que empieza por lo buscado, luego el resto del nombre,
  // y al final las que solo coinciden por un ingrediente.
  res.sort((a,b)=>
    (b.enNombre-a.enNombre) ||
    ((a.pos===0?0:1)-(b.pos===0?0:1)) ||
    a.e.f.nombre.localeCompare(b.e.f.nombre,'es'));
  return res.map(r=>r.e.f);
}

function resaltar(nombre, txt){
  const t = norm(txt);
  if(!t) return esc(nombre);
  // Se marca sobre el nombre original mapeando posiciones del normalizado.
  const mapa = [];
  const plano = [];
  const nf = nombre.normalize('NFD');
  let salto = 0;
  for(let i=0;i<nf.length;i++){
    const c = nf[i];
    if(/[\u0300-\u036f]/.test(c)){ salto++; continue; }
    const u = c.toUpperCase();
    if(/[A-Z0-9]/.test(u)){ plano.push(u); mapa.push(i-salto); }
    else if(plano.length && plano[plano.length-1]!==' '){ plano.push(' '); mapa.push(i-salto); }
  }
  const cad = plano.join('');
  const marcas = new Set();
  for(const p of t.split(' ')){
    let k = cad.indexOf(p);
    while(k>=0){ for(let j=k;j<k+p.length;j++) marcas.add(mapa[j]); k = cad.indexOf(p,k+1); }
  }
  let out='', dentro=false;
  const base = nombre.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  for(let i=0;i<base.length;i++){
    const m = marcas.has(i);
    if(m && !dentro){ out+='<mark>'; dentro=true; }
    if(!m && dentro){ out+='</mark>'; dentro=false; }
    out += esc(base[i]);
  }
  if(dentro) out+='</mark>';
  return out;
}
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ═══════════════════════════════════════════════════════════════════
   LISTA
   860 filas de golpe van sobradas, pero al escribir en el buscador se
   redibuja en cada tecla: se pinta por tandas para que no se note.
   ═══════════════════════════════════════════════════════════════════ */
const $lista = document.getElementById('lista');
const $q = document.getElementById('q');
let pintadas = 0, TANDA = 80, letraActual = null;

/* La inicial por la que se agrupa. Si el nombre empieza por número (hay
   fórmulas como "021 NARANJA") van todas juntas bajo el mismo rótulo. */
function inicial(nombre){
  const c = nombre.normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()[0] || '';
  const u = c.toUpperCase();
  return /[0-9]/.test(u) ? '0-9' : (/[A-Z]/.test(u) ? u : '·');
}

function pintarLista(reinicia=true){
  if(reinicia){ $lista.innerHTML=''; pintadas=0; letraActual=null; $lista.scrollTop=0; }
  const hasta = Math.min(pintadas+TANDA, filtradas.length);
  const frag = document.createDocumentFragment();
  const txt = $q.value;
  // Los separadores solo tienen sentido en el orden alfabético. Al buscar, la
  // lista sale por relevancia y una "A" pegada arriba sería mentira.
  const agrupar = !txt.trim() && !soloPendientes;
  for(let i=pintadas;i<hasta;i++){
    const f = filtradas[i];
    const c = color(f);
    if(agrupar){
      const l = inicial(f.nombre);
      if(l !== letraActual){
        letraActual = l;
        const sep = document.createElement('div');
        sep.className = 'letra'; sep.textContent = l; sep.setAttribute('aria-hidden','true');
        frag.appendChild(sep);
      }
    }
    const b = document.createElement('button');
    b.className='fila'; b.dataset.id=f.id; b.type='button'; b.role='option';
    b.setAttribute('aria-current', String(f.id===seleccion));
    // 'abierto' NO es un pendiente: es una decisión del taller (la receta dice
    // cuánta purpurina lleva y cuál se elige al preparar).
    const pend = c.avisos.some(a=>a.tipo==='pendiente'||a.tipo==='incompleta');
    b.innerHTML =
      `<div class="muestra${c.metalizado?' metal':''}" style="background:${c.hex}"></div>`+
      `<div class="fila-txt"><div class="fila-nombre">${resaltar(f.nombre,txt)}</div></div>`+
      (estadoAct(f).aldia?`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--verde)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>`:'')+
      (pend?`<span class="pin" title="Tiene algo pendiente de revisar"></span>`:'');
    frag.appendChild(b);
  }
  $lista.appendChild(frag);
  pintadas = hasta;
  if(pintadas < filtradas.length) observarFinal();
}
let centinela;
function observarFinal(){
  centinela?.remove();
  centinela = document.createElement('div');
  centinela.style.height='1px';
  $lista.appendChild(centinela);
  obs.observe(centinela);
}
const obs = new IntersectionObserver(es=>{
  if(es.some(e=>e.isIntersecting)){ obs.disconnect(); centinela?.remove(); pintarLista(false); }
},{root:$lista, rootMargin:'400px'});

function actualizar(){
  filtradas = filtrar($q.value);
  document.getElementById('contador').innerHTML =
    `<b>${filtradas.length}</b> de ${DATOS.formulas.length} fórmulas`;
  const nPend = DATOS.formulas.filter(tienePendiente).length;

  const cp = document.getElementById('chip-pigmento');

/* Aquí vivía un chip permanente que ponía "Repasar 860 por revisar". Lo pidió
   quitar Juanjo, y con razón: las 860 no son una lista de tareas, son el
   estado de partida. Un aviso que sale todos los días diciendo lo mismo deja
   de leerse a los dos días y solo estorba.

   El repaso no se pierde: está en Opciones → Pigmentos, que es donde se va a

  document.getElementById('limpiar').classList.toggle('on', !!$q.value);

}

document.getElementById('chip-pigmento').onclick = ()=>{ filtroPigmento=null; actualizar(); };

/* ═══════════════════════════════════════════════════════════════════
   FICHA
   ═══════════════════════════════════════════════════════════════════ */
const $ficha = document.getElementById('ficha');
const fmt = n => {
  const r = Math.round(n*100)/100;
  return r.toLocaleString('es-ES',{maximumFractionDigits:2});
};

/* La muestra que has tocado se convierte en la grande de la ficha. El truco
   es que en cada foto (la de antes y la de después) haya UN solo elemento con
   el nombre de transición: si hay dos, el navegador lo descarta entero. */
const VT = 'muestra-activa';
function conContinuidad(origen, cambiar){
  const puedo = !!document.startViewTransition &&
                !matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(!puedo || !origen) return cambiar();
  for(const el of $ficha.querySelectorAll('.hero-muestra')) el.style.viewTransitionName='';
  origen.style.viewTransitionName = VT;
  try{
    document.startViewTransition(()=>{
      origen.style.viewTransitionName = '';
      cambiar();
      const h = $ficha.querySelector('.hero-muestra');
      if(h) h.style.viewTransitionName = VT;
    });
  }catch(_){ origen.style.viewTransitionName=''; cambiar(); }
}

/* ═══════════════════════════════════════════════════════════════════
   EL BOTÓN "ATRÁS" DEL MÓVIL

   Juanjo: «entro en una pintura y le doy atrás, y se me cierra la app en vez
   de volver al listado».

   Y es exactamente lo que tenía que pasar. Esta app es UNA sola página: abrir
   una fórmula no es ir a otro sitio, es cambiar lo que se pinta. Como no se
   tocaba el historial del navegador, para Android "atrás" solo podía
   significar una cosa: salir. En una app instalada eso es cerrarla.

   Se arregla apuntando cada capa que se abre —la ficha, un diálogo— como una
   parada del historial. Así "atrás" cierra la de arriba y solo sale de la app
   cuando ya no queda ninguna.

   El cierre lo manda SIEMPRE el historial, nunca al revés: si se cierra desde
   un botón, lo único que se hace es un history.back(), y el propio popstate se
   encarga de cerrar. Haciéndolo por los dos lados se descuadraba la pila y el
   "atrás" siguiente no hacía nada. */
const capas = [];
let volviendoAtras = false;
let historialVa = true;   // en file:// algunos navegadores no dejan pushState

function abrirCapa(tipo){
  // includes, no "la de arriba": de cada tipo solo puede haber UNA (una ficha,
  // un diálogo). Mirando solo la cima se colaba una capa de más en un sitio
  // real: al guardar, el editor cierra el diálogo y acto seguido vuelve a
  // abrir la ficha; como la vuelta atrás del diálogo aún no había llegado,
  // 'ficha' no era la cima y se apilaba otra. Resultado: guardar te cerraba
  // la ficha. Comprobado.
  if(!historialVa || capas.includes(tipo)) return;
  capas.push(tipo);
  try{ history.pushState({capas: capas.length}, ''); }
  catch(_){ historialVa = false; capas.pop(); }
}

function cerrarDeVerdad(tipo){
  if(tipo === 'dlg') $dlg.close();
  else if(tipo === 'ficha') cerrarFicha();
}

/** La capa se ha cerrado desde dentro (un botón, la ✕, Escape). */
function cerrarCapa(tipo){
  // Si venimos del propio historial, ya está contado: tocarlo otra vez
  // retrocedería de más y se saldría de la app.
  if(volviendoAtras || !historialVa) return;
  const i = capas.lastIndexOf(tipo);
  if(i < 0) return;
  // Se retrocede hasta ella. Si tenía capas encima (cerrar la ficha con un
  // diálogo abierto), se van también, que es lo que se espera.
  history.go(-(capas.length - i));
}

/** Volver a la lista de golpe, cerrando lo que haya abierto. */
function cerrarTodo(){
  if(historialVa && capas.length) return history.go(-capas.length);
  $dlg.close(); cerrarFicha();
}

addEventListener('popstate', e=>{
  // Cuántas capas deberían quedar según el historial. Con history.go(-3) el
  // navegador dispara UN solo popstate, así que hay que cerrar todas las que
  // sobren de una vez y no solo la de arriba.
  const quedan = (e.state && e.state.capas) || 0;
  if(capas.length <= quedan) return;
  volviendoAtras = true;
  try{ while(capas.length > quedan) cerrarDeVerdad(capas.pop()); }
  finally{ volviendoAtras = false; }
});

function abrir(id, origen){
  abrirCapa('ficha');
  const cambiar = ()=>{
    seleccion = id;
    const f0 = porId.get(id);
    objetivo = f0 ? Math.round(f0.ingredientes.reduce((s,i)=>s+i.cantidad,0)) : 0;
    objetivoTocado = false;
    ultimosGramos = null;      // al cambiar de color no hay nada que destellar
    recalcularLote();
    document.body.dataset.ficha='on';
    for(const el of $lista.querySelectorAll('.fila'))
      el.setAttribute('aria-current', String(el.dataset.id===id));
    pintarFicha();
    document.getElementById('columna-ficha').scrollTop = 0;
  };
  conContinuidad(origen, cambiar);
}
function cerrarFicha(){
  if(document.body.dataset.ficha !== 'on') return;
  cerrarCapa('ficha');
  document.body.dataset.ficha='';
  seleccion = null;
  for(const el of $lista.querySelectorAll('.fila')) el.setAttribute('aria-current','false');
  pintarFicha();
}

const MURO_TOPE = 240;
function muroDeColores(){
  $ficha.classList.remove('es-muro');
  if(!filtradas.length){
    $ficha.innerHTML = `<div class="vacio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5" stroke-linecap="round"/></svg>
      <p><b>Nada con ese nombre</b>Prueba con menos letras, o con el cliente entre paréntesis. Por ejemplo <em>lezna</em>, <em>fluor</em> o <em>plata</em>.</p></div>`;
    return;
  }
  const v = filtradas.slice(0, MURO_TOPE);
  $ficha.classList.add('es-muro');
  $ficha.innerHTML = `<div class="muro">
    <div class="muro-cab">
      <h2>${$q.value.trim() ? 'Resultados' : 'Todos los colores'}</h2>
      <span>${filtradas.length === 1 ? '1 fórmula' : filtradas.length + ' fórmulas'} · toca una para ver su receta</span>
    </div>
    <div class="muro-rejilla">
      ${v.map((x,k)=>{ const c = color(x);
        return `<button class="muro-t" data-ir="${x.id}" title="${esc(x.nombre)}"
                        style="--t:${Math.min(k*9, 260)}ms">
          <i class="${c.metalizado?'metal':''}" style="background:${c.hex}"></i>
          <span>${esc(x.nombre)}</span></button>`; }).join('')}
    </div>
    ${filtradas.length > MURO_TOPE
      ? `<p class="muro-mas">Se ven los ${MURO_TOPE} primeros. Escribe en el buscador para acotar.</p>` : ''}
  </div>`;
  for(const b of $ficha.querySelectorAll('[data-ir]'))
    b.onclick = ()=>abrir(b.dataset.ir, b.querySelector('i'));
}

/* El cliente va escrito entre paréntesis dentro del propio nombre: es como
   Juanjo las tiene puestas desde siempre y no hay que tocar ni un dato. */
function clienteDe(nombre){
  const m = String(nombre).match(/\(([^)]*)\)/);
  const t = m ? m[1].trim() : '';
  return t || null;
}
const fechaCorta = s => s
  ? new Date(s).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'2-digit'})
  : '';
function haceCuanto(iso){
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  if(d <= 0) return 'hoy';
  if(d === 1) return 'ayer';
  if(d < 30)  return 'hace ' + d + ' días';
  const m = Math.round(d/30.4);
  if(m < 18) return 'hace ' + m + (m===1?' mes':' meses');
  return 'hace ' + Math.round(d/365) + ' años';
}

/* Idea 4: el hueco de al lado del nombre estaba en blanco. Aquí van las cuatro
   cosas que uno se pregunta con el bote delante. Las dos últimas solo salen si
   tienen algo que decir: una tira de guiones no es información. */
/* El sello de estado, que ADEMÁS es el botón para cambiarlo.

   Antes eran dos cosas separadas y en extremos opuestos de la ficha: aquí
   arriba un sello que solo informaba, y abajo del todo, después de la receta y
   dentro de "Estado y notas", el interruptor que lo cambiaba. La acción que
   hay que hacer 860 veces estaba escondida detrás de un scroll. */
function selloActualizacion(f){
  const e = estadoAct(f);
  const cls = e.aldia ? 'etiqueta ok' : e.motivo === 'pigmento' ? 'etiqueta avisa' : 'etiqueta';
  const icono = e.aldia
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>'
    : e.motivo === 'pigmento'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.2v.1"/></svg>'
      : '';
  const txt = e.aldia
    ? 'Pigmentos nuevos'
    : e.motivo === 'pigmento'
      ? `Por revisar: cambió ${e.cambiados.slice(0,2).map(m=>esc(m.nombre)).join(' y ')}${
          e.cambiados.length > 2 ? ` y ${e.cambiados.length - 2} más` : ''}`
      : 'Sin actualizar';
  // Al taller se le enseña, pero no se le deja tocar: el sello es un sello.
  if(!puedeEditar) return `<span class="${cls}">${icono}${txt}</span>` +
    (e.aldia && f.fecha_actualizacion ? `<span class="etiqueta">${fecha(f.fecha_actualizacion)}</span>` : '');
  return `<button class="${cls} sello-btn" id="sello-act"
      title="${e.aldia ? 'Pulsa para quitar la marca' : 'Pulsa para marcarla como hecha con los pigmentos nuevos'}"
      aria-pressed="${e.aldia}">${icono}${txt}</button>` +
    (e.aldia && f.fecha_actualizacion ? `<span class="etiqueta">${fecha(f.fecha_actualizacion)}</span>` : '');
}

function datosHero(f, total, usan){
  const cli   = clienteDe(f.nombre);
  // Del cuaderno, no del campo viejo de dentro de la fórmula: ahora también
  // cuentan los botes que ha hecho el taller, que antes no se apuntaban.
  const hechas = prepsDe(f.id);
  const ultima = hechas.length ? hechas[hechas.length-1].cuando : f.ultima_preparacion;
  const veces = hechas.length || (f.preparaciones||[]).length;
  const d = [];
  // Pulsando el cliente se ven todos sus colores. Era texto muerto, y la
  // pregunta "¿qué le hacemos a este cliente?" es de las que más se hacen.
  d.push(['Cliente', cli
    ? `<button class="enlace-cliente" data-cliente="${esc(cli)}">${esc(cli)}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>`
    : '<span class="flojo">Sin cliente</span>']);
  d.push(['Receta base', `<span class="num">${fmt(total)} g</span>`]);
  if(ultima)
    d.push(['Última vez', `${haceCuanto(ultima)}<small>${fechaCorta(ultima)}${
      veces>1 ? ' · '+veces+' veces' : ''}</small>`]);
  if(usan.length)
    d.push(['La llevan dentro', `${usan.length} fórmula${usan.length===1?'':'s'}`]);
  return `<dl class="hero-datos">${d.map(([k,v])=>
    `<div class="hero-dato"><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
}

/* Idea 13: cada cambio, con el color de antes y el de después al lado.
   El historial guarda el estado ANTERIOR a cada cambio, así que el "después"
   de una entrada es el "antes" de la siguiente, y el de la última es el color
   que tiene ahora mismo. */
function historialVisual(f){
  const H = f.historial;
  const hexDe = ing => (colorDeVersion(f, ing) || {}).hex || null;
  const cuadro = hex => `<i style="background:${hex
    || 'repeating-linear-gradient(45deg,var(--linea),var(--linea) 4px,var(--panel-2) 4px,var(--panel-2) 8px)'}"></i>`;
  const flecha = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>`;

  return H.map((h,k)=>({h, k}))
    .reverse()
    .map(({h,k})=>{
      const antes   = hexDe(h.ingredientes);
      const despues = k+1 < H.length ? hexDe(H[k+1].ingredientes) : color(f).hex;
      const igual   = antes && despues && antes.toLowerCase() === despues.toLowerCase();
      const renombre = h.nombre && h.nombre !== f.nombre;
      return `<li>
        <div class="hist-par" role="img" aria-label="${igual?'El color no cambió':'Color antes y después'}">
          ${cuadro(antes)}${igual ? '' : flecha + cuadro(despues)}
        </div>
        <div class="hist-txt">
          <b>${esc(h.texto || 'Cambio de fórmula')}</b>
          <time>${fecha(h.fecha)}${igual ? ' · el color no cambió' : ''}</time>
          ${renombre ? `<em>se llamaba ${esc(h.nombre)}</em>` : ''}
        </div>
        <button class="btn" data-restaurar="${k}">Restaurar</button>
      </li>`;
    }).join('');
}

/* Idea 5: la fórmula a escala y en sus colores. */
function barraProporcion(f, total){
  if(!(total > 0) || f.ingredientes.length < 2) return '';
  return `<div class="proporcion" role="img" aria-label="Proporciones de la fórmula">${
    f.ingredientes.map(i=>{
      const m = i.tipo==='materia' ? materias.get(i.ref) : null;
      const sub = i.tipo==='formula' ? porId.get(i.ref) : null;
      const hex = m?.hex_referencia || (sub ? color(sub).hex : null);
      const pct = i.cantidad/total*100;
      return `<i style="flex:${i.cantidad} 1 0;background:${hex
        || 'repeating-linear-gradient(45deg,var(--linea),var(--linea) 4px,var(--panel-2) 4px,var(--panel-2) 8px)'}"
        title="${esc(i.nombre)} — ${Math.round(pct)}%"></i>`;
    }).join('')}</div>`;
}

// Idea 9: para saber QUÉ número se ha movido hay que acordarse del anterior.
let ultimosGramos = null;

function pintarFicha(){

  $ficha.classList.remove('es-muro');

  const usan = [...(usadaPor.get(f.id)||[])].map(x=>porId.get(x)).filter(Boolean);
  const anidada = f.ingredientes.some(i=>i.tipo==='formula');
  const totalMovido = ultimosGramos && ultimosGramos.total !== undefined
                      && ultimosGramos.total !== (lote?lote.total:0);

  $ficha.innerHTML = `
    <button class="volver" id="volver">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>

    </button>
