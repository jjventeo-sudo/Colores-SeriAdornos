        <div class="hero-meta">
          ${selloActualizacion(f)}
          ${hermanas.length ? `<span class="etiqueta info">${grupo.tipo==='identica'?'Idéntica a':'Misma proporción que'} ${hermanas.length}</span>`:''}
        </div>
        ${datosHero(f, total, usan)}
      </div>
    </div>

    ${c.avisos.filter(a=>!(f.solo_referencia && (a.tipo==='sin-datos'||a.tipo==='vacia'))).map(a=>`<div class="aviso ${a.tipo==='pendiente'?'':'info'}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.2v.1"/></svg>
        <span>${esc(a.texto)}</span></div>`).join('')}

    ${f.solo_referencia ? `<div class="aviso info" style="margin-top:18px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.2v.1"/></svg>
        <span>Esta no tiene ingredientes apuntados a propósito: <b>la receta está escrita
        en el propio nombre</b>. Se guarda tal cual para no perderla.</span></div>` : ''}

    <div class="ficha-cuerpo"><div class="ficha-col">
    <div class="tarjeta tarjeta-fm">
      <div class="tarjeta-cab"><h3>Fórmula</h3>
        <button class="btn btn-fino" id="btn-etiqueta" title="Imprimir una etiqueta para pegar en el bote">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h6.6c.5 0 1 .2 1.4.6l6.9 6.9a2 2 0 0 1 0 2.8l-4.1 4.1a2 2 0 0 1-2.8 0l-6.9-6.9A2 2 0 0 1 6 11.1V7.5z"/><path d="M8.2 8.2v.01"/></svg>
          Etiqueta</button>
      </div>
      <div class="calc">
        <label for="calc-total">Quiero preparar</label>
        <!-- type="text" y no "number" a propósito: en un campo numérico el
             navegador NO deja seleccionar el contenido por programa, y sin eso
             no se puede hacer que al tocarlo se marque el número entero para
             escribir encima. Con inputmode="numeric" el móvil sigue sacando el
             teclado de cifras, que es lo que importa aquí. -->
        <input id="calc-total" class="num" type="text" inputmode="numeric"
               autocomplete="off" enterkeyhint="done" aria-label="Gramos que quieres preparar"
               value="${objetivo}">
        <span style="font-size:13px;color:var(--texto-2)">gramos</span>
        <div class="multi">${atajosCantidad(total).map(a=>
          `<button data-cant="${a.g}" data-atajo="${a.c}" title="${a.pista||''}"${a.g===objetivo?' aria-pressed="true"':''}>${a.txt}</button>`).join('')}
        </div>
      </div>
      <div id="zona-lote">${zonaLote(f, total, totalMovido)}</div>
    </div>

    <div id="zona-desarrollo">${anidada ? tarjetaDesarrollo(f) : ''}</div>
    </div><div class="ficha-col">
    ${hermanas.length ? `
      <div class="tarjeta"><div class="tarjeta-cab"><h3>${grupo.tipo==='identica'?'Fórmulas idénticas':'Misma proporción, otro tamaño de lote'}</h3></div>
      <div class="tarjeta-cuerpo">
        <div class="aviso info" style="margin:6px 0 12px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.2v.1"/></svg>
          <span>Si cambias esta a los pigmentos nuevos, ${hermanas.length===1?'la otra necesita':'las otras necesitan'} el mismo cambio.</span></div>
        <div class="enlaces">${hermanas.map(h=>botonEnlace(h)).join('')}</div>
      </div></div>` : ''}

    ${usan.length ? `
      <div class="tarjeta"><div class="tarjeta-cab"><h3>La llevan dentro ${usan.length} fórmula${usan.length===1?'':'s'}</h3></div>
      <div class="tarjeta-cuerpo">
        <div class="aviso" style="margin:6px 0 12px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.2v.1"/></svg>
          <span>Si tocas esta receta, <b>cambia el color de ${usan.length===1?'esta otra':'estas '+usan.length}</b>.</span></div>
        <div class="enlaces">${usan.map(h=>botonEnlace(h)).join('')}</div>
      </div></div>` : ''}

    <div class="tarjeta"><div class="tarjeta-cab"><h3>Estado y notas</h3></div>
      <div class="tarjeta-cuerpo">
        ${explicaActualizacion(f)}
        ${f.notas ? `<p style="margin:6px 0 0;font-size:14px;color:var(--texto-2);white-space:pre-wrap">${esc(f.notas)}</p>`:''}
        ${(f.historial&&f.historial.length) ? `<h3 style="font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--texto-3);font-weight:700;margin:20px 0 2px">Historial</h3>
          <ul class="historial">${historialVisual(f)}</ul>`:''}
      </div></div>
    </div>

    <div class="acciones-ficha">
      <button class="btn btn-marca" id="btn-preparar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.6v14.8M8.6 19.4h6.8M4.4 8h15.2"/><path d="M4.4 8 2.2 12.9a2.4 2.4 0 0 0 4.4 0L4.4 8Z"/><path d="M19.6 8l-2.2 4.9a2.4 2.4 0 0 0 4.4 0L19.6 8Z"/></svg>
        Preparar</button>
      <button class="btn" id="btn-editar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l10-10a2.8 2.8 0 0 0-4-4L4 16v4z"/></svg>
        Editar</button>
      <button class="btn" id="btn-duplicar">Duplicar</button>
      <button class="btn btn-peligro" id="btn-borrar">Eliminar</button>
    </div></div>`;

  // Foto de los gramos actuales, para poder comparar en el siguiente repintado.
  ultimosGramos = lote ? lote.cantidades.slice() : f.ingredientes.map(i=>i.cantidad);
  ultimosGramos.total = lote ? lote.total : 0;

  document.getElementById('volver')?.addEventListener('click', cerrarFicha);
  document.getElementById('sello-act')?.addEventListener('click', ()=>{
    const marcar = !estadoAct(f).aldia;
    if(anotar(f, {actualizada_pigmentos: marcar,
                  fecha_actualizacion: marcar ? new Date().toISOString() : null}))
      brindis(marcar ? 'Marcada con los pigmentos nuevos' : 'Marca quitada');
    pintarFicha(); actualizar();
  });
  $ficha.querySelector('[data-cliente]')?.addEventListener('click', e=>{
    const cli = e.currentTarget.dataset.cliente;
    $q.value = cli;
    soloPendientes = false;
    actualizar();
    if(innerWidth <= 860) cerrarTodo();
    brindis(`Colores de ${cli}`);
  });
  for(const b of $ficha.querySelectorAll('.multi [data-cant]'))
    b.onclick = ()=>ponerObjetivo(+b.dataset.cant,
                                  Math.abs(+b.dataset.cant - total) <= 0.5);
  enlazarZonaLote(f);

  /* ── El campo de los gramos ──────────────────────────────────────────
     Al tocarlo se marca el número entero, así que la primera cifra que
     escribes lo sustituye. Es lo que hace que se pueda poner una cantidad de
     un tirón, sin pelearse con el borrado.

     Y mientras se escribe NO se repinta el campo, solo el reparto de abajo.
     Es la diferencia entre poder escribir "900" y ver cómo el número se
     rehace solo a media palabra. */
  const $ct = document.getElementById('calc-total');
  let tCalc;
  const marcarTodo = ()=>{ try{ $ct.select(); }catch(_){} };
  // El ratón y el dedo colocan el cursor DESPUÉS de dar el foco, deshaciendo
  // la marca. Por eso no basta con marcar al enfocar: hay que aguantar hasta
  // que termine ese toque. Solo la primera vez — si ya está dentro y vuelve a
  // tocar, es que quiere poner el cursor en un sitio, y ahí no se estorba.
  let reciénEnfocado = false;
  // Para poder deshacer con Escape hace falta guardarse la cantidad de ANTES:
  // `objetivo` cambia con cada tecla, así que a media palabra ya no queda nada
  // a lo que volver.
  let antesDeTocar = objetivo;
  $ct.onfocus = ()=>{ reciénEnfocado = true; antesDeTocar = objetivo; marcarTodo(); };
  $ct.onmouseup = e=>{ if(reciénEnfocado){ e.preventDefault(); reciénEnfocado = false; } };
  $ct.ontouchend = ()=>{ if(reciénEnfocado){ reciénEnfocado = false; setTimeout(marcarTodo, 0); } };
  $ct.oninput = ()=>{
    // Solo cifras: si escribe una letra o un signo, se quita en el momento en
    // vez de dejar el campo en un estado que luego no vale.
    const limpio = String($ct.value).replace(/[^\d]/g, '').slice(0, 6);
    if(limpio !== $ct.value) $ct.value = limpio;
    if(!limpio) return;                       // campo vacío: no se toca nada
    const v = parseInt(limpio, 10);
    if(!(v > 0)) return;
    objetivo = v;
    objetivoTocado = Math.abs(v - total) > 0.5;
    clearTimeout(tCalc);
    tCalc = setTimeout(()=>{ recalcularLote(); pintarLote(); marcarAtajo(); }, 250);
  };
  // Si se queda vacío y se va a otra cosa, se devuelve la cantidad que hay
  // puesta: un campo vacío no dice nada y el reparto de abajo sí existe.
  $ct.onblur = ()=>{ if(!$ct.value) $ct.value = objetivo; };
  $ct.onkeydown = e=>{
    if(e.key === 'Enter'){ e.preventDefault(); $ct.blur(); }   // cierra el teclado
    if(e.key === 'Escape'){
      e.preventDefault();
      clearTimeout(tCalc);
      ponerObjetivo(antesDeTocar, Math.abs(antesDeTocar - total) <= 0.5);
      $ct.blur();
    }
  };
  for(const b of $ficha.querySelectorAll('[data-restaurar]'))
    b.onclick = ()=>restaurar(f, +b.dataset.restaurar);
  document.getElementById('btn-etiqueta').onclick = ()=>etiqueta(f,
    lote ? lote.cantidades : f.ingredientes.map(i=>i.cantidad),
    lote ? lote.total : total);
  document.getElementById('btn-preparar').onclick = ()=>preparar(f);
  document.getElementById('btn-editar').onclick = ()=>editar(f);
  document.getElementById('btn-duplicar').onclick = ()=>duplicar(f);
  document.getElementById('btn-borrar').onclick = ()=>borrar(f);
}

/* Un ingrediente que la migración no pudo enlazar sola. En vez de dejarlo en
   un limbo hasta que alguien reescriba el fichero, se resuelve aquí, con las
   dos recetas delante para poder compararlas. */
function resolvedor(i, k){
  const cands = (i.candidatos||[]).map(c=>porId.get(c.id)).filter(Boolean);
  if(i.resuelto){
    const sub = i.tipo==='formula' ? porId.get(i.ref) : null;
    return (sub?`<button data-ir="${sub.id}">Ver su fórmula →</button>`:`<small>Pigmento</small>`)
      + `<button class="rectificar" data-abrir-rect="${k}">Cambiar esta decisión</button>`;
  }

  // De nada sirve enseñar la receta entera de cada candidato: dos fórmulas casi
  // gemelas comparten todo menos un ingrediente, y eso es justo lo que se corta
  // al final de la línea. Se muestra SOLO aquello en lo que se diferencian.
  const cant = f => new Map(f.ingredientes.map(x=>[x.nombre, x.cantidad]));
  const mapas = cands.map(cant);
  const nombres = [...new Set(cands.flatMap(f=>f.ingredientes.map(x=>x.nombre)))];
  const distintos = cands.length > 1
    ? nombres.filter(n => new Set(mapas.map(m=>m.has(n)?m.get(n):null)).size > 1)
    : [];

  const opts = cands.map((f,j)=>{
    const m = mapas[j];
    const linea = distintos.length
      ? distintos.map(n=>`${esc(n)} ${m.has(n)?fmt(m.get(n)):'—'}`).join(' · ')
      : f.ingredientes.map(x=>`${esc(x.nombre)} ${fmt(x.cantidad)}`).join(' · ');
    return `<button class="cand" data-resolver="${k}" data-cand="${f.id}">
      <i style="background:${color(f).hex}"></i>
      <span><b>${esc(f.nombre)}</b><em>${distintos.length?'se diferencia en · ':''}${linea}</em></span></button>`;
  }).join('');
  return `<div class="pendiente-caja">
    <small>${i.motivo? esc(i.motivo[0].toUpperCase()+i.motivo.slice(1))+'. ' : ''}¿Cuál es?</small>
    <div class="cands">${opts}
      <button class="cand no" data-resolver="${k}" data-cand="">Ninguna: es un pigmento</button>
    </div></div>`;
}

let rectificando = null;
function resolvedorAbierto(i, k){
  const guardado = i.resuelto; i = {...i, resuelto:false};
  return resolvedor(i, k);
}

/* El bote de 1 kg no se llena hasta arriba: hay que poder batirlo. Por eso el
   atajo apunta a 900 g y nunca se pasa de 950. */
const TOPE_BOTE = {900: 950, 4500: 4750};
/* Todo lo que cambia cuando cambias los gramos, y NADA más. Existe para poder
   repintar solo esto mientras se escribe la cantidad: repintando la ficha
   entera se destruía el campo a media palabra (ver pintarLote). */
/* Los atajos de cantidad, UNA sola lista.

   Antes había dos juegos distintos para la misma decisión: en la ficha
   "×1 ×2 ×3" y en el pesaje "250 g / 500 g". La misma pregunta con botones
   diferentes según por dónde entraras. */
function atajosCantidad(base){
  const r = Math.round(base);
  return [
    {c:'bote1',  g: 900,   txt: 'Bote 1 kg', pista: 'Dejando sitio para batir (900 g)'},
    {c:'bote5',  g: 4500,  txt: 'Bote 5 kg', pista: 'Dejando sitio para batir (4500 g)'},
    {c:'receta', g: r,     txt: 'La receta', pista: `${fmt(r)} g, tal como la tienes guardada`},
    {c:'x2',     g: r * 2, txt: '×2',        pista: `${fmt(r*2)} g`},
    {c:'x3',     g: r * 3, txt: '×3',        pista: `${fmt(r*3)} g`},
  ];
}

function zonaLote(f, total, totalMovido){
  return `${notaLote(total)}
    <div class="tarjeta-cuerpo">
      ${barraProporcion(f, total)}
      ${f.ingredientes.map((i,k)=>filaIng(i,total,k)).join('')}
      <div class="total${totalMovido?' cambia':''}"><span>Total</span><span class="num">${fmt(lote?lote.total:0)} g</span></div>
    </div>`;
}

/* Repinta SOLO el reparto en gramos, dejando en paz el campo de la cantidad.

   Antes esto llamaba a pintarFicha(), que rehace la ficha entera y con ella el
   <input>. Con un temporizador de 320 ms por medio, el resultado era que el
   campo desaparecía y volvía a nacer mientras escribías: borrabas el 65 y un
   tercio de segundo después reaparecía solo. De ahí que no hubiera manera de
   escribir una cantidad. */
function pintarLote(){
  const f = porId.get(seleccion);
  if(!f) return;
  const total = f.ingredientes.reduce((s,i)=>s+i.cantidad,0);
  const movido = ultimosGramos && ultimosGramos.total !== undefined
                 && ultimosGramos.total !== (lote?lote.total:0);
  const z = document.getElementById('zona-lote');
  if(z) z.innerHTML = zonaLote(f, total, movido);
  const d = document.getElementById('zona-desarrollo');
  if(d) d.innerHTML = f.ingredientes.some(i=>i.tipo==='formula') ? tarjetaDesarrollo(f) : '';
  ultimosGramos = lote ? lote.cantidades.slice() : f.ingredientes.map(i=>i.cantidad);
  ultimosGramos.total = lote ? lote.total : 0;
  enlazarZonaLote(f);
}

/* Los botones que viven DENTRO de la zona que se repinta hay que volver a
   engancharlos cada vez. Si se olvida uno, deja de responder y no lo dice. */
function enlazarZonaLote(f){
  for(const b of $ficha.querySelectorAll('[data-fiable]'))
    b.onclick = ()=>{ ponerObjetivo(+b.dataset.fiable); };
  for(const b of $ficha.querySelectorAll('[data-ir]'))
    b.onclick = ()=>abrir(b.dataset.ir, b.querySelector('i'));
  for(const b of $ficha.querySelectorAll('[data-resolver]'))
    b.onclick = ()=>resolverIngrediente(f, +b.dataset.resolver, b.dataset.cand);
  for(const b of $ficha.querySelectorAll('[data-abrir-rect]'))
    b.onclick = ()=>{ rectificando = +b.dataset.abrirRect; pintarFicha(); };
}

/** Poner una cantidad desde un botón: actualiza el campo y repinta el reparto. */
function ponerObjetivo(gramos, esLaReceta){
  objetivo = gramos;
  objetivoTocado = !esLaReceta;
  const el = document.getElementById('calc-total');
  if(el) el.value = gramos;
  recalcularLote();
  pintarLote();
  marcarAtajo();
}
/** Deja encendido el atajo que coincide con la cantidad puesta. */
function marcarAtajo(){
  for(const b of $ficha.querySelectorAll('.multi [data-cant]'))
    b.setAttribute('aria-pressed', String(+b.dataset.cant === objetivo));
}

function notaLote(total){
  if(!lote) return `<div class="calc-nota avisa">Esa cantidad no se puede repartir
    en gramos enteros. Sube el lote.</div>`;
  if(lote.tuya && lote.impesable)
    return `<div class="calc-nota avisa">Esta es tu receta tal cual la tienes guardada,
      pero lleva cantidades por debajo de 1 g que tu báscula no distingue.
      Para prepararla bien hay que hacer un lote mayor.</div>`;
  if(lote.exacto && lote.total===objetivo)
    return `<div class="calc-nota exacta">Salen <b>${fmt(lote.total)} g</b> justos,
      con la proporción <b>exacta</b>.</div>`;
  if(lote.exacto)
    return `<div class="calc-nota exacta">Con báscula de gramo lo más cercano son
      <b>${fmt(lote.total)} g</b> — proporción <b>exacta</b>
      (×${(lote.total/total).toFixed(2).replace(/\.?0+$/,'')} de la receta).</div>`;
  // Si el redondeo deforma la fórmula de verdad, hay que decirlo y ofrecer salida.
  if(lote.error > 0.02){
    const f = loteFiable(porId.get(seleccion).ingredientes.map(i=>i.cantidad), objetivo, PRECISION);
    return `<div class="calc-nota avisa">A <b>${fmt(objetivo)} g</b> algún ingrediente
      queda por debajo de lo que distingue la báscula y la fórmula se deforma un
      <b>${(lote.error*100).toFixed(0)}%</b>: el color saldría distinto.
      ${f?`<button class="pes-sube" data-fiable="${f.total}">Hacer ${fmt(f.total)} g</button>
           <span style="opacity:.75">(×${f.veces}, proporción exacta)</span>`:''}</div>`;
  }
  return `<div class="calc-nota">Con báscula de gramo lo más cercano son
    <b>${fmt(lote.total)} g</b> — la proporción se desvía como mucho un
    <b>${(lote.error*100).toFixed(1)}%</b>, que no se nota.</div>`;
}

function recalcularLote(){
  const f = porId.get(seleccion);
  if(!f){ lote = null; return; }
  const cant = f.ingredientes.map(i=>i.cantidad);
  const base = cant.reduce((a,b)=>a+b,0);

  // REGLA INTOCABLE: si no has pedido otra cantidad, se enseña tu receta TAL CUAL,
  // aunque lleve medio gramo de algo. La app avisa de lo que no se puede pesar,
  // pero no reescribe por su cuenta lo que tú tienes guardado.
  // Se mira si la has tocado, no si los números se parecen: una receta de 100,5 g
  // redondea a 101 y la comparación numérica fallaba justo en ese caso.
  if(!objetivoTocado){
    lote = {total: base, cantidades: cant, error: 0, distancia: 0,
            exacto: true, tuya: true,
            impesable: cant.some(c=>c>0 && c < PRECISION)};
    return;
  }
  lote = lotePractico(cant, objetivo, {paso: PRECISION, tope: TOPE_BOTE[objetivo] || Infinity});
}

function filaIng(i, total, idx){
  const m = i.tipo==='materia' ? materias.get(i.ref) : null;
  const sub = i.tipo==='formula' ? porId.get(i.ref) : null;
  const hex = m?.hex_referencia || (sub ? color(sub).hex : null);
  const pct = total>0 ? (i.cantidad/total*100) : 0;
  const g = lote ? lote.cantidades[idx] : i.cantidad;
  // Idea 9: si este gramaje ha cambiado respecto al repintado anterior, se
  // marca un segundo. Antes cambiaban en silencio y no sabías si te había
  // hecho caso o si te habías equivocado de botón.
  const movido = ultimosGramos && ultimosGramos[idx] !== undefined
                 && ultimosGramos[idx] !== g;
  return `<div class="ing">
    <div class="ing-color" style="background:${hex||'repeating-linear-gradient(45deg,var(--linea),var(--linea) 5px,var(--panel-2) 5px,var(--panel-2) 10px)'}"></div>
    <div class="ing-nom">${esc(i.nombre)}
      ${i.resuelto && rectificando!==idx ? resolvedor(i, idx)
        : i.resuelto ? resolvedorAbierto(i, idx)
        : sub ? `<button data-ir="${sub.id}">Ver su fórmula →</button>`
        : i.tipo==='sin_resolver' ? resolvedor(i, idx)
        : m && m.abierto ? `<small>Eliges cuál al preparar</small>`
        : m && m.familia!=='base' ? `<small>Pigmento</small>` : ''}
    </div>
    <span class="ing-pct num">${Math.round(pct)}%</span>
    <span class="ing-g num${movido?' cambia':''}" data-ing="${i.cantidad}">${fmt(g)}<em>g</em></span>
  </div>`;
}

function tarjetaDesarrollo(f){
  const {partes, total} = desarrollar(f.id, indice);
  if(!total) return '';
  // Se escala al lote que esté puesto en la calculadora, y en gramos enteros.
  const escala = lote ? lote.total/total : 1;
  const filas = [...partes.entries()].sort((a,b)=>b[1]-a[1]).map(([id,g])=>{
    const m = materias.get(id);
    return `<div class="ing">
      <div class="ing-color" style="background:${m?.hex_referencia||'var(--linea)'}"></div>
      <div class="ing-nom">${esc(m?m.nombre:'?')}</div>
      <span class="ing-pct num">${Math.round(g/total*100)}%</span>
      <span class="ing-g num">${fmt(Math.round(g*escala))}<em>g</em></span>
    </div>`;
  }).join('');
  return `<div class="tarjeta"><div class="tarjeta-cab"><h3>Desarrollada hasta materias primas</h3>
    <span class="etiqueta">lleva otras fórmulas dentro</span></div>
    <div class="tarjeta-cuerpo">${filas}</div></div>`;
}

function resolverIngrediente(f, k, idCand){
  if(!puedeEditar) return brindis(SIN_PERMISO);
  const ings = f.ingredientes.map(x=>({...x}));
  const ing = ings[k];
  // Vale tanto para decidir por primera vez como para rectificar una decisión
  // ya tomada: si no, el botón "Cambiar esta decisión" se ve pero no hace nada.
  if(!ing || (ing.tipo!=='sin_resolver' && !ing.resuelto)) return;
  if(idCand){
    const destino = porId.get(idCand);
    if(!destino) return;
    ings[k] = {tipo:'formula', ref:idCand, nombre:ing.nombre, cantidad:ing.cantidad,
                candidatos:ing.candidatos, motivo:ing.motivo, resuelto:true};
    anotar(f, {ingredientes:ings});
    brindis(`"${ing.nombre}" enlazado a ${destino.nombre}`);
  }else{
    // No es ninguna fórmula: se da de alta como materia prima, sin color
    // asignado, para no inventarse de qué color es.
    let mp = DATOS.materias_primas.find(m=>norm(m.nombre)===norm(ing.nombre));
    if(!mp){
      mp = {id:'mp-nueva-'+Date.now().toString(36), nombre:ing.nombre, tipo:'pigmento',
            familia:'pigmento', hex_referencia:null, opacidad:null, fuerza:1,
            revisar:true, calibrado:false, estimado:false, sugerencias:[],
            nota:'Dada de alta desde la app. Falta confirmar su color.'};
      DATOS.materias_primas.push(mp); materias.set(mp.id, mp);
      cambios.materias = cambios.materias || [];
      cambios.materias.push(mp);
      empujarMateria(mp);
    }
    ings[k] = {tipo:'materia', ref:mp.id, nombre:ing.nombre, cantidad:ing.cantidad,
                candidatos:ing.candidatos, motivo:ing.motivo, resuelto:true};
    anotar(f, {ingredientes:ings});
    brindis(`"${ing.nombre}" guardado como materia prima`);
  }
  rectificando = null;
  limpiarMateriasHuerfanas();
  reconstruir(); pintarFicha(); actualizar();
}

/* El porqué, en palabras. El BOTÓN está arriba, en el sello: aquí solo se
   cuenta en qué situación está y por qué, que es lo que no cabe en un sello. */
function explicaActualizacion(f){
  const e = estadoAct(f);
  if(e.aldia) return `<p class="estado-act ok">Hecha con los pigmentos nuevos${
    f.fecha_actualizacion ? ', marcada el <b>' + fecha(f.fecha_actualizacion) + '</b>' : ''}.</p>`;
  if(e.motivo === 'pigmento') return `<p class="estado-act avisa">Estaba dada por buena${
    f.fecha_actualizacion ? ' el ' + fecha(f.fecha_actualizacion) : ''}, pero después
    ${e.cambiados.length === 1 ? 'cambió' : 'cambiaron'}
    ${e.cambiados.map(m=>`<b>${esc(m.nombre)}</b> (${fecha(m.cambiado_el)})`).join(', ')}.
    Hay que volver a mirarla.</p>`;
  return `<p class="estado-act">Todavía con las cantidades antiguas: nadie la ha
    dado por buena con los pigmentos de ahora.</p>`;
}

function botonEnlace(h){
  return `<button class="enlace" data-ir="${h.id}"><i style="background:${color(h).hex}"></i>${esc(h.nombre)}</button>`;
}
const fecha = s => s ? new Date(s).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'}) : '';
/** Día y hora, para "al día hasta las…". Hoy solo la hora: decir la fecha de
    hoy no informa de nada y hace la frase más larga de leer. */
function momento(s){
  if(!s) return '';
  const d = new Date(s);
  if(isNaN(d)) return '';
  const hoy = new Date().toDateString() === d.toDateString();
  return d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}) +
         (hoy ? '' : ' del ' + fecha(s));
}
const fmtPlano = n => String(Math.round(n*100)/100);

/* ═══════════════════════════════════════════════════════════════════
   MODO PESAJE
   Pensado para el taller: el móvil en la mesa, la báscula al lado y las
   manos sucias. Números grandes y pocas cosas en pantalla.

   Lo importante es la corrección: si te pasas con un pigmento NO se puede
   quitar, así que la única salida es subir el lote entero hasta que ese
   exceso vuelva a estar en proporción.

       T = max( lo que pediste ,  para cada echado: real_i / proporción_i )

   Con báscula de 1 g todo se redondea a gramos enteros: pedirle a alguien
   que pese 0,4 g es pedirle que adivine.
   ═══════════════════════════════════════════════════════════════════ */
const PRECISION = 1;          // gramos que distingue la báscula
let pes = null;

/* ── La pantalla no se apaga mientras pesas ──────────────────────────────

   Con el bote delante y las manos llenas de pigmento, que el móvil se apague
   a los treinta segundos obliga a tocarlo para despertarlo. Justo lo que no
   debería pasar.

   Se pide sólo mientras hay una pesada abierta, y se suelta al cerrarla: un
   candado que se queda puesto se come la batería del taller en una mañana.
   Donde el navegador no lo soporte (iPhone por debajo de iOS 16.4) no pasa
   nada: sigue funcionando todo, solo que la pantalla se apaga como siempre. */
let candadoPantalla = null;
let quierePantalla = false;
let pidiendoPantalla = false;

async function mantenerPantalla(si){
  quierePantalla = si;
  try{
    if(si){
      if(candadoPantalla || pidiendoPantalla || !navigator.wakeLock) return !!candadoPantalla;
      pidiendoPantalla = true;
      candadoPantalla = await navigator.wakeLock.request('screen');
      candadoPantalla.addEventListener?.('release', ()=>{ candadoPantalla = null; });
    }else if(candadoPantalla){
      const c = candadoPantalla; candadoPantalla = null; await c.release();
    }
  }catch(_){ candadoPantalla = null; }
  finally{ pidiendoPantalla = false; }
  return !!candadoPantalla;
}
// El navegador suelta el candado en cuanto la app se va a segundo plano. Sin
// volver a pedirlo, la pantalla se apagaba sola a partir de la segunda vez.
document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && quierePantalla && !candadoPantalla) mantenerPantalla(true);
});

/* ── Que no se pierda un pesaje a medias ─────────────────────────────────

   Estás pesando 5 kg, te llaman, el móvil se bloquea o se cierra la app, y al
   volver empezabas de cero: con el bote a medias y sin saber qué llevabas
   echado. En un taller eso pasa todas las semanas.

   Se guarda lo IMPRESCINDIBLE y por identificador, no el objeto entero: la
   fórmula puede haber cambiado por el camino (o venir cambiada de la nube), y
   revivir una copia vieja sería peor que perderla. Al volver se rehace el
   plan con la receta que haya AHORA, y si algo no cuadra se dice.  */
const CLAVE_PESAJE = 'pesaje-a-medias';
const VIDA_PESAJE = 36 * 3600 * 1000;   // pasado un día y medio ya no es de hoy

function guardarPesaje(){
  try{
    if(!pes || pes.paso !== 2 || !pes.hechos.size)
      return localStorage.removeItem(CLAVE_PESAJE);
    localStorage.setItem(CLAVE_PESAJE, JSON.stringify({
      id: pes.f.id, objetivo: pes.objetivo, modo: pes.modo,
      hechos: [...pes.hechos], cuando: Date.now(),
      // Con qué ingredientes se empezó. Si la receta cambia mientras pesas,
      // lo ya marcado deja de querer decir lo mismo y hay que descartarlo.
      huella: pes.ing.map(i=>i.nombre + ':' + i.cantidad).join('|'),
    }));
  }catch(_){ /* sin sitio para guardar: se sigue, pero sin red de seguridad */ }
}

function leerPesajeGuardado(){
  try{
    const g = JSON.parse(localStorage.getItem(CLAVE_PESAJE) || 'null');
    if(!g || !g.id || !Array.isArray(g.hechos) || !g.hechos.length) return null;
    if(Date.now() - (g.cuando || 0) > VIDA_PESAJE) throw 0;
    const f = porId.get(g.id);
    if(!f) throw 0;
    const ing = f.ingredientes.filter(i=>i.cantidad > 0);
    if(ing.map(i=>i.nombre + ':' + i.cantidad).join('|') !== g.huella) throw 0;
    return {g, f, ing};
  }catch(_){
    try{ localStorage.removeItem(CLAVE_PESAJE); }catch(__){}
    return null;
  }
}

/** Retoma el pesaje guardado. Devuelve false si ya no vale. */
function retomarPesaje(){
  const v = leerPesajeGuardado();
  if(!v) return false;
  const base = v.ing.reduce((s,i)=>s+i.cantidad,0);
  pes = {f: v.f, ing: v.ing, base, prop: v.ing.map(i=>i.cantidad/base),
         objetivo: v.g.objetivo, modo: v.g.modo || leerModo(),
         hechos: new Map(v.g.hechos), paso: 2, lote: null, recien: null};
  congelarPlan();
  pintarPesaje();
  if(!$dlg.open) $dlg.showModal();
  return true;
}

function preparar(f){
  const ing = f.ingredientes.filter(i=>i.cantidad>0);
  const base = ing.reduce((s,i)=>s+i.cantidad,0);
  if(!ing.length || !base) return brindis('Esta fórmula no tiene cantidades');
  // Se entra DIRECTO a pesar, con la cantidad que ya hay puesta en la ficha.
  // Antes preguntaba otra vez lo mismo —y encima con otros atajos—: la misma
  // decisión dos veces. Cambiarla sigue estando, en "Cambiar cantidad".
  pes = {f, ing, base, prop: ing.map(i=>i.cantidad/base),
         objetivo: objetivo > 0 ? objetivo : Math.round(base),
         modo: leerModo(), hechos: new Map(), paso: 2, lote: null, recien: null};
  congelarPlan();
  pintarPesaje();
  $dlg.showModal();
}
// Por defecto, tarando: cada número es lo de ese ingrediente y no hay nada
// que confundir. El acumulado sigue estando, pero hay que pedirlo.
const leerModo = ()=>{ try{ return localStorage.getItem('modo-pesaje')||'individual'; }catch(_){ return 'individual'; } };

/** Lote mínimo para que hasta el ingrediente más pequeño se pueda pesar. */
function loteMinimo(){
  const menor = Math.min(...pes.ing.map(i=>i.cantidad));
  return Math.ceil(pes.base * PRECISION / menor - 1e-9);
}

/** El reparto se calcula UNA VEZ al empezar y se congela.

    Antes se recalculaba en cada repintado, y en cuanto marcabas el primer
    ingrediente el plan saltaba de los 897 g calculados a los 900 que habías
    pedido: el blanco pasaba de 675 a 677 y te pedía 2 g más de algo que ya
    estaba bien. Mientras se pesa, los números no se mueven. */
function congelarPlan(){
  const cant = pes.ing.map(i=>i.cantidad);
  pes.lote = lotePractico(cant, pes.objetivo,
                          {paso: PRECISION, tope: TOPE_BOTE[pes.objetivo] || Infinity})
          || {total: pes.objetivo, cantidades: pes.prop.map(p=>Math.max(PRECISION, Math.round(pes.objetivo*p)))};
}

/** El plan de pesada, ya con los excesos absorbidos y redondeado a gramos. */
function plan(){
  if(!pes.lote) congelarPlan();
  let T = pes.lote.total;
  for(const [k, real] of pes.hechos) T = Math.max(T, real / pes.prop[k]);

  // Solo se recalcula si algún exceso obliga a subir el lote. Si no, mandan
  // los números con los que empezaste.
  let obj = pes.lote.cantidades;
  if(T > pes.lote.total + 1e-9){
    const re = lotePractico(pes.ing.map(i=>i.cantidad), Math.ceil(T),
                            {paso: PRECISION, abajo: 1, arriba: 1.06});
    obj = re ? re.cantidades : pes.prop.map(p=>Math.round(T*p));
  }
  let acum = 0;
  return {
    total: obj.reduce((s,x)=>s+x,0),
    crecio: Math.round(T) > pes.objetivo,
    filas: pes.ing.map((i,k)=>{
      acum += obj[k];
      const real = pes.hechos.get(k);
      return {i, k, objetivo: obj[k], acumulado: acum, real,
              falta: real===undefined ? obj[k] : Math.max(0, obj[k]-real),
              impesable: obj[k] < PRECISION};
    }),
  };
}

function pintarPesaje(){
  if(!pes) return;
  const f = pes.f;
  if(pes.paso === 1){
    const min = loteMinimo();
    $dt.textContent = 'Preparar ' + f.nombre;
    $dc.innerHTML = `
      <label class="campo"><span>¿Cuántos gramos vas a preparar?</span>
        <input id="pes-cant" class="num" type="number" inputmode="numeric" min="1" step="1"
               value="${pes.objetivo}" style="font-size:22px;font-weight:700;text-align:right"></label>
      <div class="pes-chips">${atajosCantidad(pes.base).map(a=>
        `<button class="btn" data-cant="${a.g}" data-atajo="${a.c}">${a.txt} <em>(${fmt(a.g)} g)</em></button>`).join('')}
      </div>
      <div id="pes-aviso"></div>`;
    const $c = document.getElementById('pes-cant');
    const avisar = ()=>{
      const v = parseFloat($c.value)||0;
      document.getElementById('pes-aviso').innerHTML = v>0 && v<min
        ? `<div class="aviso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.2v.1"/></svg>
           <span>Con báscula de 1 g, por debajo de <b>${fmt(min)} g</b> algún ingrediente de esta fórmula
           no se puede pesar bien y el color saldrá distinto.
           <button class="pes-sube" data-cant="${min}">Preparar ${fmt(min)} g</button></span></div>`
        : '';
    };
    $c.oninput = avisar; avisar();
    $dc.onclick = e=>{
      const b = e.target.closest('[data-cant]');
      if(b){ $c.value = b.dataset.cant; avisar(); }
    };
    $dp.innerHTML = `<button class="btn" data-cerrar>Cancelar</button>
                     <button class="btn btn-1" id="pes-ir">Empezar a pesar</button>`;
    $dp.querySelector('[data-cerrar]').onclick = ()=>{ pes=null; $dlg.close(); };
    document.getElementById('pes-ir').onclick = ()=>{
      const v = Math.round(parseFloat($c.value));
      if(!(v>0)) return brindis('Pon cuántos gramos quieres');
      pes.objetivo = v; pes.paso = 2; pes.hechos.clear(); congelarPlan(); pintarPesaje();
    };
    return;
  }

  const p = plan();
  const hechas = p.filas.filter(x=>x.falta===0).length;
  $dt.textContent = f.nombre;
  $dc.innerHTML = `
    <div class="pes-cab">
      <div><b class="num">${fmt(p.total)} g</b><small id="pes-sub">total del lote</small></div>
      <div class="pes-modo">
        <button data-modo="individual" aria-pressed="${pes.modo==='individual'}"
          title="Pones a cero la báscula entre cada ingrediente">Tarando</button>
        <button data-modo="acumulado" aria-pressed="${pes.modo==='acumulado'}"
          title="Todo en el mismo bote, sin poner a cero">Sin tarar</button>
      </div>
    </div>
    <div class="pes-barra"><i style="width:${hechas/p.filas.length*100}%"></i></div>
    ${p.crecio ? `<div class="aviso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.2v.1"/></svg>
       <span>Te has pasado con algo, así que <b>el lote sube a ${fmt(p.total)} g</b> para que las proporciones sigan bien. Lo de más ya está descontado abajo.</span></div>`:''}
    ${(()=>{ const min = loteMinimo();
      // Se mira el LOTE MÍNIMO, no solo si alguna fila baja de 1 g. Redondeando,
      // una receta de 998 g con un ingrediente de 1 g pedida a 100 g sale con
      // todas las filas por encima de 1 g... y con las proporciones destrozadas.
      // Ese aviso vivía en la pantalla de la cantidad, que ya no se pasa por
      // ella, y se había quedado sin sitio.
      if(!(pes.objetivo < min) && !p.filas.some(x=>x.impesable)) return '';
      return `<div class="aviso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.2v.1"/></svg>
       <span>Con báscula de 1 g, por debajo de <b>${fmt(min)} g</b> algún ingrediente
       de esta fórmula no se pesa bien y el color saldrá distinto.
       <button class="pes-sube" data-subir="${min}">Subir a ${fmt(min)} g</button></span></div>`;
    })()}
    <div class="pes-lista">
      ${p.filas.map(x=>filaPesaje(x, pes.modo, x.k === pes.recien)).join('')}
    </div>`;
  // La animación se dispara al crearse la fila, así que el aviso se consume:
  // si no, cada repintado la haría revivir.
  pes.recien = null;
  mantenerPantalla(true).then(puesto=>{
    const el = document.getElementById('pes-sub');
    if(puesto && el) el.textContent = 'total del lote · la pantalla no se apaga';
  });
  $dp.innerHTML = `<button class="btn" id="pes-atras">Cambiar cantidad</button>
    <button class="btn" id="pes-etiqueta" title="Para pegar en el bote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5h6.6c.5 0 1 .2 1.4.6l6.9 6.9a2 2 0 0 1 0 2.8l-4.1 4.1a2 2 0 0 1-2.8 0l-6.9-6.9A2 2 0 0 1 6 11.1V7.5z"/><path d="M8.2 8.2v.01"/></svg>
      Etiqueta</button>
    <button class="btn ${hechas===p.filas.length?'btn-1':''}" id="pes-fin">
      ${hechas===p.filas.length?'Terminado':'Cerrar'}</button>`;

  for(const b of $dc.querySelectorAll('[data-modo]'))
    b.onclick = ()=>{ pes.modo = b.dataset.modo;
      try{ localStorage.setItem('modo-pesaje', pes.modo); }catch(_){}
      pintarPesaje(); };
  for(const b of $dc.querySelectorAll('[data-echar]'))
    b.onclick = ()=>{ const k=+b.dataset.echar;
      pes.hechos.set(k, plan().filas[k].objetivo);
      pes.recien = k;               // solo esta fila hace el barrido verde
      pintarPesaje(); guardarPesaje(); };
  for(const b of $dc.querySelectorAll('[data-deshacer]'))
    b.onclick = ()=>{ pes.hechos.delete(+b.dataset.deshacer);
      pes.recien = null; pintarPesaje(); guardarPesaje(); };
  for(const b of $dc.querySelectorAll('[data-ajustar]'))
    b.onclick = ()=>ajustar(+b.dataset.ajustar);
  for(const b of $dc.querySelectorAll('[data-subir]'))
    b.onclick = ()=>{ pes.objetivo = +b.dataset.subir; pes.hechos.clear();
      pes.lote = null; congelarPlan(); pintarPesaje(); };
  document.getElementById('pes-atras').onclick = ()=>{ pes.paso=1; pes.lote=null; pes.recien=null; pintarPesaje(); };
  // Cambiar de cantidad vacía lo pesado, así que ya no hay nada que retomar.
  document.getElementById('pes-ir')?.addEventListener('click', guardarPesaje);
  // La etiqueta del pesaje lleva las cantidades REALES del lote que estás
  // haciendo, no las de la receta: si te has pasado y el lote ha subido, la
  // etiqueta tiene que decir lo que hay dentro del bote.
  document.getElementById('pes-etiqueta').onclick = ()=>
    etiqueta(f, p.filas.map(x=>x.objetivo), p.total, pes.ing.map(i=>i.nombre));
  document.getElementById('pes-fin').onclick = ()=>{
    if(hechas===p.filas.length) apuntarPreparacion(f, p.total);
    else if(pes.hechos.size){
      // Cerrar con el bote a medias NO tira el trabajo: se guarda y se dice.
      guardarPesaje(); pes=null; $dlg.close();
      return brindis('Pesaje guardado: puedes seguir donde lo dejaste');
    }
    try{ localStorage.removeItem(CLAVE_PESAJE); }catch(_){}
    pes=null; $dlg.close();
  };
}

function filaPesaje(x, modo, recien){
  const m = x.i.tipo==='materia' ? materias.get(x.i.ref) : null;
  const sub = x.i.tipo==='formula' ? porId.get(x.i.ref) : null;
  const hex = m?.hex_referencia || (sub ? color(sub).hex : null);
  const listo = x.falta === 0;

  // REGLA DE SEGURIDAD: el número grande es SIEMPRE lo que hay que echar de
  // este ingrediente. Antes, en modo sin tarar, el número gordo era lo que
  // marcaría la báscula acumulado (528) y la cantidad real (360) iba en gris
  // y pequeña debajo: quien fuera con prisa echaba 528. Eso no puede pasar.
  const echar = x.falta || x.objetivo;
  return `<div class="pes-fila${listo?' listo':''}${listo&&recien?' recien':''}">
    <div class="pes-color" style="background:${hex||'var(--linea)'}"></div>
    <div class="pes-nom">${esc(x.i.nombre)}
      ${modo==='acumulado' && !listo
        ? `<small class="bascula">la báscula marcará <b>${fmt(x.acumulado)} g</b></small>` : ''}
      ${x.real!==undefined && x.real!==x.objetivo ? `<small class="ojo">echaste ${fmt(x.real)}</small>` : ''}
    </div>
    <div class="pes-g num">${listo ? '<span class="pes-ok">✓</span>'
        : `<span class="pes-mas">+</span>${fmt(echar)}<em>g a echar</em>`}</div>
    <div class="pes-btn">
      ${listo
        ? `<button class="btn" data-deshacer="${x.k}">Deshacer</button>`
        : `<button class="btn btn-1" data-echar="${x.k}">Echado</button>
           <button class="btn" data-ajustar="${x.k}" title="Me he pasado">Me pasé</button>`}
    </div>
  </div>`;
}

function ajustar(k){
  const x = plan().filas[k];
  const prev = {t:$dt.textContent, c:$dc.innerHTML, p:$dp.innerHTML};
  $dt.textContent = '¿Cuánto has echado?';
  $dc.innerHTML = `
    <p style="margin:0 0 12px">De <b>${esc(x.i.nombre)}</b> tocaban <b class="num">${fmt(x.objetivo)} g</b>.
       Pon lo que marca la báscula de verdad.</p>
    <label class="campo"><span>Gramos echados</span>
      <input id="aj-g" class="num" type="number" inputmode="decimal" min="0" step="any"
             value="${fmt(x.objetivo)}" style="font-size:22px;font-weight:700;text-align:right"></label>
    <p style="margin:0;font-size:13.5px;color:var(--texto-2)">Si te has pasado, subiré el lote entero
       para que las proporciones sigan cuadrando. No hace falta tirar nada.</p>`;
  $dp.innerHTML = `<button class="btn" id="aj-no">Cancelar</button>
                   <button class="btn btn-1" id="aj-si">Guardar</button>`;
  document.getElementById('aj-no').onclick = ()=>{
    $dt.textContent=prev.t; $dc.innerHTML=prev.c; $dp.innerHTML=prev.p; pintarPesaje(); };
  document.getElementById('aj-si').onclick = ()=>{
    const v = parseFloat(String(document.getElementById('aj-g').value).replace(',','.'));
    if(!(v>0)) return brindis('Pon una cantidad');
    pes.hechos.set(k, v); pintarPesaje(); guardarPesaje();
  };
  document.getElementById('aj-g').select();
}

/** Deja constancia de que este color se ha preparado: con el tiempo dirá
    cuáles están vivos y cuáles se pueden archivar. */
/* ═══════════════════════════════════════════════════════════════════
   EL CUADERNO: QUÉ SE HA PREPARADO Y QUÉ DÍA

   Idea de Juanjo. La mitad ya estaba: cada pesada terminada dejaba fecha y
   gramos DENTRO de la fórmula. Lo que no había era la pantalla que lo junta
   todo, ni —lo importante— apuntes del taller.

   Y sin el taller esto no sirve: los botes los hace el taller, así que un
   cuaderno que solo apunta lo del jefe nace vacío. Por eso los apuntes viven
   en su propia tabla, donde el taller puede AÑADIR y nada más: no puede tocar
   una fórmula, ni borrar un apunte, ni corregir el suyo (ver esquema.sql).

   Cada apunte guarda el NOMBRE copiado además del id de la fórmula. Si mañana
   la renombras o la borras, el cuaderno sigue diciendo qué se hizo aquel día;
   un historial que se reescribe solo no es un historial.
   ═══════════════════════════════════════════════════════════════════ */
/** "Hoy", "Ayer" o el día con su nombre. Un cuaderno se lee por días. */
function diaDe(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const suyo = new Date(d); suyo.setHours(0,0,0,0);
  const dias = Math.round((hoy - suyo) / 86400000);
  if(dias === 0) return 'Hoy';
  if(dias === 1) return 'Ayer';
  // Mayúscula solo en la primera letra. Con text-transform:capitalize salía
  // "Lunes, 31 De Agosto", que no es como se escribe en castellano.
  const t = d.toLocaleDateString('es-ES',
    {weekday:'long', day:'numeric', month:'long',
     ...(d.getFullYear() !== hoy.getFullYear() ? {year:'numeric'} : {})});
  return t.charAt(0).toUpperCase() + t.slice(1);
}
const horaDe = iso => {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
};
const quienDe = e => e.papel === 'taller' ? 'Taller' : 'Juanjo';

let topeHist = 60;      // se enseña de poco en poco: son cientos de líneas

function pantallaHistorial(){
  const pintar = ()=>{
    // Del más nuevo al más viejo: lo que interesa es lo de hoy.
    const todo = HISTORIAL.slice().reverse();
    const trozo = todo.slice(0, topeHist);
    $dt.textContent = 'Lo que se ha preparado';

    if(!todo.length){
      $dc.innerHTML = `<div class="rep-fin" style="padding:26px 0">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.6v14.8M8.6 19.4h6.8M4.4 8h15.2"/><path d="M4.4 8 2.2 12.9a2.4 2.4 0 0 0 4.4 0L4.4 8Z"/><path d="M19.6 8l-2.2 4.9a2.4 2.4 0 0 0 4.4 0L19.6 8Z"/></svg>
        <b>Todavía no hay nada apuntado</b>
        <p>Cada vez que alguien termine un pesaje, quedará aquí el color, los
          gramos y el día. No hay que apuntar nada a mano.</p></div>`;
      $dp.innerHTML = `<button class="btn btn-1" data-cerrar>Cerrar</button>`;
      $dp.querySelector('[data-cerrar]').onclick = ()=>$dlg.close();
      return;
    }

    // Se agrupa por día, que es como se mira un cuaderno.
    let dia = null;
    const filas = [];
    for(const e of trozo){
      const d = diaDe(e.cuando);
      if(d !== dia){
        dia = d;
        const delDia = todo.filter(x=>diaDe(x.cuando) === d);
        const kg = delDia.reduce((t,x)=>t + (+x.gramos||0), 0);
        filas.push(`<div class="hist-dia"><span>${esc(d)}</span>
          <small>${delDia.length} bote${delDia.length===1?'':'s'} · ${
            kg >= 1000 ? (kg/1000).toFixed(1).replace('.',',') + ' kg' : fmt(kg) + ' g'}</small></div>`);
      }
      const f = porId.get(e.formula);
      const hex = f ? color(f).hex : null;
      // La FILA entera es el botón, no el nombre: diez nombres subrayados
      // seguidos hacen ruido, y con las manos sucias se agradece un blanco
      // grande donde dar. Las de fórmulas borradas no llevan a ningún sitio.
      filas.push(f
        ? `<button class="hist hist-ir" data-ir-h="${esc(e.formula)}">
             <div class="hist-color" style="background:${hex}"></div>
             <div class="hist-nom">${esc(e.nombre)}
               <small>${esc(horaDe(e.cuando))} · ${esc(quienDe(e))}</small></div>
             <div class="hist-g num">${fmt(e.gramos)}<em>g</em></div>
             <svg class="hist-mas-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
           </button>`
        : `<div class="hist">
             <div class="hist-color" style="background:repeating-linear-gradient(45deg,var(--linea),var(--linea) 5px,var(--panel-2) 5px,var(--panel-2) 10px)"></div>
             <div class="hist-nom">${esc(e.nombre)} <small>${esc(horaDe(e.cuando))} · ${
               esc(quienDe(e))} · esta fórmula ya no existe</small></div>
             <div class="hist-g num">${fmt(e.gramos)}<em>g</em></div>
           </div>`);
    }
    $dc.innerHTML = `<div class="hist-lista">${filas.join('')}</div>` +
      (todo.length > topeHist
        ? `<button class="btn" id="hist-mas" style="margin-top:14px;width:100%">
             Ver más (quedan ${todo.length - topeHist})</button>` : '');
    $dp.innerHTML = `<button class="btn btn-1" data-cerrar>Cerrar</button>`;
    $dp.querySelector('[data-cerrar]').onclick = ()=>$dlg.close();
    document.getElementById('hist-mas')?.addEventListener('click', ()=>{
      topeHist += 100; pintar();
    });
    for(const b of $dc.querySelectorAll('[data-ir-h]'))
      b.onclick = ()=>{ const id = b.dataset.irH; cerrarTodo(); setTimeout(()=>abrir(id), 60); };
  };
  topeHist = 60;
  pintar();
  if(!$dlg.open) $dlg.showModal();
}

const CLAVE_HISTORIAL = 'historial-preparaciones';
const TOPE_HISTORIAL = 1200;      // lo que cabe sin ahogar el navegador
let HISTORIAL = [];
HISTORIAL = leerHistorialLocal();
/* La primera descarga de la nube trae el cuaderno dentro de DATOS (ver
   montarDatos en nube.js). Se saca de ahí y se guarda en su sitio: DATOS es
   el recetario, y mezclarlos haría que cada guardado del espejo arrastrara
   mil apuntes que no cambian. */
if(DATOS.historial){ fundirHistorial(DATOS.historial); delete DATOS.historial; }

function leerHistorialLocal(){
  try{ const h = JSON.parse(localStorage.getItem(CLAVE_HISTORIAL) || '[]');
       return Array.isArray(h) ? h : []; }catch(_){ return []; }
}
function guardarHistorialLocal(){
  try{ localStorage.setItem(CLAVE_HISTORIAL,
         JSON.stringify(HISTORIAL.slice(-TOPE_HISTORIAL))); }catch(_){}
}

/** Mete apuntes sin repetir (llegan de la nube y de aquí). */
function fundirHistorial(entradas){
  if(!entradas?.length) return 0;
  const hay = new Set(HISTORIAL.map(x=>x.id));
  let n = 0;
  for(const e of entradas){
    if(!e || !e.id || hay.has(e.id)) continue;
    hay.add(e.id); HISTORIAL.push(e); n++;
  }
  if(n){
    HISTORIAL.sort((a,b)=> String(a.cuando).localeCompare(String(b.cuando)));
    if(HISTORIAL.length > TOPE_HISTORIAL) HISTORIAL = HISTORIAL.slice(-TOPE_HISTORIAL);
    guardarHistorialLocal();
  }
  return n;
}

const prepsDe = id => HISTORIAL.filter(e=>e.formula === id);

function apuntarPreparacion(f, gramos){
  try{ localStorage.removeItem(CLAVE_PESAJE); }catch(_){}
  const e = {
    id: 'p-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
    formula: f.id, nombre: f.nombre, gramos,
    cuando: new Date().toISOString(),
    papel: ROL,
  };
  HISTORIAL.push(e);
  guardarHistorialLocal();
  // A la nube va SIEMPRE, lo haga quien lo haga: es el único apunte que el
  // taller tiene permiso para escribir, y es justo el que da sentido a esto.
  if(MODO === 'nube')
    nube.guardarPreparacion(e).catch(err=>falloNube(err));
  brindis('Apuntado: ' + fmt(gramos) + ' g de ' + f.nombre);
  pintarFicha(); actualizar();
}

const $dlg = document.getElementById('dlg');
const $dc = document.getElementById('dlg-cuerpo');

const $dt = document.getElementById('dlg-titulo');

   despiste. */

   Con Escape, tocando fuera o con la flecha de atrás del móvil también. */

/* ═══════════════════════════════════════════════════════════════════
   BUSCADOR DE INGREDIENTES
   Un desplegable con 900 entradas no se usa: se sufre. Aquí se escribe
   y se filtra. "rojo" saca todos los rojos, "rojo 3" saca ese.
   Las bases van siempre primero: son las que se usan a diario.
   ═══════════════════════════════════════════════════════════════════ */
function catalogo(){
  const out = [];
  for(const m of DATOS.materias_primas){
    out.push({v:'mp:'+m.id, nombre:m.nombre, hex:m.hex_referencia,
              grupo: m.familia==='base' ? 'Color base' : 'Pigmento',
              rango: m.familia==='base' ? 0 : 1});
  }
  for(const x of DATOS.formulas){
    out.push({v:'f:'+x.id, nombre:x.nombre, formula:x, grupo:'Fórmula', rango:2});
  }
  for(const o of out) o.n = norm(o.nombre);
  return out;
}

function selectorIngrediente(valor){
  const items = catalogo();
  const porV = new Map(items.map(i=>[i.v,i]));
  let sel = porV.get(valor) || null;
  let activo = 0, abierto = false, lista = [];

  const caja = document.createElement('div');
  caja.className = 'busc';
  caja.innerHTML = `
    <div class="busc-campo">
      <span class="busc-color"></span>
      <input class="busc-q" type="text" autocomplete="off" spellcheck="false"
             placeholder="Escribe un color o pigmento…" role="combobox"
             aria-expanded="false" aria-autocomplete="list">
    </div>
    <div class="busc-lista" role="listbox" hidden></div>`;
  const $q = caja.querySelector('.busc-q');
  const $c = caja.querySelector('.busc-color');
  const $l = caja.querySelector('.busc-lista');

  const colorDe = i => i.hex || (i.formula ? color(i.formula).hex : null);
  function pintarSel(){
    $q.value = sel ? sel.nombre : '';
    const h = sel ? colorDe(sel) : null;
    // Cadena vacía QUITA el estilo en línea. Con 'transparent' se quedaba puesto
    // y tapaba el rayado que marca "todavía sin elegir".
    $c.style.background = h || '';
    $c.classList.toggle('busc-sin-color', !h);
  }

  function buscar(t){
    const q = norm(t);
    if(!q) return items.slice().sort((a,b)=>a.rango-b.rango||a.nombre.localeCompare(b.nombre,'es')).slice(0,60);
    const pal = q.split(' ');
    const res = [];
    for(const i of items){
      if(!pal.every(p=>i.n.includes(p))) continue;
      // exacto primero, luego lo que empieza igual, luego lo que lo contiene
      const p = i.n === q ? 0 : i.n.startsWith(q) ? 1 : 2;
      res.push({i, p});
    }
    res.sort((a,b)=> a.p-b.p || a.i.rango-b.i.rango ||
                     a.i.nombre.length-b.i.nombre.length ||
                     a.i.nombre.localeCompare(b.i.nombre,'es'));
    return res.slice(0,60).map(r=>r.i);
  }

  function pintarLista(){
    if(!lista.length){
      $l.innerHTML = `<div class="busc-nada">Ningún color o pigmento con ese nombre</div>`;
      return;
    }
    let grupo = null, html = '';
    lista.forEach((i,k)=>{
      if(i.grupo !== grupo){ grupo = i.grupo; html += `<div class="busc-grupo">${grupo}</div>`; }
      const h = colorDe(i);
      html += `<button type="button" class="busc-op${k===activo?' on':''}" data-k="${k}" role="option"
        aria-selected="${k===activo}"><i style="background:${h||'var(--linea)'}"></i>${esc(i.nombre)}</button>`;
    });
    $l.innerHTML = html;
    $l.querySelector('.on')?.scrollIntoView({block:'nearest'});
  }

  function abrir(){
    abierto = true; $l.hidden = false; $q.setAttribute('aria-expanded','true');
    lista = buscar($q.value === (sel?sel.nombre:'') ? '' : $q.value);
    activo = 0; pintarLista();
  }
  function cerrar(){
    abierto = false; $l.hidden = true; $q.setAttribute('aria-expanded','false');
  }
  function elegir(k){
    if(!lista[k]) return;
    sel = lista[k]; pintarSel(); cerrar();
  }

  $q.addEventListener('focus', ()=>{ $q.select(); abrir(); });
  $q.addEventListener('input', ()=>{
    lista = buscar($q.value); activo = 0;
    if(!abierto) abrir(); else pintarLista();
  });
  $q.addEventListener('keydown', e=>{
    if(e.key==='ArrowDown' || e.key==='ArrowUp'){
      e.preventDefault();
      if(!abierto) return abrir();
      activo = Math.max(0, Math.min(lista.length-1, activo + (e.key==='ArrowDown'?1:-1)));
      pintarLista();
    }else if(e.key==='Enter'){
      if(abierto){ e.preventDefault(); elegir(activo); }
    }else if(e.key==='Escape'){
      // El diálogo se cierra solo con Escape. Si hay una búsqueda abierta,
      // Escape debe cerrar SOLO la búsqueda: si no, se pierde toda la edición.
      if(abierto){ e.preventDefault(); e.stopPropagation(); cerrar(); pintarSel(); }
    }
  });
  $l.addEventListener('mousedown', e=>{      // antes del blur, o no llega el clic
    const b = e.target.closest('.busc-op');
    if(b){ e.preventDefault(); elegir(+b.dataset.k); $q.focus(); }
  });
  $q.addEventListener('blur', ()=>{
    setTimeout(()=>{ if(abierto) cerrar(); pintarSel(); }, 120);
  });

  pintarSel();
  return { el: caja, get: ()=> sel ? sel.v : '', foco: ()=>$q.focus() };
}

function editar(f, esNueva=false, alSalir=null){
  if(!puedeEditar) return brindis(SIN_PERMISO);
  $dt.textContent = esNueva ? 'Nueva fórmula' : 'Editar fórmula';
  $dc.innerHTML = `
    <label class="campo"><span>Nombre</span>
      <input id="ed-nombre" value="${esc(f.nombre)}" placeholder="Ej. AZUL 123 (CLIENTE)" autocomplete="off"></label>
    <div class="campo"><span>Ingredientes</span>
      <div class="rejilla-ing" id="ed-ing"></div>
      <button class="btn" style="margin-top:9px" id="ed-add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Añadir ingrediente</button>
    </div>
    <label class="campo"><span>Notas (opcional)</span>
      <textarea id="ed-notas" placeholder="Observaciones, cliente, referencia…">${esc(f.notas||'')}</textarea></label>
    <label class="campo"><span>Motivo del cambio (queda en el historial)</span>
      <input id="ed-motivo" placeholder="Ej. Ajuste a los pigmentos nuevos" autocomplete="off"></label>`;
  const $ing = document.getElementById('ed-ing');
  const selectores = new Map();
  const addFila = (ref='', cant='', enfocar=false)=>{
    const d = document.createElement('div');
    d.className='fila-ing';
    const sel = selectorIngrediente(ref);
    d.appendChild(sel.el);
    d.insertAdjacentHTML('beforeend',
      `<input type="number" inputmode="decimal" step="any" min="0" value="${cant}" placeholder="g" aria-label="Gramos">
       <button class="btn-icono" type="button" aria-label="Quitar ingrediente">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>`);
    selectores.set(d, sel);
    d.querySelector('.btn-icono').onclick = ()=>{ selectores.delete(d); d.remove(); };
    $ing.appendChild(d);
    if(enfocar) sel.foco();
  };
  for(const i of f.ingredientes){
    if(i.tipo==='sin_resolver') addFila('', i.cantidad);
    else addFila((i.tipo==='materia'?'mp:':'f:')+i.ref, i.cantidad);
  }
  if(!f.ingredientes.length) addFila();
  document.getElementById('ed-add').onclick = ()=>addFila('', '', true);

  $dp.innerHTML = `<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-1" id="ed-guardar">Guardar</button>`;
  // Si vienes del repaso, cancelar te devuelve al repaso en vez de cerrarte
  // el diálogo y hacerte empezar de cero.
  $dp.querySelector('[data-cerrar]').onclick = alSalir ? ()=>alSalir(false) : ()=>$dlg.close();
  document.getElementById('ed-guardar').onclick = ()=>{
    const nombre = document.getElementById('ed-nombre').value.trim().toUpperCase();
    if(!nombre) return brindis('Ponle un nombre');
    const repe = DATOS.formulas.find(x=>x.id!==f.id && norm(x.nombre)===norm(nombre));
    if(repe) return brindis(`Ya existe "${repe.nombre}"`);
    const ings = [];
    for(const d of $ing.children){
      const v = selectores.get(d)?.get() || '';
      // Ojo: la fila tiene dos inputs (el buscador y los gramos). Hay que pedir
      // el numérico por su tipo, o se lee el nombre del color como si fuera una cifra.
      const c = parseFloat(String(d.querySelector('input[type=number]').value).replace(',','.'));
      if(!v || !isFinite(c) || c<=0) continue;
      const [t,id] = v.split(':');
      const nom = t==='mp' ? materias.get(id).nombre : porId.get(id).nombre;
      ings.push({tipo: t==='mp'?'materia':'formula', ref:id, nombre:nom, cantidad:c});
    }
    if(!ings.length) return brindis('Añade al menos un ingrediente con cantidad');

    const hist = (f.historial||[]).slice();
    if(!esNueva){
      hist.push({fecha:new Date().toISOString(),
                 texto: document.getElementById('ed-motivo').value.trim() || 'Cambio de fórmula',
                 nombre: f.nombre, ingredientes: f.ingredientes});
    }
    const parche = {
      nombre, ingredientes: ings, historial: hist,
      notas: document.getElementById('ed-notas').value.trim(),
      total: Math.round(ings.reduce((s,i)=>s+i.cantidad,0)*10000)/10000,
      fecha_actualizacion: new Date().toISOString(),
    };
    const renombrada = !esNueva && nombre !== f.nombre;
    let ok;
    if(esNueva){
      Object.assign(f, parche);
      cambios.nuevas.push(f);
      DATOS.formulas.push(f); porId.set(f.id,f);
      busq.push({f, n:norm(f.nombre), ing:norm(ings.map(i=>i.nombre).join(' '))});
      ok = guardar();
      empujar(f);
    }else{
      ok = anotar(f, parche);
      const e = busq.find(x=>x.f.id===f.id);
      if(e){ e.n = norm(nombre); e.ing = norm(ings.map(i=>i.nombre).join(' ')); }
    }
    // Cada ingrediente guarda una COPIA del nombre de la fórmula a la que
    // apunta, para poder enseñarlo sin resolver nada. Al renombrar hay que ir
    // a corregir esa copia en todas las que la llevan dentro: si no, la
    // etiqueta del bote y el PDF impreso siguen diciendo el nombre viejo, y
    // buscar por el nuevo no las encuentra. Comprobado.
    if(renombrada) propagarNombre(f, nombre);
    // Y la lista va en orden alfabético: si no se reordena, la fórmula
    // renombrada se queda donde estaba y los separadores de letra salen A, Z, A.
    if(renombrada || esNueva)
      DATOS.formulas.sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));

    reconstruir();
    if(alSalir){ if(ok) brindis('Guardado'); actualizar(); return alSalir(true, f); }
    $dlg.close(); if(ok) brindis('Guardado'); abrir(f.id); actualizar();
  };
  if(!$dlg.open) $dlg.showModal();
}

/** Corrige el nombre copiado en todas las fórmulas que llevan esta dentro. */
function propagarNombre(f, nombre){
  const padres = [...(usadaPor.get(f.id) || [])].map(x=>porId.get(x)).filter(Boolean);
  for(const pa of padres){
    let tocada = false;
    const ings = pa.ingredientes.map(i=>{
      if(i.tipo === 'formula' && i.ref === f.id && i.nombre !== nombre){
        tocada = true; return {...i, nombre};
      }
      return i;
    });
    if(!tocada) continue;
    anotar(pa, {ingredientes: ings});
    const e = busq.find(x=>x.f.id === pa.id);
    if(e) e.ing = norm(ings.map(i=>i.nombre).join(' '));
  }
  if(padres.length) brindis(`Nombre corregido en ${padres.length} fórmula${padres.length===1?'':'s'} que la llevan dentro`);
}

function duplicar(f){
  if(!puedeEditar) return brindis(SIN_PERMISO);
  const nuevo = JSON.parse(JSON.stringify(f));
  nuevo.id = 'f-nueva-'+Date.now().toString(36);
  nuevo.nombre = f.nombre+' (COPIA)';
  nuevo.historial = []; nuevo.equivalencia = null;
  editar(nuevo, true);
}
function nueva(){
  if(!puedeEditar) return brindis(SIN_PERMISO);
  editar({id:'f-nueva-'+Date.now().toString(36), nombre:'', ingredientes:[],
          historial:[], notas:'', actualizada_pigmentos:false,
          fecha_actualizacion:null, equivalencia:null}, true);
}
function borrar(f){
  if(!puedeEditar) return brindis(SIN_PERMISO);
  const usan = [...(usadaPor.get(f.id)||[])];
  $dt.textContent = 'Eliminar fórmula';
  $dc.innerHTML = `<p style="margin:0 0 10px">¿Seguro que quieres eliminar <b>${esc(f.nombre)}</b>?</p>`+
    (usan.length?`<div class="aviso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.2v.1"/></svg>
      <span>La llevan dentro <b>${usan.length} fórmula${usan.length===1?'':'s'}</b>. Si la borras, ${usan.length===1?'esa fórmula se queda':'esas fórmulas se quedan'} sin ese ingrediente.</span></div>`:'')+
    `<p style="font-size:13.5px;color:var(--texto-3);margin:12px 0 0">Se puede recuperar desde Opciones → Deshacer todos mis cambios.</p>`;
  $dp.innerHTML = `<button class="btn" data-cerrar>Cancelar</button><button class="btn btn-peligro" id="conf-borrar" style="border-color:var(--rojo)">Eliminar</button>`;
  $dp.querySelector('[data-cerrar]').onclick = ()=>$dlg.close();
  document.getElementById('conf-borrar').onclick = ()=>{
    // OJO al orden: primero se saca de DATOS y DESPUÉS se guarda. Al revés,
    // en modo nube el espejo se grababa con la fórmula todavía dentro y
    // reaparecía al abrir la app.
    cambios.borradas.push(f.id);
    DATOS.formulas = DATOS.formulas.filter(x=>x.id!==f.id);
    porId.delete(f.id);
    const k = busq.findIndex(x=>x.f.id===f.id); if(k>=0) busq.splice(k,1);
    guardar();
    // En la nube no se borra de verdad: se marca. Así el móvil del taller se
    // entera de que ya no está; si se quitara la fila, no habría nada que
    // contarle y la seguiría enseñando para siempre.
    empujar({...f, borrada:true});
    reconstruir(); cerrarTodo(); actualizar(); brindis('Eliminada');
  };
  $dlg.showModal();
}
function restaurar(f, k){
  if(!puedeEditar) return brindis(SIN_PERMISO);
  const h = f.historial[k];
  if(!h) return;
  const hist = f.historial.slice();
  hist.push({fecha:new Date().toISOString(), texto:`Restaurada la versión del ${fecha(h.fecha)}`,
             nombre:f.nombre, ingredientes:f.ingredientes});
  anotar(f, {ingredientes:h.ingredientes, nombre:h.nombre||f.nombre, historial:hist,
             total:Math.round(h.ingredientes.reduce((s,i)=>s+i.cantidad,0)*10000)/10000});
  objetivo = Math.round(h.ingredientes.reduce((s,i)=>s+i.cantidad,0));
  objetivoTocado = false;
  reconstruir(); pintarFicha(); actualizar(); brindis('Versión restaurada');
}
function reconstruir(){
  indice = crearIndice(DATOS);
  cacheColor.clear();
  calcularMateriasDe();
  usadaPor.clear();
  for(const f of DATOS.formulas)
    for(const i of f.ingredientes)
      if(i.tipo==='formula'){
        if(!usadaPor.has(i.ref)) usadaPor.set(i.ref,new Set());
        usadaPor.get(i.ref).add(f.id);
      }
}

/* ═══════════════════════════════════════════════════════════════════
   SINCRONIZAR

   Cómo se entera un móvil de que has tocado una fórmula en el PC: cada fila
   del servidor lleva una marca de tiempo que rellena la propia base de datos
   al escribir. Sincronizar es preguntar "dame lo que tenga marca posterior a
   la última que vi". No se comparan 860 fórmulas ni se baja nada dos veces.

   Se pregunta cada 15 segundos, y ADEMÁS cada vez que la app vuelve a primer
   plano. Eso segundo es lo que importa de verdad en el taller: coges el móvil
   del bolsillo y lo primero que hace es ponerse al día.

   Por qué preguntando y no con una conexión permanente: una conexión
   permanente en el wifi de una nave se cae, y cuando se cae dejas de
   enterarte de todo SIN QUE TE LO DIGA NADIE. Preguntar no se rompe: si una
   vuelta falla, la siguiente trae lo que faltaba.
   ═══════════════════════════════════════════════════════════════════ */
const $piloto = document.getElementById('sync-piloto');
const TEXTO_SYNC = {
  'al-dia':    'Al día',
  'subiendo':  'Guardando…',
  'pendiente': 'Sin guardar en la nube',
  'sin-red':   'Sin conexión',
  'error':     'Error al sincronizar',
};
function marcarSync(estado){
  estadoSync = estado;
  if(MODO !== 'nube' || !$piloto) return;
  const pend = nube.pendientes();
  const visible = estado !== 'al-dia' || pend > 0;
  $piloto.hidden = !visible;
  if(!visible) return;
  $piloto.dataset.estado = estado;
  $piloto.querySelector('span').textContent =
    pend && estado !== 'subiendo'
      ? `${pend} sin subir`
      : (TEXTO_SYNC[estado] || '');
}

let sincronizando = false;
async function sincronizar(porQue){
  if(MODO !== 'nube' || sincronizando) return;
  sincronizando = true;
  try{
    // Primero lo que este aparato debe, luego lo que le falta. En ese orden:
    // si se baja antes de subir, lo que hay en la cola podría quedar tapado
    // por una versión más vieja del servidor.
    if(nube.pendientes()){ marcarSync('subiendo'); await nube.vaciarCola(); }
    const res = await nube.bajar(ultimaSync);
    const n = aplicarDeLaNube(res);
    ultimaSync = res.hasta || ultimaSync;
    if(n){
      reconstruir(); actualizar();
      if(document.body.dataset.ficha === 'on' && seleccion) pintarFicha();
      brindis(n === 1 ? 'Una fórmula actualizada desde la nube'
                      : `${n} cambios recibidos`);
    }
    nube.guardarEspejo(DATOS, ultimaSync, ROL);
    marcarSync('al-dia');
  }catch(e){
    if(e && e.sinRed) marcarSync('sin-red');
    else if(e && e.dormido){ marcarSync('error'); avisarDormido(); }
    else if(e && e.sesion){
      // La sesión ya no vale. Se dice y se pide entrar otra vez, sin tocar el
      // espejo: lo que hay en pantalla sigue siendo bueno.
      marcarSync('error');
      const s = await pantallaEntrar('Ha caducado la sesión. Vuelve a entrar.');
      if(s) return sincronizar('reentrar');
    }
    else marcarSync('error');
  }finally{ sincronizando = false; }
}

/** Mete en DATOS lo que ha llegado, SIN rehacerlo todo: hay índices y
    referencias vivas por media aplicación. Devuelve cuántas cosas cambiaron. */
function aplicarDeLaNube(res){
  let n = 0;
  for(const fila of res.formulas){
    const viejo = porId.get(fila.id);
    if(fila.borrada){
      if(!viejo) continue;
      DATOS.formulas = DATOS.formulas.filter(x => x.id !== fila.id);
      porId.delete(fila.id);
      const k = busq.findIndex(x => x.f.id === fila.id); if(k >= 0) busq.splice(k, 1);
      if(seleccion && seleccion.id === fila.id){ seleccion = null; cerrarFicha(); }
      n++;
      continue;
    }
    const nuevo = fila.datos;
    if(!nuevo || !nuevo.id) continue;
    if(viejo){
      // Se rellena el MISMO objeto: hay referencias a él en la selección, en
      // el índice de búsqueda y en el plan de pesaje. Cambiarlo por otro
      // dejaría media app apuntando a la versión vieja.
      if(JSON.stringify(viejo) === JSON.stringify(nuevo)) continue;
      for(const k of Object.keys(viejo)) if(!(k in nuevo)) delete viejo[k];
      Object.assign(viejo, nuevo);
      const e = busq.find(x => x.f.id === fila.id);
      if(e){ e.n = norm(viejo.nombre);
             e.ing = norm(viejo.ingredientes.map(i => i.nombre).join(' ')); }
      cacheColor.delete(fila.id);
      n++;
    }else{
      DATOS.formulas.push(nuevo);
      porId.set(nuevo.id, nuevo);
      busq.push({f: nuevo, n: norm(nuevo.nombre),
                 ing: norm(nuevo.ingredientes.map(i => i.nombre).join(' '))});
      n++;
    }
  }
  for(const fila of res.materias){
    const m = materias.get(fila.id);
    if(m){ Object.assign(m, fila.datos); }
    else{ DATOS.materias_primas.push(fila.datos); materias.set(fila.id, fila.datos); }
    n++;
  }
  const nuevasPreps = fundirHistorial(res.preparaciones || []);
  if(nuevasPreps) n += nuevasPreps;
  for(const a of res.ajustes){
    if(a.clave === 'grupos_equivalencia' && Array.isArray(a.datos)){
      DATOS.grupos_equivalencia = a.datos;
      grupos.clear(); for(const g of a.datos) grupos.set(g.id, g);
      n++;
    }else if(a.clave === 'modelo'){ DATOS.modelo = a.datos; n++; }
  }
  // Solo se reordena si ha llegado alguna fórmula: cualquiera de ellas puede
  // traer un nombre nuevo, y si no se reordena, la renombrada se queda en el
  // sitio de antes y los separadores de letra salen A, Z, A. En una vuelta
  // vacía —que son casi todas— no se toca nada.
  if(res.formulas.length)
    DATOS.formulas.sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));
  return n;
}

/* ── Cuando dos aparatos tocan la misma fórmula ──────────────────────────

   Tocas una fórmula en el móvil sin cobertura. Mientras, la tocas también en
   el PC. Al volver la señal, la del móvil subía encima y se llevaba por
   delante la del PC sin decir nada.

   Ahora la nube lo detecta antes de pisar nada (ver nube.js) y aparta esos
   cambios. Aquí se enseñan y se decide uno por uno. No se elige por ti: las
   dos versiones son trabajo tuyo y solo tú sabes cuál vale. */

function explicarCalibracion(){
  $dt.textContent = 'Por qué las muestras son orientativas';
  $dc.innerHTML = `
    <p style="margin-top:0">El color de una mezcla se calcula con mezcla <b>sustractiva</b> (la de la pintura, no la de la pantalla): por eso amarillo y azul dan verde y no gris.</p>
    <p>Pero para calcularlo hay que saber de qué color exacto es cada una de las 12 bases. Ahora mismo esos valores están <b>estimados a partir de los nombres de tus propias 860 fórmulas</b>: si una se llama «naranja algo», el resultado tiene que salir naranja. Con eso el acierto pasó del 53% al 62%.</p>
    <p><b>Para afinarlo de verdad</b> hacen falta muestras físicas: una pastilla de cada base sobre goma, fotografiada junto a un papel blanco con la misma luz. Con esas 12 fotos el cálculo deja de ser una estimación.</p>
    <p style="color:var(--texto-2);font-size:14px">Lo que no se podrá simular nunca es el <b>brillo</b> de metalizados, nácares y purpurinas, ni los <b>fluorescentes</b>, que emiten luz y se salen de lo que puede mostrar una pantalla. Esas fórmulas van avisadas.</p>`;
  $dp.innerHTML = `<button class="btn btn-1" data-cerrar>Entendido</button>`;
  $dp.querySelector('[data-cerrar]').onclick = ()=>$dlg.close();
  if(!$dlg.open) $dlg.showModal();
}

/* ═══════════════════════════════════════════════════════════════════
   REPASO DE PIGMENTOS

   El taller cambió de pigmentos: hay fórmulas cuyas cantidades ya no valen.
   La app lo sabía marcar desde el primer día, pero marcar 860 fórmulas
   buscándolas una a una en el buscador no lo hace nadie.

   Esto las va pasando de una en una, sobre lo que tengas filtrado, saltándose
   las que ya están marcadas. Dos caminos por fórmula:

     · "Está bien"        -> la marca y pasa a la siguiente
     · "Hay que cambiarla" -> abre el editor y, al guardar, la marca y sigue

   Y un tercero, "Saltar", para las que no tengas claras: se quedan sin marcar
   y volverán a salir la próxima vez. Nada se marca por descuido.
   ═══════════════════════════════════════════════════════════════════ */
let repaso = null;

/* ═══════════════════════════════════════════════════════════════════
   HE CAMBIADO UN PIGMENTO

   La pantalla que faltaba. Aquí se apunta lo que pasa de verdad en la nave:
   llega un bote de un pigmento de otro proveedor, o de otro lote, y a partir de ese
   día todas las fórmulas que lo llevan hay que volver a mirarlas.

   Marcando el pigmento se marcan de golpe las 47 que lo usan —incluidas las
   que lo llevan a través de otra fórmula, que a mano no las encuentras—, y
   además queda apuntado CUÁNDO, que es lo que permite saber si una fórmula
   que diste por buena en marzo sigue valiendo hoy.
   ═══════════════════════════════════════════════════════════════════ */
/** Cuántas fórmulas llevan esta materia, contando las anidadas. */
function cuantasLlevan(idMateria){
  let n = 0;
  for(const f of DATOS.formulas) if(materiasDe.get(f.id)?.has(idMateria)) n++;
  return n;
}

/* ═══════════════════════════════════════════════════════════════════
   CAMBIAR CONTRASEÑAS  ·  PUBLICAR

   Una página colgada NO puede reescribirse a sí misma en el servidor. Así que
   cambiar una contraseña no es apretar un botón y ya: hay que generar un
   archivo nuevo y volver a subirlo. Se hace aquí entero, en el navegador, y lo
   único que queda por hacer a mano es arrastrarlo a GitHub.

   Dos decisiones importantes:

   1) Al cambiar contraseñas se genera una CLAVE DE DATOS NUEVA y se vuelve a
      cifrar todo. Consecuencia: todos los móviles y ordenadores que tuvieran
      la sesión recordada vuelven a pedir la contraseña.

      Eso no es un efecto secundario, es el objetivo. Si cambias la del taller
      porque alguien se ha ido, con el teléfono de esa persona ya dentro, sin
      cambiar la clave de datos seguiría entrando: guardaba la clave, no la
      contraseña. Rehaciendo el cifrado, se queda fuera.

   2) De paso se pueden meter TUS CAMBIOS en el archivo nuevo. Hasta que
      montemos el servidor, esta es la única forma de que lo que editas en el
      PC llegue a los móviles del taller: editas, generas, subes.
   ═══════════════════════════════════════════════════════════════════ */
const VUELTAS_CLAVE = 600000;

async function envolverClave(K, passwd){
  const sal = crypto.getRandomValues(new Uint8Array(16));
  const iv  = crypto.getRandomValues(new Uint8Array(12));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(passwd),
                                             'PBKDF2', false, ['deriveKey']);
  const kr = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: sal, iterations: VUELTAS_CLAVE, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt']);
  return {sal: aB64(sal), iv: aB64(iv),
          k: aB64(await crypto.subtle.encrypt({name:'AES-GCM', iv}, kr, K))};
}

/** Monta el sobre cifrado: se comprime y luego se cifra, en ese orden. */
async function montarSobre(texto, claves){
  const K = crypto.getRandomValues(new Uint8Array(32));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const gz = new Blob([new TextEncoder().encode(texto)]).stream()
               .pipeThrough(new CompressionStream('gzip'));
  const crudo = await new Response(gz).arrayBuffer();
  const clave = await crypto.subtle.importKey('raw', K, {name:'AES-GCM'}, false, ['encrypt']);
  const roles = {};
  for(const [rol, p] of Object.entries(claves)) roles[rol] = await envolverClave(K, p);
  return JSON.stringify({
    cifrado: 1, vueltas: VUELTAS_CLAVE, iv: aB64(iv),
    datos: aB64(await crypto.subtle.encrypt({name:'AES-GCM', iv}, clave, crudo)),
    roles,
  });
}

/* ═══════════════════════════════════════════════════════════════════
   PUBLICAR LOS CAMBIOS

   Esto es lo que hacía falta y estaba escondido dentro de "Cambiar
   contraseñas", donde nadie lo iba a encontrar.

   Lo que editas se guarda en ESTE aparato. Los móviles del taller no se
   enteran de nada hasta que se sube un archivo nuevo con tus cambios dentro.
   Publicar es exactamente eso, y no tiene nada que ver con las contraseñas:

     · se vuelve a cifrar con la MISMA clave que ya está en el archivo, así que
       las contraseñas siguen siendo las de siempre y NADIE tiene que volver a
       entrar. (Cambiar contraseñas hace lo contrario a propósito: clave nueva,
       y todo el mundo fuera.)
     · se descarga un index.html que sustituye al de GitHub.

   Cuando montemos el servidor esto desaparece y pasa solo.
   ═══════════════════════════════════════════════════════════════════ */
async function envolverConLaMismaClave(texto){
  const fuente = await (await fetch(location.href, {cache:'reload'})).text();
  const m = fuente.match(/(<script id="datos-json"[^>]*>)([\s\S]*?)(<\/script>)/);
  if(!m) throw new Error('fuente');

  let sobre;
  if(CLAVE_DATOS){
    const viejo = JSON.parse(m[2].replace(/<\\\//g, '</'));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const gz = new Blob([new TextEncoder().encode(texto)]).stream()
                 .pipeThrough(new CompressionStream('gzip'));
    const crudo = await new Response(gz).arrayBuffer();
    const clave = await crypto.subtle.importKey('raw', CLAVE_DATOS, {name:'AES-GCM'}, false, ['encrypt']);
    sobre = JSON.stringify({
      cifrado: 1, vueltas: viejo.vueltas, iv: aB64(iv),
      datos: aB64(await crypto.subtle.encrypt({name:'AES-GCM', iv}, clave, crudo)),
      roles: viejo.roles,             // las mismas contraseñas de siempre
    });
  }else{
    sobre = texto;                    // construcción sin cifrar
  }
  // Se corta y se pega por posición, no con replace(): el contenido nuevo lleva
  // barras y dólares que replace() interpretaría como referencias.
  const dentro = m[1] + sobre.replace(/<\//g, '<\\/') + m[3];
  return fuente.slice(0, m.index) + dentro + fuente.slice(m.index + m[0].length);
}

function descargarHtml(texto){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], {type:'text/html'}));
  a.download = 'index.html';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

          <li><b>Add file → Upload files</b>.</li>
          <li>Arrastra el <b>index.html</b> nuevo (sustituye al de antes).</li>
          <li><b>Commit changes</b>.</li>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.2v.1"/></svg>
          <span>Hasta que lo subas, todo sigue con las contraseñas de antes. En cuanto lo subas,

      $dp.innerHTML = `<button class="btn btn-1" data-cerrar>Entendido</button>`;
      $dp.querySelector('[data-cerrar]').onclick = ()=>$dlg.close();
    }catch(e){
      $b.disabled = false; $b.textContent = 'Generar archivo';
      aviso(String(e.message) === 'fuente' || String(e.name) === 'TypeError'
        ? 'Esto solo funciona con la app abierta desde su dirección de internet. ' +
          'Con el archivo suelto en el ordenador, el navegador no deja leerse a sí mismo.'
        : 'No se ha podido generar el archivo. Vuelve a intentarlo.');
    }
  };
  $dlg.showModal();
